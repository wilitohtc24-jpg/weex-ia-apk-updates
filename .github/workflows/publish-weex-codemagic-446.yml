name: Verified WEEX Codemagic 446 OTA publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-weex-codemagic-446.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and validate the already signed Android APK
        env:
          CODEMAGIC_APK_LINK: "https://api.codemagic.io/artifacts/.eJwVzktygjAAANC7uGcGQVAWXYQqjZBQ5Q8bJkKgyP9jgpy-7TvB25Xgnz7uc28uYBpIcG9hHUpVY4o0gNk7tWMGi0Edsd4s6s9ZQpGtF41IcO6bRjdO7GYGuWwILS3EznRz-iCOxxuwvpFkpCpcs542M70pg1kFJwEGSuzJyzG21nCyXbE8V_4RDzPNQmycmDUQcUIe3qKlLlZtKiFL2L23thN6Jdy6fCJNSdp-lK91GxZCs0FO0ASMZLpd844k1SuriaiqqyA5jlmVzZJEyPW6DID4oZR3DXYHmXJU8wRTrvB7gPvOjy7Ycp8Pj9TufEx9VDMtc_j31q5fTzbZMAB_rSofBx8Qr8v9w8fuF_2laz8.ZAij0fKSI9GW1UDODfujAZGj6vA"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 900 --silent --show-error "$CODEMAGIC_APK_LINK" -o WEEX-IA-Trader-release.apk
          APK=WEEX-IA-Trader-release.apk
          test "$(wc -c < "$APK")" -gt 1000000
          test "$(wc -c < "$APK")" -lt 150000000
          unzip -tq "$APK"
          # GitHub's Ubuntu runner may have no Android SDK build-tools,
          # unlike Codemagic. Install trusted distro tools if none exist.
          ROOT_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=""
          APKSIGNER=""
          if [ -d "$ROOT_SDK/build-tools" ]; then
            AAPT="$(find "$ROOT_SDK/build-tools" -type f -name aapt | sort -V | tail -1)"
            APKSIGNER="$(find "$ROOT_SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          fi
          if [ ! -x "$AAPT" ] || [ ! -x "$APKSIGNER" ]; then
            echo "No Android SDK build tools preinstalled; preparing package/signature verifiers."
            sudo apt-get update -qq >/dev/null
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq aapt apksigner >/dev/null
            AAPT="$(command -v aapt)"
            APKSIGNER="$(command -v apksigner)"
          fi
          test -x "$AAPT" && test -x "$APKSIGNER"
          echo "APK_TOOLS_READY"
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" > sign.txt 2>&1; then
            echo "APK_SIGNATURE_VERIFIER_REJECTED"
            tail -n 30 sign.txt
            exit 1
          fi
          echo "APK_SIGNATURE_REPORT_BEGIN"
          tail -n 30 sign.txt
          echo "APK_SIGNATURE_REPORT_END"
          if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' sign.txt; then
            echo "APK_V2_SIGNING_VERIFICATION_FAILED"
            exit 1
          fi
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' sign.txt | tr 'A-F' 'a-f' | head -1)"
          if [ "$SIGNER" != "5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6" ]; then
            echo "APK_CANONICAL_SIGNER_MISMATCH"
            exit 1
          fi
          echo "APK_SIGNER_AND_V2_VERIFIED"
          BADGING="$("$AAPT" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "com.wilito.weexautotrader"
          [[ "$VERSION" =~ ^[0-9]{7,10}$ ]]
          test "$VERSION" -gt 27074157
          test "$VERSION" -lt 2100000000
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          BYTES="$(wc -c < "$APK" | tr -d ' ')"
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Refusing to overwrite existing OTA tag $TAG"; exit 1; fi
          {
            echo "WEEX IA Trader signed Codemagic build 446"
            echo "APK SHA-256: $SHA"
            echo "APK bytes: $BYTES"
            echo "Package: $PACKAGE"
            echo "Android versionCode: $VERSION"
            echo "Canonical signer: $SIGNER"
            echo "The installed Android app validates SHA-256, package, version and canonical signer before installation."
          } > ota-release-notes.txt
          gh release create "$TAG" "./$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WEEX IA Trader #446 ($VERSION)" \
            --notes-file ota-release-notes.txt --latest
          echo "OTA_PUBLISHED tag=$TAG sha256=$SHA bytes=$BYTES"
