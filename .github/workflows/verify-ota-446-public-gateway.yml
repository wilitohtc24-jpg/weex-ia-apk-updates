name: Verify WEEX 446 public OTA gateway
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ota-446-public-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-client-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live read-only update_check and update_download
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://gateway-runtime-production-fc09.up.railway.app/'
          EXPECTED_VERSION=27372380
          EXPECTED_SHA=9e2cae11ea542addf85ba2afc88c6f85a0ef26cfbba543f564179a9c383ba817
          EXPECTED_BYTES=117894616
          EXPECTED_URL='https://github.com/wilitohtc24-jpg/weex-ia-apk-updates/releases/download/v27372380/WEEX-IA-Trader-release.apk'
          seen=0
          for i in $(seq 1 24); do
            if response="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 20 --retry 1 \
                -H 'Content-Type: application/json' \
                -X POST "$ENDPOINT" \
                --data '{"action":"update_check","versionCode":27074157}')"; then
              if printf '%s' "$response" | jq -e --argjson ver "$EXPECTED_VERSION" \
                 '.ok==true and .available==true and .versionCode==$ver' >/dev/null; then
                echo "OTA_UPDATE_CHECK_OK version=$EXPECTED_VERSION"
                seen=1
                break
              fi
              echo "OTA catalog warming attempt $i"
            else
              echo "OTA metadata request retry $i"
            fi
            sleep 10
          done
          test "$seen" -eq 1
          response="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 25 \
              -H 'Content-Type: application/json' \
              -X POST "$ENDPOINT" --data '{"action":"update_download"}')"
          printf '%s' "$response" | jq -e \
            --argjson ver "$EXPECTED_VERSION" \
            --arg sha "$EXPECTED_SHA" \
            --argjson bytes "$EXPECTED_BYTES" \
            --arg url "$EXPECTED_URL" \
            '.ok==true and .versionCode==$ver and .sha256==$sha and .sizeBytes==$bytes and .downloadUrl==$url' >/dev/null
          echo "OTA_UPDATE_DOWNLOAD_OK version=$EXPECTED_VERSION sha256=$EXPECTED_SHA bytes=$EXPECTED_BYTES"
