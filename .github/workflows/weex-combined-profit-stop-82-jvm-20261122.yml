# Isolated JVM regression for source of the private WEEX APK.
# NEVER build/sign/publish an APK, contact WEEX, or submit trading orders.
name: WEEX COMBINED profit stop 82 offline JVM regressions NO OTA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-combined-profit-stop-82-jvm-20261122.yml
permissions:
  contents: read
jobs:
  pure-jvm-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_SHA: fefae86f25225d1a3b4841da567cf2be5fb144cf
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
    steps:
      - name: Checkout immutable private repository without persistent credentials
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: fefae86f25225d1a3b4841da567cf2be5fb144cf
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify pinned source and no production signing artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e source/app/weex-ia-signing.jks
          grep -Fq 'gramManualFullPositionStopBlocksCandidateEvenIfPairFlagSaysUnique' source/app/src/test/java/com/wilito/weexautotrader/RealBotTpSlParentOrderStudyPolicyTest.kt
          echo SAGA_GRAM_SOURCE_PIN_VERIFIED_NO_RELEASE
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install hash-verified Kotlin 2.2.21 compiler only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o /tmp/weex-kotlinc.zip
          printf '%s  %s\n' a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714 /tmp/weex-kotlinc.zip | sha256sum -c -
          mkdir -p "$HOME/.local"
          unzip -q -o /tmp/weex-kotlinc.zip -d "$HOME/.local"
      - name: Compile source tests with offline JUnit-compatible assertion runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/saga-regression
          cat >/tmp/saga-regression/MinimalJUnit.kt <<'KOTLIN'
          package org.junit
          @Retention(AnnotationRetention.RUNTIME)
          @Target(AnnotationTarget.FUNCTION)
          annotation class Test
          object Assert {
              @JvmStatic fun assertEquals(expected: Any?, actual: Any?) {
                  if(expected != actual) throw AssertionError("expected=$expected actual=$actual")
              }
              @JvmStatic fun assertEquals(expected: Double, actual: Double, delta: Double) {
                  if(!expected.isFinite() || !actual.isFinite() ||
                      kotlin.math.abs(expected-actual)>delta)
                      throw AssertionError("expected=$expected actual=$actual tolerance=$delta")
              }
              @JvmStatic fun assertFalse(value: Boolean) {
                  if(value) throw AssertionError("expected false")
              }
              @JvmStatic fun assertTrue(value: Boolean) {
                  if(!value) throw AssertionError("expected true")
              }
              @JvmStatic fun assertNull(value: Any?) {
                  if(value!=null) throw AssertionError("expected null got=$value")
              }
          }
          KOTLIN
          cat >/tmp/saga-regression/TestMain.kt <<'KOTLIN'
          package com.wilito.weexautotrader
          import java.lang.reflect.InvocationTargetException
          fun main() {
              val classes = listOf(
                  RealStopLiquidationEvidencePolicyTest::class.java,
                  RealContinuousProfitDispatchAuditPolicyTest::class.java,
                  RealCombinedSingleBotEvidenceStudyPolicyTest::class.java,
                  RealStopTriggerBasisStudyPolicyTest::class.java,
                  RealBotTpSlParentOrderStudyPolicyTest::class.java,
                  RealWeexTriggerBasisFieldPolicyTest::class.java,
                  ContinuousNetProfitStopReadbackPolicyTest::class.java,
                  RealCombinedSignedLedgerStudyPolicyTest::class.java,
                  RealCombinedSignedTradeWindowStudyPolicyTest::class.java
              )
              var count=0
              for (clazz in classes) {
                  val instance=clazz.getDeclaredConstructor().newInstance()
                  val methods=clazz.declaredMethods.filter{
                      it.getAnnotation(org.junit.Test::class.java)!=null
                  }.sortedBy{it.name}
                  check(methods.isNotEmpty()) {"NO_TESTS_IN_${clazz.simpleName}"}
                  for(method in methods) {
                      try {
                          method.invoke(instance)
                          count++
                          println("PASS ${clazz.simpleName}.${method.name}")
                      } catch (e: InvocationTargetException) {
                          throw AssertionError("FAIL ${clazz.simpleName}.${method.name}",e.targetException)
                      }
                  }
              }
              check(count>=82) {"REGRESSION_COUNT_TOO_LOW_$count"}
              println("WEEX_SAGA_GRAM_PURE_JVM_${count}_TESTS_PASS_NO_WEEX_NO_APK_NO_OTA")
          }
          KOTLIN
          M=source/app/src/main/java/com/wilito/weexautotrader
          T=source/app/src/test/java/com/wilito/weexautotrader
          "$HOME/.local/kotlinc/bin/kotlinc" \
            "$M/RealConditionalOrder.kt" \
            "$M/RealStopLiquidationEvidencePolicy.kt" \
            "$M/RealContinuousProfitDispatchAuditPolicy.kt" \
            "$M/RealCombinedSingleBotEvidenceStudyPolicy.kt" \
            "$M/RealStopTriggerBasisStudyPolicy.kt" \
            "$M/RealBotTpSlParentOrderStudyPolicy.kt" \
            "$M/RealWeexTriggerBasisFieldPolicy.kt" \
            "$M/ContinuousNetProfitStopReadbackPolicy.kt" \
            "$M/RealCombinedSignedLedgerStudyPolicy.kt" \
            "$M/RealCombinedSignedTradeWindowStudyPolicy.kt" \
            "$T/RealStopLiquidationEvidencePolicyTest.kt" \
            "$T/RealContinuousProfitDispatchAuditPolicyTest.kt" \
            "$T/RealCombinedSingleBotEvidenceStudyPolicyTest.kt" \
            "$T/RealStopTriggerBasisStudyPolicyTest.kt" \
            "$T/RealBotTpSlParentOrderStudyPolicyTest.kt" \
            "$T/RealWeexTriggerBasisFieldPolicyTest.kt" \
            "$T/ContinuousNetProfitStopReadbackPolicyTest.kt" \
            "$T/RealCombinedSignedLedgerStudyPolicyTest.kt" \
            "$T/RealCombinedSignedTradeWindowStudyPolicyTest.kt" \
            /tmp/saga-regression/MinimalJUnit.kt /tmp/saga-regression/TestMain.kt \
            -include-runtime -d /tmp/saga-regression/tests.jar
          java -jar /tmp/saga-regression/tests.jar
