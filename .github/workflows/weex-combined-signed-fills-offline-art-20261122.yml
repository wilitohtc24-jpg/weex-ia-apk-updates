# SAGA/GRAM private-source isolated ART QA; NEVER production signer, WEEX credentials, OTA or orders.
name: WEEX COMBINED signed fills offline Android ART retained data NO OTA
on:
  push:
    branches: [main]
    paths: [.github/workflows/weex-combined-signed-fills-offline-art-20261122.yml]
permissions:
  contents: read
jobs:
  offline-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      SOURCE_SHA: 5b4dbb1254947d99f1427ee1ebee82cb136eec51
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout immutable, privately verified source
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 5b4dbb1254947d99f1427ee1ebee82cb136eec51
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Confirm source SHA, no production key, required signed STOP contracts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e app/weex-ia-signing.jks
          grep -Fq 'PR133_REAL_ONLY_PROSPECTIVE_EPISODE_INGEST_V1' app/src/main/java/com/wilito/weexautotrader/TraderService.kt
          test -f ci/preflight_full_presigning_source_v1.py
          echo PR133_ART_SOURCE_AUTHENTIC_PIN_VERIFIED
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install verified Gradle and Kotlin 2.2.21
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            "$MANAGER" 'platforms;android-35' >/dev/null
          fi
          curl -fsSL --retry 3 --retry-delay 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o /tmp/pr133-kt.zip
          printf '%s  %s\n' a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714 /tmp/pr133-kt.zip | sha256sum -c - >/dev/null
          mkdir -p "$HOME/.local"
          unzip -q -o /tmp/pr133-kt.zip -d "$HOME/.local"
          echo "$HOME/.local/kotlinc/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 --retry-delay 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/pr133-gradle.zip
          printf '%s  %s\n' 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26 /tmp/pr133-gradle.zip | sha256sum -c - >/dev/null
          mkdir -p "$HOME/.gradle-dist"
          unzip -q -o /tmp/pr133-gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          echo "GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false" >> "$GITHUB_ENV"
      - name: Independently replay full canonical pre-sign + Kotlin/JUnit before any APK
        working-directory: source
        shell: bash
        env:
          WEEX_AUDIT_RUN_ANDROID_JUNIT: "1"
          WEEX_ART_QA_EXPORT_MATERIALIZED: "1"
          WEEX_ART_QA_EXPORT_DIR: /tmp/pr133-exact-materialized
        run: |
          set -euo pipefail
          if ! python3 ci/preflight_full_presigning_source_v1.py > /tmp/pr133-art-presign.log 2>&1; then
            echo "::error::PR133_PRESIGN_OR_ANDROID_JUNIT_FAILED_NO_ART_BUILD"
            grep -E 'WEEX_PRESIGN_FIRST_FAILURE_LINE|WEEX_AUDIT_JUNIT_BUILD_FAILED|WEEX_AUDIT_KOTLIN_ERROR_COUNT|WEEX_AUDIT_JUNIT_FAILED_TESTS_COUNT' /tmp/pr133-art-presign.log | tail -8 || true
            exit 1
          fi
          grep -Fq 'WEEX_PRESIGN_SOURCE_REPLAY_PASS' /tmp/pr133-art-presign.log
          grep -Fq 'WEEX_AUDIT_JUNIT_PASS' /tmp/pr133-art-presign.log
          test -s /tmp/pr133-exact-materialized/main/java/com/wilito/weexautotrader/TraderService.kt
          test -s /tmp/pr133-exact-materialized/build.gradle.kts
          echo PR133_EXACT_MATERIALIZED_KOTLIN_JUNIT_PASS
      - name: Build disposable debug DEX and offline instrumentation APKs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main
          cp -a /tmp/pr133-exact-materialized/main app/src/main
          cp /tmp/pr133-exact-materialized/build.gradle.kts app/build.gradle.kts
          test ! -e app/weex-ia-signing.jks
          keytool -genkeypair -keystore app/weex-ia-signing.jks -storepass android -keypass android -alias weexia -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=OFFLINE-ART-PR133,OU=DISPOSABLE,O=NO-RELEASE' >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          original='abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))'
          assert s.count(original)==1
          s=s.replace(original,'abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86_64"))')
          needle='    defaultConfig {'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"',1)
          dep='    testImplementation("junit:junit:4.13.2")'
          assert s.count(dep)==1
          s=s.replace(dep,dep+'\n    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")',1)
          p.write_text(s)
          PY
          mkdir -p app/src/androidTest/java/com/wilito/weexautotrader
          cat > app/src/androidTest/java/com/wilito/weexautotrader/Pr133ArtVerifyTest.kt <<'KOTLIN'
          package com.wilito.weexautotrader
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import org.junit.Assert.assertNotNull
          import org.junit.Assert.assertTrue
          import org.junit.Assert.assertEquals
          import android.content.Context
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class Pr133ArtVerifyTest {
              @Test fun verifyWorkerDexWithoutStartingTradingService() {
                  val loader=InstrumentationRegistry.getInstrumentation().targetContext.classLoader
                  val nested=listOf("TraderService","onCreate","launchTraderLoop","workerJob","1").joinToString("$")
                  val clazz=Class.forName("com.wilito.weexautotrader."+nested,true,loader)
                  assertNotNull(clazz.getDeclaredMethod("invokeSuspend",Any::class.java))
                  assertTrue(clazz.declaredMethods.any { it.name=="invokeSuspend" })
              }
              @Test fun writeUpgradeSentinel() {
                  val context=InstrumentationRegistry.getInstrumentation().targetContext
                  assertTrue(context.getSharedPreferences("pr133_offline_art",Context.MODE_PRIVATE)
                      .edit().putString("sentinel","QA133_PRESERVE").commit())
              }
              @Test fun verifyUpgradeSentinel() {
                  val context=InstrumentationRegistry.getInstrumentation().targetContext
                  assertEquals("QA133_PRESERVE",context.getSharedPreferences("pr133_offline_art",
                      Context.MODE_PRIVATE).getString("sentinel","MISSING"))
              }
          }
          KOTLIN
          if ! gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest > /tmp/pr133-art-build.log 2>&1; then
            echo "::error::PR133_DEBUG_DEX_BUILD_FAILED"
            grep -E '^e:|error:|FAILURE:|What went wrong:|Execution failed|Could not resolve|Task .* FAILED' /tmp/pr133-art-build.log | tail -16 || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          echo PR133_DISPOSABLE_ANDROID_DEBUG_APK_NOT_FOR_OTA
      - name: Enable hardware-accelerated emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create no-network startup, DEX class-load and in-place upgrade test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr133-offline-art-runner.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/source"
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global airplane_mode_on 1
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb install -r "$APP"
          adb install -r "$TEST"
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity > /tmp/pr133-first-launch.log
          grep -q 'Status: ok' /tmp/pr133-first-launch.log
          sleep 12
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr133-art-first-crashes; then echo "::error::PR133_ART_FIRST_LAUNCH_CRASH"; exit 1; fi
          adb shell am instrument -w -e class com.wilito.weexautotrader.Pr133ArtVerifyTest#verifyWorkerDexWithoutStartingTradingService com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > /tmp/pr133-worker-art.log
          grep -Fq 'OK (1 test)' /tmp/pr133-worker-art.log || { echo "::error::PR133_WORKER_ART_VERIFY_FAILED"; exit 1; }
          adb shell am instrument -w -e class com.wilito.weexautotrader.Pr133ArtVerifyTest#writeUpgradeSentinel com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > /tmp/pr133-sentinel-write.log
          grep -Fq 'OK (1 test)' /tmp/pr133-sentinel-write.log || { echo "::error::PR133_ART_DATA_WRITE_FAILED"; exit 1; }
          # Reinstall without uninstall or clearing data.
          adb install -r "$APP"
          adb shell am instrument -w -e class com.wilito.weexautotrader.Pr133ArtVerifyTest#verifyUpgradeSentinel com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > /tmp/pr133-sentinel-read.log
          grep -Fq 'OK (1 test)' /tmp/pr133-sentinel-read.log || { echo "::error::PR133_ART_DATA_RETENTION_FAILED"; exit 1; }
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity > /tmp/pr133-after-reinstall.log
          grep -q 'Status: ok' /tmp/pr133-after-reinstall.log
          sleep 12
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr133-art-reinstall-crashes; then echo "::error::PR133_ART_REINSTALL_CRASH"; exit 1; fi
          echo PR133_OFFLINE_ART_DEX_LAUNCH_AND_DATA_RETENTION_PASS_NO_ORDERS_NO_OTA
          RUNNER
          bash -n /tmp/pr133-offline-art-runner.sh
          chmod 700 /tmp/pr133-offline-art-runner.sh
      - name: Test Android ART and data retention on isolated offline emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash /tmp/pr133-offline-art-runner.sh
