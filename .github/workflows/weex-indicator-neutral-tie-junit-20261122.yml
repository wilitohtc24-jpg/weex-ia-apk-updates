# Exact SHA pure Kotlin/JUnit regression study. Not an Android release or trading approval.
name: WEEX isolated LONG SHORT neutral tie JUnit QA (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-indicator-neutral-tie-junit-20261122.yml
permissions:
  contents: read
jobs:
  direction-neutral-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 45a0c230606cb85af3e3b1996cf552d1cdb23798
      INDICATORS_BLOB: 63c055d9dc3d5541e24b160053be4e2a35ce4272
      TEST_BLOB: a5f08274fcc347eca6a7dca32c84e195815f36dc
    steps:
      - name: Checkout exact isolated private study (read-only)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 45a0c230606cb85af3e3b1996cf552d1cdb23798
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Prove immutable source and absence of signing/WEEX access
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          a=app/src/main/java/com/wilito/weexautotrader/Indicators.kt
          b=app/src/test/java/com/wilito/weexautotrader/IndicatorDirectionalNeutralTieStudyTest.kt
          test "$(git hash-object "$a")" = "$INDICATORS_BLOB"
          test "$(git hash-object "$b")" = "$TEST_BLOB"
          test ! -e app/weex-ia-signing.jks
          echo WEEX_INDICATOR_EXACT_STUDY_SOURCE_VERIFIED_NO_APK
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch verified Kotlin compiler and JUnit (pure JVM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weex-neutral-tie
          curl -fsSL --retry 3 --retry-delay 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o /tmp/weex-neutral-tie/kotlin.zip
          printf '%s  %s\n' a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714 /tmp/weex-neutral-tie/kotlin.zip | sha256sum -c - >/dev/null
          unzip -q /tmp/weex-neutral-tie/kotlin.zip -d /tmp/weex-neutral-tie
          curl -fsSL --retry 3 --retry-delay 3 https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o /tmp/weex-neutral-tie/junit.jar
          curl -fsSL --retry 3 --retry-delay 3 https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o /tmp/weex-neutral-tie/hamcrest.jar
          test -x /tmp/weex-neutral-tie/kotlinc/bin/kotlinc
      - name: Compile EXACT indicators + isolated regression tests; run real JUnit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Only Candle dependencies used by this pure indicator source: NO Android, WEEX or network IO.
          cat > /tmp/weex-neutral-tie/CandleStub.kt <<'KT'
          package com.wilito.weexautotrader
          data class Candle(
            val open: Double = 0.0,
            val high: Double = 0.0,
            val low: Double = 0.0,
            val close: Double = 0.0,
            val volume: Double = 0.0
          )
          KT
          cp="/tmp/weex-neutral-tie/junit.jar:/tmp/weex-neutral-tie/hamcrest.jar"
          mkdir -p /tmp/weex-neutral-tie/classes
          /tmp/weex-neutral-tie/kotlinc/bin/kotlinc             app/src/main/java/com/wilito/weexautotrader/Indicators.kt             app/src/test/java/com/wilito/weexautotrader/IndicatorDirectionalNeutralTieStudyTest.kt             /tmp/weex-neutral-tie/CandleStub.kt             -cp "$cp" -d /tmp/weex-neutral-tie/classes
          java -cp "/tmp/weex-neutral-tie/classes:$cp:/tmp/weex-neutral-tie/kotlinc/lib/*"             org.junit.runner.JUnitCore             com.wilito.weexautotrader.IndicatorDirectionalNeutralTieStudyTest
          test ! -e app/build/outputs/apk
          echo WEEX_NEUTRAL_TIE_REAL_JUNIT_PASS_ISOLATED_NO_ANDROID_NO_APK_NO_WEEX_NO_OTA
