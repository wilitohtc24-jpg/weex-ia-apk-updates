# Read-only checkout of private source for PR102 ART VerifyError mechanical smoke.
# Source never leaves this ephemeral runner; NO APK, NO REAL orders, NO OTA.
name: WEEX PR102 ART VerifyError split smoke (SOURCE ONLY)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr102-art-source-smoke-20261110.yml
permissions:
  contents: read
jobs:
  validate-coroutine-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_REPO: wilitohtc24-jpg/weex-auto-trader-android
      SOURCE_BRANCH: repair/pr102-art-verifyerror-20261110
    steps:
      - name: Ensure read-only private source credential is configured
        env:
          SOURCE_TOKEN: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::SOURCE_GITHUB_READ_TOKEN_NOT_CONFIGURED"; exit 1; }
          echo "SOURCE_CREDENTIAL_PRESENT_NO_TOKEN_PRINT"
      - name: Checkout candidate private code into temporary job workspace (no cache)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: repair/pr102-art-verifyerror-20261110
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Rehearse source split, mechanical reverse parity and frozen release order
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch_trader_art_verifyerror_split_v1.py ci/verify_trader_art_verifyerror_split_v1.py
          bash -n ci/bitrise_release.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ci/bitrise_release.sh').read_text()
          p='python3 ci/patch_trader_art_verifyerror_split_v1.py'
          v='python3 ci/verify_trader_art_verifyerror_split_v1.py'
          freeze='04v-final-gradle-source.sha256'
          assert s.count(p)==1 and s.count(v)==1
          assert s.index(p)<s.index(v)<s.index(freeze)
          assert s.index('python3 ci/patch_owner_exit_continuity_v1.py')<s.index(p)
          print('SOURCE_WRITER_AFTER_OWNER_PATCH_BEFORE_FREEZE_PASS')
          PY
          python3 ci/patch_trader_art_verifyerror_split_v1.py
          python3 ci/verify_trader_art_verifyerror_split_v1.py
          cp app/src/main/java/com/wilito/weexautotrader/TraderService.kt /tmp/pr106-before-reapply.kt
          python3 ci/patch_trader_art_verifyerror_split_v1.py
          cmp /tmp/pr106-before-reapply.kt app/src/main/java/com/wilito/weexautotrader/TraderService.kt
          python3 ci/verify_trader_art_verifyerror_split_v1.py
          echo PR106_IDEMPOTENT_SECOND_MATERIALIZATION_PASS
          git diff --check
          echo "SOURCE_ONLY_ART_COROUTINE_REWRITE_PASS_NO_APK_NO_OTA"
# Smoke retry: support both original and final materialized shadow-mode guard.
