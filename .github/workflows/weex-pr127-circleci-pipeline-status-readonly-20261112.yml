name: WEEX PR127 CircleCI private pipeline status read only (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr127-circleci-pipeline-status-readonly-20261112.yml
permissions:
  contents: read
jobs:
  circleci-status-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      REQUESTED_SHA: 07f4a27bbb162724d2ec31c132208ea9e5ad6e52
    steps:
      - name: Query CircleCI private project with existing read-only artifact token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          if not token:
              print("CIRCLECI_READ_STATUS=NO_CONFIGURED_SECRET")
              raise SystemExit(0)
          branch="repair/weex-owner-adaptive-20pct-stop-risk-20261111"
          base="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/pipeline"
          q=urllib.parse.urlencode({"branch":branch})
          request=urllib.request.Request(base+"?"+q,headers={
              "Accept":"application/json","Circle-Token":token,
              "User-Agent":"weex-pr127-status-readonly"})
          try:
              with urllib.request.urlopen(request,timeout=20) as r:
                  result=json.load(r)
          except urllib.error.HTTPError as ex:
              print("CIRCLECI_READ_STATUS=HTTP_"+str(ex.code))
              raise SystemExit(0)
          except Exception as ex:
              print("CIRCLECI_READ_STATUS=UNAVAILABLE_"+type(ex).__name__)
              raise SystemExit(0)
          items=result.get("items",[])
          print("CIRCLECI_READ_STATUS=OK")
          print("CIRCLECI_VISIBLE_PIPELINES="+str(len(items)))
          for p in items[:12]:
              vcs=p.get("vcs") or {}
              sha=vcs.get("revision","")
              matched=sha==os.environ["REQUESTED_SHA"]
              print("CIRCLECI_PIPELINE_MATCH_SHA="+str(matched)+
                    " STATE="+str(p.get("state","unknown"))+
                    " CREATED="+str(p.get("created_at","unknown")))
              if not matched:continue
              print("CIRCLECI_MATCHED_PIPELINE_ID="+str(p.get("id","")))
              print("CIRCLECI_MATCHED_PIPELINE_NUMBER="+str(p.get("number","")) )
              details_url="https://circleci.com/api/v2/pipeline/"+p["id"]
              detail_request=urllib.request.Request(details_url,headers={
                  "Accept":"application/json","Circle-Token":token,
                  "User-Agent":"weex-pr127-error-readonly"})
              with urllib.request.urlopen(detail_request,timeout=20) as r:
                  detail=json.load(r)
              errors=detail.get("errors") or p.get("errors") or []
              print("CIRCLECI_MATCHED_PIPELINE_ERROR_COUNT="+str(len(errors)))
              for e in errors[:5]:
                  message=str(e.get("message",""))[:1600]
                  for sensitive in ("token","password","secret","bearer"):
                      import re
                      message=re.sub(r"(?i)("+sensitive+r"\\s*[=:]\\s*)\\S+",r"\\1[REDACTED]",message)
                  print("CIRCLECI_ERROR_TYPE="+str(e.get("type",""))+
                        " MESSAGE="+message.replace("\\n"," ")[:1600])
              workflows_url=details_url+"/workflow"
              work_request=urllib.request.Request(workflows_url,headers={
                  "Accept":"application/json","Circle-Token":token})
              with urllib.request.urlopen(work_request,timeout=20) as r:
                  workflows=json.load(r).get("items",[])
              print("CIRCLECI_MATCHED_WORKFLOW_COUNT="+str(len(workflows)))
              for w in workflows[:10]:
                  print("CIRCLECI_WORKFLOW="+str(w.get("name"))+
                        " STATUS="+str(w.get("status")))
                  if w.get("name")!="pr127_circleci_one_private":continue
                  job_url="https://circleci.com/api/v2/workflow/"+w["id"]+"/job"
                  req=urllib.request.Request(job_url,headers={
                      "Accept":"application/json","Circle-Token":token})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      jobs=json.load(r).get("items",[])
                  for j in jobs:
                      number=j.get("job_number")
                      print("CIRCLECI_PRIVATE_JOB="+str(j.get("name"))+
                            " STATUS="+str(j.get("status"))+
                            " NUMBER="+str(number))
                      if number:
                          details_endpoint="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/job/"+str(number)
                          try:
                              dreq=urllib.request.Request(details_endpoint,headers={
                                  "Accept":"application/json","Circle-Token":token})
                              with urllib.request.urlopen(dreq,timeout=20) as resp:
                                  jobdetails=json.load(resp)
                              print("CIRCLECI_PRIVATE_JOB_FINAL_STATUS="+str(jobdetails.get("status")))
                              print("CIRCLECI_PRIVATE_JOB_STARTED_AT="+str(jobdetails.get("started_at")))
                              print("CIRCLECI_PRIVATE_JOB_STOPPED_AT="+str(jobdetails.get("stopped_at")))
                              for step in jobdetails.get("steps",[])[-12:]:
                                  for action in step.get("actions",[]):
                                      print("CIRCLECI_PRIVATE_ACTION="+str(action.get("name",""))[:130]+
                                            " STATUS="+str(action.get("status"))+
                                            " START="+str(action.get("start_time"))+
                                            " END="+str(action.get("end_time")))
                          except Exception as error:
                              print("CIRCLECI_PRIVATE_JOB_DETAIL_UNAVAILABLE="+type(error).__name__)
                          # Legacy build detail exposes step progress, unlike some v2 jobs.
                          try:
                              legacy_url="https://circleci.com/api/v1.1/project/github/wilitohtc24-jpg/weex-auto-trader-android/"+str(number)
                              lreq=urllib.request.Request(legacy_url,headers={
                                  "Accept":"application/json","Circle-Token":token,
                                  "User-Agent":"weex-pr127-circleci-readonly"})
                              with urllib.request.urlopen(lreq,timeout=20) as resp:
                                  legacy=json.load(resp)
                              print("CIRCLECI_LEGACY_BUILD_STATUS="+str(legacy.get("status")))
                              for step in legacy.get("steps",[])[-18:]:
                                  for action in step.get("actions",[]):
                                      print("CIRCLECI_BUILD_ACTION="+str(action.get("name",""))[:130]+
                                            " STATUS="+str(action.get("status"))+
                                            " START="+str(action.get("start_time"))+
                                            " END="+str(action.get("end_time")))
                                      if action.get("name")!="PR127 exact private signed APK (no OTA)":continue
                                      output_url=action.get("output_url")
                                      if not output_url:continue
                                      from urllib.parse import urlparse
                                      host=(urlparse(output_url).hostname or "").lower()
                                      if not (host=="circleci.com" or host.endswith(".circleci.com")
                                              or host.endswith(".amazonaws.com")):
                                          print("CIRCLECI_JOB_OUTPUT_SKIPPED_UNTRUSTED_HOST")
                                          continue
                                      try:
                                          headers={"User-Agent":"weex-pr127-step-progress-readonly"}
                                          if host=="circleci.com" or host.endswith(".circleci.com"):
                                              headers["Circle-Token"]=token
                                          outreq=urllib.request.Request(output_url,headers=headers)
                                          with urllib.request.urlopen(outreq,timeout=20) as resp:
                                              data=json.load(resp)
                                          import re
                                          allowed_lines=[]
                                          marker=re.compile(r"\\b(PR127_[A-Z0-9_]{6,}|WEEX_OWNER_MANUAL_BUILD_ONLY_OK|CIRCLECI_[A-Z0-9_]{6,}|GLOBAL_RELEASE_VERSION_CODE=\\d+|BUILD FAILED|BUILD SUCCESSFUL)\\b")
                                          for item in data[-150:]:
                                              for hit in marker.findall(str(item.get("message",""))):
                                                  if hit not in allowed_lines:allowed_lines.append(hit)
                                          print("CIRCLECI_SIGNED_BUILD_PROGRESS_MARKERS="+",".join(allowed_lines[-22:]))
                                          print("CIRCLECI_SIGNED_BUILD_OUTPUT_RECORDS="+str(len(data)))
                                      except Exception as error:
                                          print("CIRCLECI_JOB_OUTPUT_UNAVAILABLE="+type(error).__name__)
                          except urllib.error.HTTPError as error:
                              print("CIRCLECI_LEGACY_DETAIL_HTTP_"+str(error.code))
                          except Exception as error:
                              print("CIRCLECI_LEGACY_DETAIL_UNAVAILABLE="+type(error).__name__)
                      if j.get("status")!="success" or not number:continue
                      artifacts_url="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/"+str(number)+"/artifacts"
                      areq=urllib.request.Request(artifacts_url,headers={
                          "Accept":"application/json","Circle-Token":token})
                      with urllib.request.urlopen(areq,timeout=20) as r:
                          assets=json.load(r).get("items",[])
                      print("CIRCLECI_PRIVATE_ARTIFACT_COUNT="+str(len(assets)))
                      for asset in assets[:25]:
                          print("CIRCLECI_ARTIFACT_PATH="+str(asset.get("path",""))[:180])
                      required=(
                          "private-pr127-circleci-candidate/WEEX-IA-Trader-release.apk",
                          "private-pr127-circleci-candidate/signing-certificate.txt",
                          "private-pr127-circleci-candidate/release.json",
                          "private-pr127-circleci-candidate/apk-sha256.txt",
                          "private-pr127-circleci-candidate/candidate-provenance.txt",
                      )
                      found={str(asset.get("path","")) for asset in assets}
                      missing=[name for name in required if not any(x.endswith(name) for x in found)]
                      print("CIRCLECI_PRIVATE_REQUIRED_ARTIFACTS_ALL_PRESENT="+str(not missing))
                      for name in missing:
                          print("CIRCLECI_MISSING_ARTIFACT="+name)
          PY
