name: WEEX PR127 signed CircleCI artifact hash and signer audit (NO OTA)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr127-circleci-signed-artifact-audit-20261112.yml
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Verify private signed APK bytes, SHA256, certificate and version without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.parse,urllib.error
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token, "CircleCI read token absent"
          api="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/51467/artifacts"
          req=urllib.request.Request(api,headers={"Circle-Token":token,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as r:
              items=json.load(r).get("items",[])
          bypath={v.get("path"):v for v in items}
          prefix="private-pr127-circleci-candidate/"
          required=["WEEX-IA-Trader-release.apk","apk-sha256.txt","signing-certificate.txt",
                    "release.json","candidate-provenance.txt"]
          for filename in required:
              assert prefix+filename in bypath, "Missing private candidate "+filename
          print("PR127_SIGNED_ARTIFACT_SET_PRESENT count="+str(len(items)))

          class ScrubAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  new=super().redirect_request(req,fp,code,msg,hdrs,newurl)
                  if new is not None:
                      for name in list(new.headers):
                          if name.lower()=="circle-token":del new.headers[name]
                      for name in list(new.unredirected_hdrs):
                          if name.lower()=="circle-token":del new.unredirected_hdrs[name]
                  return new
          opener=urllib.request.build_opener(ScrubAuthRedirect())

          def source_for(filename):
              url=bypath[prefix+filename].get("url","")
              parsed=urllib.parse.urlparse(url)
              host=(parsed.hostname or "").lower()
              assert parsed.scheme=="https" and host, "Invalid artifact URL"
              assert (host=="circleci.com" or host.endswith(".circleci.com")
                      or host.endswith(".amazonaws.com")
                      or host.endswith(".cloudfront.net")
                      or host=="storage.googleapis.com"),"Unrecognized artifact storage"
              headers={"User-Agent":"weex-pr127-verified-private-apk"}
              if host=="circleci.com" or host.endswith(".circleci.com"):
                  headers["Circle-Token"]=token
              return opener.open(urllib.request.Request(url,headers=headers),timeout=120)
          def small(filename,limit=250000):
              with source_for(filename) as r:
                  data=r.read(limit+1)
              assert len(data)<=limit, "Unexpectedly large metadata"
              return data.decode("utf8")
          expected_sha=small("apk-sha256.txt").strip().split()[0].lower()
          assert re.fullmatch(r"[0-9a-f]{64}",expected_sha)
          provenance={}
          for line in small("candidate-provenance.txt").splitlines():
              if "=" in line:
                  k,v=line.split("=",1)
                  provenance[k.strip()]=v.strip()
          assert provenance.get("source")=="07f4a27bbb162724d2ec31c132208ea9e5ad6e52"
          assert provenance.get("green_source")=="5c7ccdebe581010e00887264e209961fa8830aa0"
          assert provenance.get("private_only")=="true"
          assert provenance.get("ota_publication")=="false"
          version=int(provenance["versionCode"])
          assert 29333175 < version <= 2100000000
          print("PR127_SIGNED_SOURCE_PROVENANCE_VERIFIED")
          print("PR127_SIGNED_VERSION_CODE="+str(version))
          canonical="5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"
          cert=small("signing-certificate.txt")
          digests=set()
          for m in re.finditer(
              r"(?im)^\s*Signer\s+(?:#\d+|\([^)\r\n]+\))\s+certificate\s+SHA-256\s+digest:\s*([0-9a-f:]+)\s*$",
              cert
          ):
              digests.add(m.group(1).replace(":","").lower())
          assert digests=={canonical}, "Signer differs from original OTA certificate"
          print("PR127_CANONICAL_SIGNER_VERIFIED="+canonical)
          release=json.loads(small("release.json"))
          assert isinstance(release,dict)
          for k in ("versionCode","version_code"):
              if k in release:
                  assert int(release[k])==version, "release.json version mismatch"
          print("PR127_RELEASE_JSON_VALID")
          h=hashlib.sha256()
          size=0
          first=b""
          with source_for("WEEX-IA-Trader-release.apk") as r:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk:break
                  if not first:first=chunk[:4]
                  size+=len(chunk)
                  assert size<=200*1024*1024, "Unexpectedly large APK"
                  h.update(chunk)
          assert first==b"PK\x03\x04", "Artifact not a ZIP/APK"
          assert size>10*1024*1024, "APK unexpectedly small"
          assert h.hexdigest()==expected_sha,"APK bytes differ from CircleCI SHA256"
          print("PR127_SIGNED_APK_SHA256_MATCH="+h.hexdigest())
          print("PR127_SIGNED_APK_SIZE_BYTES="+str(size))
          print("PR127_PRIVATE_ARTIFACT_INDEPENDENT_AUDIT_PASS_NO_OTA")
          PY
