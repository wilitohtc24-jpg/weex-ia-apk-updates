name: WEEX PR127 one-use encrypted CircleCI artifact URL transfer (NO OTA)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr127-secure-artifact-bridge-20261112.yml
permissions:
  contents: read
jobs:
  public-key-only-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      RECIPIENT_CERT_DER_BASE64: 
    steps:
      - name: Encrypt short-lived private APK storage link using recipient certificate only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,tempfile,urllib.request,urllib.error,urllib.parse
          token=os.environ.get("CIRCLECI_READ_TOKEN")
          assert token, "CircleCI artifact read token unavailable"
          endpoint="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/51467/artifacts"
          req=urllib.request.Request(endpoint,headers={"Circle-Token":token,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r:
              items=json.load(r)["items"]
          matches=[a for a in items if a.get("path")=="private-pr127-circleci-candidate/WEEX-IA-Trader-release.apk"]
          assert len(matches)==1,"Exact signed APK artifact missing or duplicated"
          url=matches[0]["url"]
          parsed=urllib.parse.urlparse(url)
          assert parsed.scheme=="https" and parsed.hostname=="output.circle-artifacts.com"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect())
          try:
              request=urllib.request.Request(url,headers={"Circle-Token":token,"User-Agent":"weex-one-use-private-artifact-transfer"})
              with opener.open(request,timeout=20) as response:
                  raise RuntimeError("Expected short-lived signed redirect")
          except urllib.error.HTTPError as e:
              assert e.code in (301,302,303,307,308),"No signed artifact redirect"
              signed_url=e.headers.get("Location","")
          target=urllib.parse.urlparse(signed_url)
          assert target.scheme=="https" and (
              (target.hostname or "").endswith(".amazonaws.com")
              or (target.hostname or "").endswith(".cloudfront.net")
              or target.hostname=="storage.googleapis.com"),"Unexpected signed storage domain"
          assert len(signed_url)<8192 and len(signed_url)>100
          with tempfile.TemporaryDirectory() as td:
              der=os.path.join(td,"recipient.der")
              crt=os.path.join(td,"recipient.pem")
              with open(der,"wb") as f:
                  f.write(base64.b64decode(os.environ["RECIPIENT_CERT_DER_BASE64"]))
              subprocess.run(["openssl","x509","-inform","DER","-in",der,"-out",crt],
                             check=True,capture_output=True)
              result=subprocess.run(["openssl","cms","-encrypt","-aes256","-binary",
                                     "-outform","DER","-recip",crt],
                                     input=signed_url.encode(),check=True,capture_output=True)
          print("PR127_CIRCLECI_SIGNED_URL_HOST="+str(target.hostname))
          print("PR127_CMS_ENCRYPTED_PRESIGNED_URL="+base64.b64encode(result.stdout).decode())
          print("PR127_SIGNED_LINK_PRIVATELY_ENCRYPTED_NO_PUBLIC_URL_OR_TOKEN")
          PY
