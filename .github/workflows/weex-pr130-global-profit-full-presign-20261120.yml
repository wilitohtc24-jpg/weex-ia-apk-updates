name: WEEX PR130 canonical full presign materialization (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr130-global-profit-full-presign-20261120.yml
permissions:
  contents: read
jobs:
  presign-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact isolated PR130 source; read only
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: f3e9edddaa0a5242e5d9aa8908ec1046be41b7fb
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify original signing and REAL execution source unchanged
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f3e9edddaa0a5242e5d9aa8908ec1046be41b7fb"
          python3 ci/verify_global_profit_control_pr130_v1.py
      - name: Replay all canonical presign source materializers; no Gradle or release
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          if ! python3 ci/preflight_full_presigning_source_v1.py > /tmp/weex-pr130-presign.log 2>&1; then
            echo "::error::PR130_SOURCE_MATERIALIZER_OR_LEGACY_SAFETY_GATE_FAILED"
            python3 - <<'PY'
          import re
          from pathlib import Path
          ls=Path('/tmp/weex-pr130-presign.log').read_text(errors='replace').splitlines()
          keep=[]
          for line in ls:
              if re.search(r'\b(?:WEEX|PR129|PR130|REAL|OWNER|PRESIGN|CRYPTO)_[A-Z0-9_]{5,}\b',line):
                  keep.extend(re.findall(r'\b(?:WEEX|PR129|PR130|REAL|OWNER|PRESIGN|CRYPTO)_[A-Z0-9_]{5,}\b',line))
          print('PR130_SOURCE_ONLY_DIAGNOSTIC_CODES='+','.join(list(dict.fromkeys(keep))[-45:]))
          numbers=[m.group(1) for line in ls for m in
            [re.search(r'WEEX_PRESIGN_FIRST_FAILURE_LINE=([0-9]+)',line)] if m]
          print('PR130_FIRST_FAILURE_RUNNER_LINES='+','.join(numbers[-3:]))
          names=[x for line in ls[-100:] for x in
                 re.findall(r'ci/[A-Za-z0-9_-]+\\.py',line)]
          print('PR130_LAST_SAFE_PYTHON_FILES='+','.join(list(dict.fromkeys(names))[-12:]))
          summary=[]
          for raw in ls:
              if not raw.startswith('PRESIGN_FAILURE_CONTEXT '):
                  continue
              value=raw.split('PRESIGN_FAILURE_CONTEXT ',1)[1].strip()
              if not any(t in value for t in ('FAIL','Assertion','Error','EXCEPTION','Missing')):
                  continue
              if any(t in value.upper() for t in ('TOKEN=','PASSWORD=','API_KEY','SECRET=')):
                  continue
              summary.append(re.sub(r'[^A-Za-z0-9_ .:+/()\-]','_',value)[:190])
          print('PR130_SAFE_FAILURE_EXCERPT='+' || '.join(summary[:5]))
          print('PR130_PRESIGN_SAFE_EXCEPTION_TYPES='+','.join(list(dict.fromkeys(
              re.findall(r'\b(?:AssertionError|ValueError|TypeError|FileNotFoundError|SyntaxError)\b',
              '\n'.join(ls[-60:]))))))
          PY
            exit 1
          fi
          grep -Fq 'WEEX_PRESIGN_SOURCE_REPLAY_PASS' /tmp/weex-pr130-presign.log
          echo PR130_FULL_CANONICAL_SOURCE_PRESIGN_PASS_NO_APK_NO_WEEX_ORDERS
