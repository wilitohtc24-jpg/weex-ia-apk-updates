name: WEEX PR130 global owner protection isolated backend and source QA (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr130-global-profit-source-qa-20261120.yml
permissions:
  contents: read
jobs:
  private-global-control-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private PR130 source (read only)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 1a16969445298a7545931d9133dad7f24fe75d8f
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source freeze — exact old entry and STOP engine untouched
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1a16969445298a7545931d9133dad7f24fe75d8f"
          python3 ci/verify_global_profit_control_pr130_v1.py
      - name: Node tests — role and multiple users after owner global switch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node --check backend/neon/gateway/core.mjs
          node --test backend/neon/gateway/global-profit-control.test.mjs backend/neon/gateway/core.test.mjs
          node --input-type=module -e "import api from './backend/neon/gateway/qa/index.mjs'; const res=await api.fetch(new Request('https://offline.invalid/health')); const report=await res.json();if(!report.ok||report.passed!==report.total)process.exit(1);console.log('PR131_NEON_QA_SYNTHETIC_STARTUP_PASS',report.passed)"
          echo PR130_GLOBAL_OWNER_CONTROL_TEST_PASS_NO_APK_NO_OTA_NO_ORDER
