name: WEEX PR130 global protection PostgreSQL migration offline (NO production)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr130-global-profit-sql-offline-20261120.yml
permissions:
  contents: read
jobs:
  offline-postgres-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: pr130_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr130_test_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testing-only
      PGDATABASE: pr130_test_only
    steps:
      - name: Checkout exact PR130 private source (READ ONLY)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 1433dcd9751c0424d1debbf6e3e45c45f91d5fe6
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Test additive migration twice, default OFF and monotonic owner toggles
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd source && git rev-parse HEAD)" = "1433dcd9751c0424d1debbf6e3e45c45f91d5fe6"
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.app_licenses (id uuid PRIMARY KEY);'
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.app_devices (id uuid PRIMARY KEY);'
          psql -v ON_ERROR_STOP=1 -f source/backend/neon/migrations/20261120_global_real_profit_control.sql
          psql -v ON_ERROR_STOP=1 -f source/backend/neon/migrations/20261120_global_real_profit_control.sql
          test "$(psql -At -c 'SELECT count(*) FROM public.global_real_profit_control')" = "1"
          test "$(psql -At -c 'SELECT enabled::text||chr(58)||generation||chr(58)||coalesce(activated_at::text, chr(45)) FROM public.global_real_profit_control WHERE singleton_id=1')" = "false:0:-"
          test "$(psql -At -c "SELECT owner_license_id IS NULL FROM public.global_real_profit_control WHERE singleton_id=1")" = "t"
          # An unbound owner may never enable the global real STOP module.
          if psql -v ON_ERROR_STOP=1 -c "UPDATE public.global_real_profit_control SET enabled=true,activated_at=now() WHERE singleton_id=1" >/tmp/pr130-unbound-attempt.log 2>&1; then
            echo "::error::PR131_UNBOUND_OWNER_GLOBAL_PROFIT_ACTIVATED"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.app_licenses(id) VALUES ('22222222-2222-4222-8222-222222222222')"
          # Disposable synthetic license only, NEVER choose a production owner.
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.global_real_profit_control SET owner_license_id='22222222-2222-4222-8222-222222222222' WHERE singleton_id=1 AND enabled=false"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.app_devices(id) VALUES ('11111111-1111-4111-8111-111111111111')"
          # Exercise the same UPDATE-only shape as the gateway: never INSERT
          # an invalid enabled row while the identity constraint is present.
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.global_real_profit_control SET enabled=true,generation=generation+1,activated_at=CASE WHEN true AND NOT enabled THEN now() WHEN true THEN activated_at ELSE NULL END,updated_at=now(),updated_by_device='11111111-1111-4111-8111-111111111111' WHERE singleton_id=1 AND owner_license_id='22222222-2222-4222-8222-222222222222' RETURNING generation"
          test "$(psql -At -c 'SELECT enabled::text||chr(58)||generation FROM public.global_real_profit_control WHERE singleton_id=1')" = "true:1"
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.global_real_profit_control SET enabled=false,generation=generation+1,activated_at=NULL WHERE singleton_id=1"
          test "$(psql -At -c 'SELECT enabled::text||chr(58)||generation||chr(58)||coalesce(activated_at::text,chr(45)) FROM public.global_real_profit_control WHERE singleton_id=1')" = "false:2:-"
          echo PR131_POSTGRES_EXCLUSIVE_OWNER_UNBOUND_FAIL_CLOSED_IDEMPOTENT_PASS_NO_PROD_NO_WEEX
