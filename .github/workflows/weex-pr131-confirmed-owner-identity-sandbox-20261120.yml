name: WEEX PR131 confirmed owner biometric license binding - SANDBOX ONLY
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-confirmed-owner-identity-sandbox-20261120.yml
permissions:
  contents: read
jobs:
  owner-binding-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: owner_identity_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_identity_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: owner_identity_qa
    steps:
      - name: Check out exact private source (never publish or deploy)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 5bf1c4d13d64374fda92c6278583ebfb769dccf2
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify exact commit and untouched trading engine
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5bf1c4d13d64374fda92c6278583ebfb769dccf2"
          python3 ci/verify_global_profit_control_pr130_v1.py
      - name: Exercise owner identity binding using synthetic users ONLY
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f backend/neon/migrations/20261025_core_schema.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f backend/neon/migrations/20261120_global_real_profit_control.sql >/dev/null
          # Read the confirmed label ONLY from the pinned private script.
          # Never place license identity in this PUBLIC workflow's source.
          owner_label="$(python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('backend/neon/manual/20261120_bind_confirmed_owner_only.sql').read_text()
          m=re.search(r"WHERE l\.label = '([^']+)'",p)
          assert m and len(m.group(1)) < 90
          print(m.group(1))
          PY
          )"
          psql -X -v ON_ERROR_STOP=1 -v owner_label="$owner_label" <<'SQL'
          INSERT INTO public.app_licenses(id,code_hash,label,is_admin) VALUES
           ('11111111-1111-4111-8111-111111111111',repeat('a',64),'Legacy administrator fixture',true),
           ('22222222-2222-4222-8222-222222222222',repeat('b',64),:'owner_label',true),
           ('33333333-3333-4333-8333-333333333333',repeat('c',64),'Cliente corriente',false);
          INSERT INTO public.app_devices(id,license_id,device_hash,token_hash) VALUES
           ('44444444-4444-4444-8444-444444444444','11111111-1111-4111-8111-111111111111',repeat('d',64),repeat('e',64)),
           ('55555555-5555-4555-8555-555555555555','22222222-2222-4222-8222-222222222222',repeat('f',64),repeat('1',64));
          INSERT INTO public.owner_biometric_keys(device_id,public_key_spki)
          VALUES('55555555-5555-4555-8555-555555555555',repeat('B',100));
          SQL
          psql -X -v ON_ERROR_STOP=1 -1 -f backend/neon/manual/20261120_bind_confirmed_owner_only.sql
          psql -X -v ON_ERROR_STOP=1 -1 -f backend/neon/manual/20261120_bind_confirmed_owner_only.sql
          test "$(psql -At -c 'SELECT owner_license_id::text FROM public.global_real_profit_control WHERE singleton_id=1')" = "22222222-2222-4222-8222-222222222222"
          test "$(psql -At -c 'SELECT enabled::text||chr(58)||generation FROM public.global_real_profit_control WHERE singleton_id=1')" = "false:0"
          test "$(psql -At -c 'SELECT count(*) FROM public.app_licenses WHERE is_admin=true AND active=true')" = "2"
          echo PR131_EXCLUSIVE_OWNER_BIND_IDEMPOTENT_NO_ACCOUNT_CHANGES_PASS
          # Detect ambiguous identity: 2 matching admin labels MUST abort.
          psql -X -v ON_ERROR_STOP=1 -v owner_label="$owner_label" <<'SQL'
          UPDATE public.app_licenses SET label=:'owner_label' WHERE id='11111111-1111-4111-8111-111111111111';
          SQL
          if psql -X -v ON_ERROR_STOP=1 -1 -f backend/neon/manual/20261120_bind_confirmed_owner_only.sql >/tmp/pr131-ambiguous.log 2>&1; then
            echo "::error::PR131_DUPLICATE_OWNER_LABEL_WAS_ACCEPTED"
            exit 1
          fi
          grep -Fq 'PR131_EXCLUSIVE_OWNER_IDENTITY_NOT_UNIQUE' /tmp/pr131-ambiguous.log
          test "$(psql -At -c 'SELECT owner_license_id::text FROM public.global_real_profit_control WHERE singleton_id=1')" = "22222222-2222-4222-8222-222222222222"
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.app_licenses SET label='Legacy administrator fixture' WHERE id='11111111-1111-4111-8111-111111111111'"
          # Missing enrolled biometrics must also block provisioning.
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM public.owner_biometric_keys WHERE device_id='55555555-5555-4555-8555-555555555555'"
          if psql -X -v ON_ERROR_STOP=1 -1 -f backend/neon/manual/20261120_bind_confirmed_owner_only.sql >/tmp/pr131-no-biometric.log 2>&1; then
            echo "::error::PR131_OWNER_WITHOUT_BIOMETRIC_WAS_ACCEPTED"
            exit 1
          fi
          grep -Fq 'PR131_EXCLUSIVE_OWNER_IDENTITY_NOT_UNIQUE' /tmp/pr131-no-biometric.log
          test "$(psql -At -c 'SELECT enabled::text FROM public.global_real_profit_control WHERE singleton_id=1')" = "false"
          echo PR131_OWNER_DUPLICATE_AND_NO_BIOMETRIC_FAIL_CLOSED_PASS_NO_PROD_NO_OTA
