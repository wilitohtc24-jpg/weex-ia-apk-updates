name: WEEX PR131 owner targeted user delete - OFFLINE safety QA (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-owner-delete-offline-qa-20261120.yml
permissions:
  contents: read
jobs:
  verified-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: only-fixture
          POSTGRES_DB: owner_delete_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d owner_delete_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: only-fixture
      PGDATABASE: owner_delete_fixture
    steps:
      - name: Fetch exact private PR131 branch read only
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: dc109bbcebc2c627edcc1ebf930973a0bc410342
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Node 20 for Neon gateway tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve exact REAL engines and require typed deletion
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dc109bbcebc2c627edcc1ebf930973a0bc410342"
          python3 ci/verify_global_profit_control_pr130_v1.py
          grep -Fq 'deleteConfirmLabel==item.label' app/src/main/java/com/wilito/weexautotrader/OwnerControlCenterDialog.kt
          grep -Fq 'confirmLabel!==record.label' backend/neon/gateway/core.mjs
          grep -Fq 'record.is_admin===true' backend/neon/gateway/core.mjs
          grep -Fq 'DELETE FROM public.app_licenses WHERE id=$1 AND is_admin=false RETURNING id' backend/neon/gateway/core.mjs
          grep -Fq 'delete_blocked_by_reference' backend/neon/gateway/core.mjs
      - name: HTTP role, identity, data scope, negative deletion tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/neon/gateway/core.mjs
          node --test backend/neon/gateway/core.test.mjs backend/neon/gateway/global-profit-control.test.mjs backend/neon/gateway/owner-delete-safe.test.mjs
          echo PR131_OWNER_DELETE_ROLE_AND_SCOPE_OFFLINE_PASS
      - name: SQL FK cascades remove only selected user on disposable PostgreSQL
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f backend/neon/migrations/20261025_core_schema.sql >/tmp/pr131-schema.log
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.app_licenses(id,code_hash,label,is_admin)
          VALUES
          ('11111111-1111-4111-8111-111111111111',repeat('a',64),'Propietario',true),
          ('22222222-2222-4222-8222-222222222222',repeat('b',64),'Cliente a eliminar',false),
          ('33333333-3333-4333-8333-333333333333',repeat('c',64),'Cliente conservado',false);
          INSERT INTO public.app_devices(id,license_id,device_hash,token_hash)
          VALUES
          ('44444444-4444-4444-8444-444444444444','11111111-1111-4111-8111-111111111111',repeat('d',64),repeat('e',64)),
          ('55555555-5555-4555-8555-555555555555','22222222-2222-4222-8222-222222222222',repeat('f',64),repeat('1',64)),
          ('66666666-6666-4666-8666-666666666666','33333333-3333-4333-8333-333333333333',repeat('2',64),repeat('3',64));
          INSERT INTO public.learning_backups(device_id,encrypted_payload,payload_sha256,schema_version)
          VALUES
          ('55555555-5555-4555-8555-555555555555','ENCRYPTED_TEST_TARGET',repeat('4',64),1),
          ('66666666-6666-4666-8666-666666666666','ENCRYPTED_TEST_OTHER',repeat('5',64),1);
          INSERT INTO public.premium_entitlements(license_id,enabled)
          VALUES
          ('22222222-2222-4222-8222-222222222222',true),
          ('33333333-3333-4333-8333-333333333333',true);
          DELETE FROM public.app_licenses
          WHERE id='22222222-2222-4222-8222-222222222222' AND is_admin=false;
          DO $pr131$
          BEGIN
            IF (SELECT count(*) FROM public.app_licenses)<>2 THEN
              RAISE EXCEPTION 'wrong number of surviving licenses';
            END IF;
            IF EXISTS(SELECT 1 FROM public.app_licenses
              WHERE id='22222222-2222-4222-8222-222222222222') THEN
              RAISE EXCEPTION 'target survived deletion';
            END IF;
            IF (SELECT count(*) FROM public.app_licenses WHERE is_admin=true)<>1 THEN
              RAISE EXCEPTION 'owner license was affected';
            END IF;
            IF EXISTS(SELECT 1 FROM public.learning_backups
              WHERE device_id='55555555-5555-4555-8555-555555555555') THEN
              RAISE EXCEPTION 'deleted user backup survived';
            END IF;
            IF (SELECT count(*) FROM public.learning_backups
              WHERE device_id='66666666-6666-4666-8666-666666666666')<>1 THEN
              RAISE EXCEPTION 'unrelated user backup lost';
            END IF;
            IF (SELECT count(*) FROM public.premium_entitlements
              WHERE license_id='33333333-3333-4333-8333-333333333333')<>1 THEN
              RAISE EXCEPTION 'unrelated premium affected';
            END IF;
          END;
          $pr131$;
          SQL
          echo PR131_ONLY_SELECTED_LICENSE_REMOVED_ALL_OTHER_DATA_INTACT_TEST_PASS
