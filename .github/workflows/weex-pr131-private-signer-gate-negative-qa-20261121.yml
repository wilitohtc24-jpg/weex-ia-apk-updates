name: WEEX PR131 private signing authorization regression (NO APK NO OTA)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-private-signer-gate-negative-qa-20261121.yml
permissions:
  contents: read
jobs:
  offline-exact-signing-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private candidate branch without authentication persistence
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 43802d5a33d6753a03bf7a6f2d703cac7ddf9dd3
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Prove only CI wrappers differ from approved source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "43802d5a33d6753a03bf7a6f2d703cac7ddf9dd3"
          git diff --exit-code "8e5cd1a76db74cc3d3a0730eaf940e2b32f559b1" HEAD -- app backend ml build.gradle.kts settings.gradle.kts
          python3 - <<'PY'
          import subprocess
          a=set(subprocess.check_output(['git','diff','--name-only','8e5cd1a76db74cc3d3a0730eaf940e2b32f559b1','HEAD'],text=True).splitlines())
          expected={
            '.circleci/config.yml',
            'ci/build_private_pr131_circleci_once.sh',
            'ci/verify_owner_manual_build_contract_v1.py',
            'ci/verify_manual_build_only.py',
            'ci/test_manual_build_only_final_tail_v1.py',
          }
          assert a==expected,('PR131_PRIVATE_SOURCE_FENCE_DIFF',a)
          print('PR131_PRIVATE_BRANCH_SOURCE_UNCHANGED_NO_APK')
          PY
      - name: Validate manual build security and negative mutation tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/build_private_pr131_circleci_once.sh
          python3 ci/verify_owner_manual_build_contract_v1.py
          python3 ci/verify_manual_build_only.py
          python3 ci/test_manual_build_only_final_tail_v1.py
          test ! -e ci/requests/pr131-circleci-one-private.txt
          echo PR131_SIGNER_EXACT_BRANCH_SUBJECT_CERT_NO_OTA_NEGATIVE_QA_PASS
