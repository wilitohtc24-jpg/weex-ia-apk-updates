name: WEEX PR131 LIVE gateway postdeploy health/auth boundary NO OTA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-production-gateway-post-deploy-safety-20261121.yml
permissions:
  contents: read
jobs:
  verify-live-gateway-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EXACT_LIVE: https://br-bitter-tree-b8xf3vsz-weexgateway.compute.c-14.us-east-1.aws.neon.tech
    steps:
      - name: READ ONLY gateway probes; never send token or REAL WEEX orders
        shell: bash
        run: |
          set -euo pipefail
          test "$EXACT_LIVE" = "https://br-bitter-tree-b8xf3vsz-weexgateway.compute.c-14.us-east-1.aws.neon.tech"
          code="$(curl --silent --show-error --max-time 35 -o /tmp/pr131-live-health.json -w '%{http_code}' "$EXACT_LIVE/health")"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pr131-live-health.json',encoding='utf-8'))
          assert x.get('ok') is True
          assert x.get('service')=='weex-neon-gateway'
          assert x.get('tradingEnabled') is False
          print('PR131_LIVE_GATEWAY_HEALTH_PASS')
          PY
          # Each request is a read-only action without a real token.
          for action in profit_protection_status premium_status validate; do
            code="$(curl --silent --show-error --max-time 35 -o /tmp/pr131-live-denial.json -w '%{http_code}' -H 'Content-Type: application/json' --data "{\"action\":\"$action\"}" "$EXACT_LIVE/")"
            test "$code" = "401"
            python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pr131-live-denial.json',encoding='utf-8'))
          assert x.get('ok') is False
          assert x.get('error') in ('missing_token','unauthorized')
          PY
          done
          echo PR131_LIVE_GATEWAY_PREMIUM_VALIDATE_GLOBAL_ANONYMOUS_DENIAL_PASS_NO_USERS_CHANGED
