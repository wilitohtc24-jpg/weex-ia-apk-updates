name: WEEX PR131 isolated Neon gateway startup health (GET ONLY; NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-staging-gateway-health-20261121.yml
permissions:
  contents: read
jobs:
  stage-health-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove only isolated branch gateway boots and reads its database
        shell: bash
        env:
          STAGING_HEALTH: https://br-raspy-frog-b85nzeg5-weexgatewayq.compute.c-14.us-east-1.aws.neon.tech/health
        run: |
          set -euo pipefail
          test "$STAGING_HEALTH" = "https://br-raspy-frog-b85nzeg5-weexgatewayq.compute.c-14.us-east-1.aws.neon.tech/health"
          # GET /health alone, no credentials, no POST, no order, no production host.
          code="$(curl --silent --show-error --max-time 35 --output /tmp/pr131-stage-health.json --write-out '%{http_code}' "$STAGING_HEALTH")"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/pr131-stage-health.json',encoding='utf-8') as f:
              x=json.load(f)
          assert x.get('ok') is True
          assert x.get('service') == 'weex-neon-gateway'
          assert x.get('stage') == 'staging'
          assert x.get('cutover') is False
          assert x.get('tradingEnabled') is False
          print('WEEX_PR131_STAGING_GATEWAY_HEALTH_VERIFIED_GET_ONLY')
          PY
