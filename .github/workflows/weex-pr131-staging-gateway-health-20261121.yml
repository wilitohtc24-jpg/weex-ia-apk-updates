name: WEEX PR131 isolated Neon gateway health and anonymous denial (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr131-staging-gateway-health-20261121.yml
permissions:
  contents: read
jobs:
  stage-health-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolated stage DB health and deny anonymous profit status
        shell: bash
        env:
          STAGING_HEALTH: https://br-raspy-frog-b85nzeg5-weexgatewayq.compute.c-14.us-east-1.aws.neon.tech/health
        run: |
          set -euo pipefail
          test "$STAGING_HEALTH" = "https://br-raspy-frog-b85nzeg5-weexgatewayq.compute.c-14.us-east-1.aws.neon.tech/health"
          # GET /health alone, no credentials, no POST, no order, no production host.
          code="$(curl --silent --show-error --max-time 35 --output /tmp/pr131-stage-health.json --write-out '%{http_code}' "$STAGING_HEALTH")"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/pr131-stage-health.json',encoding='utf-8') as f:
              x=json.load(f)
          assert x.get('ok') is True
          assert x.get('service') == 'weex-neon-gateway'
          assert x.get('stage') == 'staging'
          assert x.get('cutover') is False
          assert x.get('tradingEnabled') is False
          print('WEEX_PR131_STAGING_GATEWAY_HEALTH_VERIFIED_GET_ONLY')
          PY

          # A read-only action must NEVER reveal global policy without a valid
          # license/device bearer. No token is provided, no mutation action sent.
          unauthorized_code="$(curl --silent --show-error --max-time 35 --output /tmp/pr131-anonymous-response.json --write-out '%{http_code}' --header 'content-type: application/json' --data '{"action":"profit_protection_status"}' "${STAGING_HEALTH%/health}/")"
          test "$unauthorized_code" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/pr131-anonymous-response.json',encoding='utf-8') as f:
              x=json.load(f)
          assert x.get('ok') is False
          print('WEEX_PR131_ANONYMOUS_GLOBAL_POLICY_DENIED_NO_ORDER_NO_WRITE')
          PY
