name: WEEX PR133 original REAL ACK to signed fill isolated JUnit (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr133-archived-ack-signed-execution-junit-isolated-20261121.yml
permissions:
  contents: read
jobs:
  immutable-original-ack-to-signed-fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_SHA: a43d56e15ffa2b636266b3baf281ac0596e56f42
    steps:
      - name: Checkout exact PRIVATE PR133 source read only
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: a43d56e15ffa2b636266b3baf281ac0596e56f42
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Audit source has no trade or STOP authority in learning bridge
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/wilito/weexautotrader")
          a=(p/"RealBotArchivedEntryToExecutedPolicy.kt").read_text()
          b=(p/"RealBotAcceptedEntryStudyPolicy.kt").read_text()
          c=(p/"RealBotExecutedEntryEvidencePolicy.kt").read_text()
          assert "PR133_ARCHIVED_ORIGINAL_ACK_TO_SIGNED_EXECUTED_ENTRY_V1" in a
          assert "RealBotExecutedEntryEvidencePolicy.certify(" in a
          assert "original.featureDigestSha256" in a
          assert "signed.originalOrderQuantity" in a
          assert "original.orderId!=signed.signedOrderId" in a
          assert "REAL_ORIGINAL_DECISION" in b
          for text in (a,b,c):
              for blocked in ("WeexPrivateApi(", "closePosition(", "modifyTpSlOrder(", "placeProtectedMarketOrder(", "setEmergencyStop("):
                  assert blocked not in text, "Unsafe order or STOP authority in learning policy"
          print("ACK_TO_SIGNED_EXECUTED_ENTRY_SOURCE_CONTRACT_PASS_NO_EXCHANGE")
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pin Kotlin compiler and JUnit test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr133-bridge
          curl --fail --location --silent --show-error --retry 3 --max-time 240 \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip \
            -o /tmp/pr133-bridge/kotlin.zip
          unzip -q /tmp/pr133-bridge/kotlin.zip -d /tmp/pr133-bridge
          test -x /tmp/pr133-bridge/kotlinc/bin/kotlinc
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o /tmp/pr133-bridge/junit.jar
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o /tmp/pr133-bridge/hamcrest.jar
      - name: Compile pure REAL bridge and execute JUnit assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr133-bridge/classes
          p="app/src/main/java/com/wilito/weexautotrader"
          t="app/src/test/java/com/wilito/weexautotrader"
          cp="/tmp/pr133-bridge/junit.jar:/tmp/pr133-bridge/hamcrest.jar"
          /tmp/pr133-bridge/kotlinc/bin/kotlinc \
            "$p/RealPositionOriginPolicy.kt" \
            "$p/RealBotClosedLearningPolicy.kt" \
            "$p/RealVerifiedOutcomeLearningPolicy.kt" \
            "$p/RealRoiMilestoneShadowPolicy.kt" \
            "$p/RealAppliedExperienceAdvisor.kt" \
            "$p/RealBotExecutedEntryEvidencePolicy.kt" \
            "$p/RealBotAcceptedEntryStudyPolicy.kt" \
            "$p/RealBotArchivedEntryToExecutedPolicy.kt" \
            "$t/RealBotArchivedEntryToExecutedPolicyTest.kt" \
            -cp "$cp" -d /tmp/pr133-bridge/classes
          java -cp "/tmp/pr133-bridge/classes:$cp:/tmp/pr133-bridge/kotlinc/lib/*" \
            org.junit.runner.JUnitCore \
            com.wilito.weexautotrader.RealBotArchivedEntryToExecutedPolicyTest
          echo PR133_SIGNED_ORIGINAL_ACK_EXECUTION_JUNIT_PASS_NO_APK_NO_ORDERS_NO_OTA
