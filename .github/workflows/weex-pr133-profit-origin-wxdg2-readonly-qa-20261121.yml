name: WEEX PR133 WXDG2 REAL profit protection origin read-only Kotlin QA (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr133-profit-origin-wxdg2-readonly-qa-20261121.yml
permissions:
  contents: read
jobs:
  wxdiag-profit-origin-no-real-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 6b1bce88a8105c7dab2df7bccf540a2b4237475f
    steps:
      - name: Checkout pinned private PR133 SHA (READ ONLY)
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 6b1bce88a8105c7dab2df7bccf540a2b4237475f
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Assert diagnostic only, never STOP or order authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          d=Path("app/src/main/java/com/wilito/weexautotrader")
          p=(d/"RealProfitProtectionEligibilityProbe.kt").read_text()
          t=(d/"Diagnostics.kt").read_text()
          for forbidden in ("WeexPrivateApi(", "WeexTradeActionsApi(", "signedGet(",
                            "signedPost(", "modifyTpSlOrder(", "setEmergencyStop(",
                            "closePositions(", "placeProtectedMarketOrder(",
                            "RealExecutionEngine(", "RealProfitProtectionManager("):
              assert forbidden not in p, f"Profit diagnostic must not execute: {forbidden}"
          for required in ("COMBINED_POSITION_SIGNED_ORIGIN_UNPROVEN",
                           "NEEDS_SIGNED_ORIGIN_AND_REMOTE_SL_TP_READBACK",
                           "authorizesStopMutation:Boolean=false"):
              assert required in p, f"Pure policy missing {required}"
          a=t.index('put("continuousNetProfitProtection",JSONObject().apply {')
          b=t.index('put("maxPositions",3)',a)
          section=t[a:b]
          for required in ("RealProfitProtectionEligibilityProbe.inspect(",
                           "venuePositionMode=pos.separatedMode",
                           "venueOpeningOrderId=pos.separatedOpenOrderId",
                           'put("statusReason",cause)',
                           'put("originEligibilityReadOnlyReason",eligibility.code)',
                           'put("originEligibilityGrantsStopAuthority",eligibility.authorizesStopMutation)'):
              assert required in section, f"WXDG2 missing {required}"
          # No changes to the signed resolver or active coordinator.
          resolver=(d/"RealPositionOriginResolver.kt").read_text()
          assert 'position.separatedMode.uppercase()!="SEPARATED"' in resolver
          coordinator=(d/"RealContinuousNetProfitCoordinator.kt").read_text()
          assert "RealPositionOriginPolicy.mayAutoCloseOrModify(position.id, origin)" in coordinator
          print("PR133_WXDG2_SIGNED_MODE_READONLY_AUTHORITY_ZERO_PASS")
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned Kotlin compiler and JUnit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr133-profit-origin
          curl --fail --silent --show-error --location --retry 3 --max-time 240 \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip \
            -o /tmp/pr133-profit-origin/kotlin.zip
          unzip -q /tmp/pr133-profit-origin/kotlin.zip -d /tmp/pr133-profit-origin
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o /tmp/pr133-profit-origin/junit.jar
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o /tmp/pr133-profit-origin/hamcrest.jar
      - name: Compile and run pure protection origin regressions (no Android, no WEEX)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          base=app/src/main/java/com/wilito/weexautotrader
          tests=app/src/test/java/com/wilito/weexautotrader
          cp=/tmp/pr133-profit-origin/junit.jar:/tmp/pr133-profit-origin/hamcrest.jar
          mkdir -p /tmp/pr133-profit-origin/classes
          /tmp/pr133-profit-origin/kotlinc/bin/kotlinc \
            "$base/RealProfitProtectionEligibilityProbe.kt" \
            "$tests/RealProfitProtectionEligibilityProbeTest.kt" \
            -cp "$cp" -d /tmp/pr133-profit-origin/classes
          java -cp "/tmp/pr133-profit-origin/classes:$cp:/tmp/pr133-profit-origin/kotlinc/lib/*" \
            org.junit.runner.JUnitCore com.wilito.weexautotrader.RealProfitProtectionEligibilityProbeTest
          echo PR133_WXDG2_PROFIT_ORIGIN_9_TESTS_PASS_ZERO_WEEX_ORDERS_NO_APK
