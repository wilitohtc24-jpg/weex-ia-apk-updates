name: WEEX PR133 REAL signed ROI recorder isolated Kotlin/JUnit with Android test doubles NO APK
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr133-real-roi-recorder-isolated-kotlin-20261121.yml
permissions:
  contents: read
jobs:
  kotlin-real-ingestion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: "d3410af2eb05dff6f4d04db968e9a918167f4295"
    steps:
      - name: Checkout exact private REAL-learning source read-only
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: d3410af2eb05dff6f4d04db968e9a918167f4295
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned Kotlin 2.2.21 and isolated JUnit+JSON dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr133-qa
          curl -fsSL --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o /tmp/pr133-qa/kotlin.zip
          printf '%s  %s\n' a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714 /tmp/pr133-qa/kotlin.zip | sha256sum -c - >/dev/null
          unzip -q /tmp/pr133-qa/kotlin.zip -d /tmp/pr133-qa
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o /tmp/pr133-qa/junit.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o /tmp/pr133-qa/hamcrest.jar
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/pr133-qa/json.jar
      - name: Compile actual production recorder against minimal JVM Android interfaces and run tests
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /tmp/pr133-qa/fixtures/android/content /tmp/pr133-qa/fixtures/com/wilito/weexautotrader /tmp/pr133-qa/classes
          cat > /tmp/pr133-qa/fixtures/android/content/Context.kt <<'KOTLIN'
          package android.content
          interface SharedPreferences {
            val all: Map<String, Any?>
            fun getString(key: String, def: String?): String?
            fun edit(): Editor
            interface Editor {
              fun putString(key: String, value: String?): Editor
              fun commit(): Boolean
            }
          }
          class Context {
            val applicationContext: Context get() = this
            private val map = mutableMapOf<String, Any?>()
            private val preferences = object : SharedPreferences {
              override val all: Map<String, Any?> get() = map.toMap()
              override fun getString(key: String, def: String?): String? = (map[key] as? String) ?: def
              override fun edit(): SharedPreferences.Editor = object : SharedPreferences.Editor {
                private val changes = mutableMapOf<String, String?>()
                override fun putString(key: String, value: String?) = apply { changes[key]=value }
                override fun commit(): Boolean {
                  changes.forEach { (k,v) -> if(v==null)map.remove(k) else map[k]=v }
                  return true
                }
              }
            }
            fun getSharedPreferences(name: String, mode: Int): SharedPreferences = preferences
            companion object { const val MODE_PRIVATE=0 }
          }
          KOTLIN
          cat > /tmp/pr133-qa/fixtures/com/wilito/weexautotrader/RealPosition.kt <<'KOTLIN'
          package com.wilito.weexautotrader
          data class RealPosition(val id: String, val symbol: String, val side: String,
            val unrealizedPnl: Double, val marginSize: Double)
          KOTLIN
          cat > /tmp/pr133-qa/fixtures/com/wilito/weexautotrader/RecorderTest.kt <<'KOTLIN'
          package com.wilito.weexautotrader
          import android.content.Context
          import org.junit.Assert.*
          import org.junit.Test
          class RecorderTest {
            private val now=1_800_000_000_000L
            private fun origin()=RealBotPositionOriginEvidence(
              "p-123","SEPARATED","open-1","open-1","client-1",
              "open-1","open-1","client-1",true)
            private fun p(pnl:Double,margin:Double=10.0)=
              RealPosition("p-123","BTCUSDT","SHORT",pnl,margin)
            @Test fun milestonePersistedEvenInsideThrottlingWindow() {
              val recorder=RealLiveRoiEpisodeRecorder(Context())
              val a=recorder.record(p(5.5),origin(),"signed-A",now-20_000L,now)
              assertTrue(a is RealRoiMilestoneReading.Observed)
              val b=recorder.record(p(-0.5),origin(),"signed-A",now-17_000L,now)
              assertTrue(b is RealRoiMilestoneReading.Observed)
              val traces=recorder.readForAccount("signed-A")!!
              assertEquals(1,traces.size)
              assertTrue(traces.single().reachedPlus50Observed)
              assertFalse(traces.single().reachedPlus100Observed)
              assertTrue(traces.single().gaveBackBelowPlus50AfterTouch)
              assertTrue(traces.single().turnedNegativeAfterPlus50)
              assertEquals(2,traces.single().observations)
              assertTrue(recorder.readForAccount("other-A")!!.isEmpty())
            }
            @Test fun missingBotOriginAndUnknownPnlDoNotEnterLearning() {
              val recorder=RealLiveRoiEpisodeRecorder(Context())
              val a=recorder.record(p(6.0),null,"signed-A",now-10_000L,now)
              assertEquals("BOT_ORIGIN_NOT_VERIFIED",(a as RealRoiMilestoneReading.Skipped).reason)
              val b=recorder.record(p(0.0),origin(),"signed-A",now-9_000L,now)
              assertEquals("SIGNED_UNREALIZED_PNL_UNCERTAIN_OR_ZERO",(b as RealRoiMilestoneReading.Skipped).reason)
              assertTrue(recorder.readForAccount("signed-A")!!.isEmpty())
            }
            @Test fun changedMarginCannotCreateFalseRoiPerformance() {
              val recorder=RealLiveRoiEpisodeRecorder(Context())
              assertTrue(recorder.record(p(5.5),origin(),"signed-A",now-20_000L,now) is RealRoiMilestoneReading.Observed)
              val altered=recorder.record(p(8.0,11.0),origin(),"signed-A",now-10_000L,now)
              assertEquals("MARGIN_CHANGED_ROI_NOT_COMPARABLE",(altered as RealRoiMilestoneReading.Skipped).reason)
              assertEquals(1,recorder.readForAccount("signed-A")!!.single().observations)
            }
            @Test fun replayedAndStaleSignedSnapshotsCannotEnterMemory() {
              val recorder=RealLiveRoiEpisodeRecorder(Context())
              assertTrue(recorder.record(p(5.5),origin(),"signed-A",now-20_000L,now) is RealRoiMilestoneReading.Observed)
              val replay=recorder.record(p(9.0),origin(),"signed-A",now-20_000L,now)
              assertEquals("ROI_REPLAY_OR_OUT_OF_ORDER",(replay as RealRoiMilestoneReading.Skipped).reason)
              val stale=recorder.record(p(9.0),origin(),"signed-A",now-150_000L,now)
              assertEquals("ROI_READING_STALE",(stale as RealRoiMilestoneReading.Skipped).reason)
            }
          }
          KOTLIN
          root=app/src/main/java/com/wilito/weexautotrader
          cp="/tmp/pr133-qa/junit.jar:/tmp/pr133-qa/hamcrest.jar:/tmp/pr133-qa/json.jar"
          /tmp/pr133-qa/kotlinc/bin/kotlinc \
            "$root/RealPositionOriginPolicy.kt" \
            "$root/RealRoiMilestoneShadowPolicy.kt" \
            "$root/RealLiveRoiEpisodeRecorder.kt" \
            /tmp/pr133-qa/fixtures/android/content/Context.kt \
            /tmp/pr133-qa/fixtures/com/wilito/weexautotrader/RealPosition.kt \
            /tmp/pr133-qa/fixtures/com/wilito/weexautotrader/RecorderTest.kt \
            -cp "$cp" -d /tmp/pr133-qa/classes
          java -cp "/tmp/pr133-qa/classes:$cp:/tmp/pr133-qa/kotlinc/lib/*" \
            org.junit.runner.JUnitCore com.wilito.weexautotrader.RecorderTest
          echo PR133_REAL_SIGNED_EPISODE_RECORDER_KOTLIN_JUNIT_PASS_NO_APK_NO_ORDER
