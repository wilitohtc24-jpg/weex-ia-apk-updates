name: WEEX PR133 safe FUTURE isolated separated mode pure Kotlin QA (NO APK)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr133-safe-future-position-mode-offline-qa-20261121.yml
permissions:
  contents: read
jobs:
  separated-mode-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: 192e4f87edab5d01d9b3d69a9ae4c6a24e8d24ab
    steps:
      - name: Checkout exact private feature SHA read-only
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 192e4f87edab5d01d9b3d69a9ae4c6a24e8d24ab
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Prove all future mode policy logic pure, no account mutation
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/wilito/weexautotrader")
          s=(root/"RealFutureSeparatedModePreflightPolicy.kt").read_text()
          for forbidden in ("signedPost(", "modifyTpSlOrder(", "placeProtectedMarketOrder(",
                            "updateIsolatedLeverage(", "WeexPrivateApi(",
                            "WeexTradeActionsApi(", "setEmergencyStop(",
                            "RealExecutionEngine(", "TraderService(",
                            "closePositions(", "SharedPreferences", "Context("):
            assert forbidden not in s, "Policy must be pure: "+forbidden
          for required in ("FUTURE_SEPARATED_ROLLOUT_NOT_APPROVED",
                           "EXISTING_POSITION_ORDER_OR_JOURNAL_NO_MODE_CHANGE",
                           "SIGNED_PORTFOLIO_OR_OPEN_ORDERS_INCOMPLETE",
                           "SIGNED_POSITION_MODE_UNRECOGNIZED",
                           "authorizesWeexModeChange:Boolean=false",
                           "authorizesRealOrder:Boolean=false",
                           "signedReadbackSeparatedType.equals"):
            assert required in s, "Safety rule missing: "+required
          print("WEEX_COMBINED_TO_SEPARATED_NO_LIVE_MUTATION_SOURCE_PASS")
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven Central isolated Kotlin compile and JUnit 13 tests (no GitHub binary download)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          root=app/src/main/java/com/wilito/weexautotrader
          testroot=app/src/test/java/com/wilito/weexautotrader
          temp=/tmp/weex-pr133-mode-policy
          mkdir -p "$temp/src/main/kotlin/com/wilito/weexautotrader"
          mkdir -p "$temp/src/test/kotlin/com/wilito/weexautotrader"
          cp "$root/RealFutureSeparatedModePreflightPolicy.kt" \
             "$temp/src/main/kotlin/com/wilito/weexautotrader/"
          cp "$testroot/RealFutureSeparatedModePreflightPolicyTest.kt" \
             "$temp/src/test/kotlin/com/wilito/weexautotrader/"
          cat > "$temp/pom.xml" <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.wilito.test</groupId>
            <artifactId>pr133-pure-mode</artifactId>
            <version>1.0.0</version>
            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <kotlin.version>2.2.21</kotlin.version>
            </properties>
            <dependencies>
              <dependency><groupId>org.jetbrains.kotlin</groupId><artifactId>kotlin-stdlib</artifactId><version>2.2.21</version></dependency>
              <dependency><groupId>junit</groupId><artifactId>junit</artifactId><version>4.13.2</version><scope>test</scope></dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.jetbrains.kotlin</groupId>
                  <artifactId>kotlin-maven-plugin</artifactId>
                  <version>2.2.21</version>
                  <executions>
                    <execution><id>compile</id><phase>compile</phase><goals><goal>compile</goal></goals></execution>
                    <execution><id>test-compile</id><phase>test-compile</phase><goals><goal>test-compile</goal></goals></execution>
                  </executions>
                </plugin>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-surefire-plugin</artifactId>
                  <version>3.3.1</version>
                </plugin>
              </plugins>
            </build>
          </project>
          XML
          mvn -B -ntp -f "$temp/pom.xml" test
          if ! grep -R -l 'tests="13"' "$temp/target/surefire-reports/"*.xml; then
            echo "Expected 13 independently executed tests, not a skipped build" >&2
            exit 1
          fi
          echo WEEX_PR133_FUTURE_SEPARATED_MODE_13_TESTS_NO_ORDER_NO_APK_PASS
