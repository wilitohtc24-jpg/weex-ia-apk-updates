# NO RELEASE. Android/JUnit on exact source after canonical materialization.
name: WEEX PR138 risk margin study materialized Android JUnit NO APK
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr138-stop-feasible-margin-android-junit-20261122.yml
permissions:
  contents: read
jobs:
  canonical-study-android-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE_SHA: eb230ba707d29a367dca1011c36df677b45fc0e3
      SELECTOR_BLOB: 838d36d93ef7d315b80724674b8e919b6704c066
      FUNNEL_BLOB: bfebb0c4738a13aaa6820dd2445abb91ba563060
      FUNNEL_TEST_BLOB: 356b030edc03bd9749294534cf67a14319fcb426
      MARGIN_STUDY_BLOB: 35a945a6729b361ece991d4fd30619c7d3cd2bdb
      MARGIN_STUDY_TEST_BLOB: 8cb2d3aae9866c8656faad6172161ce54252cf30
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch exact private research branch without write access
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: eb230ba707d29a367dca1011c36df677b45fc0e3
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Validate immutable read-only selector, funnel and test blobs
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealAIMarketSelector.kt)" = "$SELECTOR_BLOB"
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealSelectorFunnelEvidence.kt)" = "$FUNNEL_BLOB"
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealSelectorFunnelEvidenceTest.kt)" = "$FUNNEL_TEST_BLOB"
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealRiskFeasibleMarginStudyPolicy.kt)" = "$MARGIN_STUDY_BLOB"
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealRiskFeasibleMarginStudyPolicyTest.kt)" = "$MARGIN_STUDY_TEST_BLOB"
          test ! -e app/weex-ia-signing.jks
          echo WEEX_DIRECTION_FUNNEL_EXACT_SHA_AND_BLOBS_VERIFIED
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Kotlin 2.2.21 and Gradle 8.10.2 with Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -n "$MANAGER"
            "$MANAGER" 'platforms;android-35' >/dev/null
          fi
          curl -fsSL --retry 3 --retry-delay 3 https://github.com/JetBrains/kotlin/releases/download/v2.2.21/kotlin-compiler-2.2.21.zip -o /tmp/tie-kotlin.zip
          printf '%s  %s\n' a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714 /tmp/tie-kotlin.zip | sha256sum -c - >/dev/null
          mkdir -p "$HOME/.local"
          unzip -q -o /tmp/tie-kotlin.zip -d "$HOME/.local"
          echo "$HOME/.local/kotlinc/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 --retry-delay 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/tie-gradle.zip
          printf '%s  %s\n' 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26 /tmp/tie-gradle.zip | sha256sum -c - >/dev/null
          mkdir -p "$HOME/.gradle-dist"
          unzip -q -o /tmp/tie-gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          echo 'GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false' >> "$GITHUB_ENV"
      - name: Replay canonical pre-sign and full Android Gradle JUnit (NO APK)
        shell: bash
        working-directory: source
        env:
          WEEX_AUDIT_RUN_ANDROID_JUNIT: "1"
          WEEX_ART_QA_EXPORT_MATERIALIZED: "1"
          WEEX_ART_QA_EXPORT_DIR: /tmp/weex-pr138-margin-materialized
        run: |
          set -euo pipefail
          if ! python3 ci/preflight_full_presigning_source_v1.py >/tmp/tie-presign.log 2>&1; then
            echo "::error::WEEX_NEUTRAL_TIE_ANDROID_PRESIGN_OR_JUNIT_FAILED_NO_RELEASE"
            grep -E 'WEEX_PRESIGN_FIRST_FAILURE_LINE|WEEX_AUDIT_JUNIT_FAILED_TESTS_COUNT|WEEX_AUDIT_KOTLIN_ERROR_COUNT' /tmp/tie-presign.log | tail -10 || true
            exit 1
          fi
          grep -Fq 'WEEX_PRESIGN_SOURCE_REPLAY_PASS' /tmp/tie-presign.log
          grep -Fq 'WEEX_AUDIT_JUNIT_PASS' /tmp/tie-presign.log
          final=/tmp/weex-pr138-margin-materialized/main/java/com/wilito/weexautotrader
          test -s "$final/RealAIMarketSelector.kt"
          test -s "$final/RealSelectorFunnelEvidence.kt"
          grep -Fq 'REAL_DIRECTION_FUNNEL_READONLY_V1' "$final/RealAIMarketSelector.kt"
          grep -Fq 'technicalLong=technicalLong' "$final/RealAIMarketSelector.kt"
          grep -Fq 'technicalLong:Int=0' "$final/RealSelectorFunnelEvidence.kt"
          grep -Fq 'selectedDirection=chosen' "$final/RealAIMarketSelector.kt"
          test -s "$final/RealRiskFeasibleMarginStudyPolicy.kt"
          grep -Fq 'permitsRealEntry: Boolean = false' "$final/RealRiskFeasibleMarginStudyPolicy.kt"
          grep -Fq 'MAX_STUDIED_RISK_PCT = 20.0' "$final/RealRiskFeasibleMarginStudyPolicy.kt"
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo WEEX_PR138_MARGIN_STUDY_MATERIALIZED_ANDROID_JUNIT_PASS_NO_APK_NO_WEEX_NO_OTA
