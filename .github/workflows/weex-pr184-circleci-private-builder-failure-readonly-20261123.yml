name: WEEX PR184 CircleCI private builder failure diagnostics READ ONLY
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr184-circleci-private-builder-failure-readonly-20261123.yml
permissions:
  contents: read
jobs:
  inspect-failed-private-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      WID: a8ce870c-fda7-48ed-af31-9b13d4f1dc8b
      SOURCE_SHA: 99f6afc74795291d0f3acb45b593ea730a5c9d4f
    steps:
      - name: Read CircleCI failed job step results, sanitized and limited (NO APK)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.parse
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token,"PR184_CIRCLECI_READ_ONLY_TOKEN_NOT_AVAILABLE"
          wid=os.environ["WID"]
          api="https://circleci.com/api/v2"
          headers={"Circle-Token":token,"Accept":"application/json",
                   "User-Agent":"weex-pr184-failure-only-redacted-review"}
          def get(path):
              req=urllib.request.Request(api+path,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)
          w=get("/workflow/"+wid)
          p=get("/pipeline/"+w["pipeline_id"])
          assert (p.get("vcs") or {}).get("revision")==os.environ["SOURCE_SHA"],"WRONG_PIPELINE"
          print("PR184_FAILED_WORKFLOW_STATUS="+str(w.get("status")))
          jobs=get("/workflow/"+wid+"/job").get("items",[])
          for j in jobs:
              print("PR184_JOB_NAME="+str(j.get("name"))+" STATUS="+str(j.get("status")))
              if j.get("name")!="pr184_private_signed_candidate":continue
              n=int(j["job_number"])
              print("PR184_CIRCLECI_PRIVATE_JOB_NUMBER="+str(n))
              detail=get("/project/gh/wilitohtc24-jpg/weex-auto-trader-android/job/"+str(n))
              print("PR184_CIRCLECI_JOB_STATUS="+str(detail.get("status")))
              steps=detail.get("steps") or []
              print("PR184_CIRCLECI_DETAIL_FIELDS="+",".join(sorted(detail.keys())))
              print("PR184_CIRCLECI_DETAIL_NO_SECRETS count_steps="+str(len(steps))+
                    " cancelled="+str(detail.get("canceled"))+
                    " stopped="+str(detail.get("stopped_at"))+
                    " duration="+str(detail.get("duration")))
              for index,s in enumerate(steps):
                  name=re.sub(r"[^a-zA-Z0-9_ ./:()-]","?",str(s.get("name","")))[:120]
                  vals=[str(a.get("status"))+"/"+str(a.get("exit_code"))+
                        "/"+str(a.get("type")) for a in s.get("actions") or []]
                  print("PR184_CIRCLECI_STEP_"+str(index+1)+"="+name+
                        " outcomes="+",".join(vals)[:180])
              seen=0
              for s in steps:
                  for a in s.get("actions") or []:
                      code=a.get("exit_code")
                      status=a.get("status")
                      if code is not None and code!=0 or status in ("failed","error"):
                          name=str(s.get("name") or a.get("name") or "")
                          print("PR184_FAILED_STEP="+re.sub(r"[^a-zA-Z0-9_ ./:()-]","?",name)[:160]+
                            " EXIT="+str(code)+" STATUS="+str(status))
                          seen+=1
                          url=a.get("output_url") or ""
                          purl=urllib.parse.urlparse(url)
                          if purl.scheme!="https" or not (
                              (purl.hostname or "").endswith(".circleci.com") or
                              (purl.hostname or "")=="circleci.com" or
                              (purl.hostname or "").endswith(".amazonaws.com")):
                              print("PR184_STEP_OUTPUT_NOT_ALLOWLISTED")
                              continue
                          try:
                              req=urllib.request.Request(url,headers={"User-Agent":"weex-pr184-safe-diagnostics"})
                              with urllib.request.urlopen(req,timeout=35) as r:data=r.read(1000000)
                              output=json.loads(data.decode(errors="replace"))
                              messages=[]
                              if isinstance(output,list):
                                  messages=[str(x.get("message","")) for x in output if isinstance(x,dict)]
                              elif isinstance(output,dict):
                                  messages=[str(output.get("message",""))]
                              all_lines="\n".join(messages).splitlines()
                              flags=("PR184_","WEEX_","error:","FAILURE:","failed","Exception:",
                                     "No such file","assertion","Expected","Not found","NotFound",
                                     "Permission denied","cannot find","not authorized","unbound variable")
                              selection=[x for x in all_lines if any(k.lower() in x.lower() for k in flags)]
                              def scrub(s):
                                  s=re.sub(r'(?i)(?:token|secret|key|passphrase|password)\s*[:=]\s*[^ ]+',"[REDACTED]",s)
                                  s=re.sub(r'(?i)(?:Bearer|Basic)\s+[A-Za-z0-9_+\-/=]+',"[REDACTED_AUTH]",s)
                                  s=re.sub(r'AKIA[0-9A-Z]{16}',"[REDACTED_AWS]",s)
                                  return s[:230]
                              for line in selection[-18:]:
                                  print("PR184_SAFE_FAILURE_CONTEXT="+scrub(line))
                          except Exception as exc:
                              print("PR184_STEP_OUTPUT_FETCH_ERROR="+type(exc).__name__)
              if seen==0:print("PR184_NO_NONZERO_EXIT_STEPS_JOB_STATUS="+str(detail.get("status")))
          print("PR184_CIRCLECI_FAILURE_DIAGNOSTICS_COMPLETE_NO_APK_NO_OTA")
          PY
