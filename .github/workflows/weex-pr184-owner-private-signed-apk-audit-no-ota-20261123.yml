name: WEEX PR184 independently audit PRIVATE signed APK bytes and cert NO OTA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr184-owner-private-signed-apk-audit-no-ota-20261123.yml
permissions:
  contents: read
jobs:
  verify-private-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      EXPECTED_AUTH_SHA: "bc7c626090e1b1dd6b05f62251fc9becbfe3d2af"
      EXPECTED_WORKFLOW_ID: "1c707036-e20e-4276-ac91-a354cf03ea9e"
      EXPECTED_GREEN_SHA: "800be05454697cb4647d60b9d4abb89b0da2701b"
      EXPECTED_SIGNER: "5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"
      PREVIOUS_PUBLIC_OTA: "30205252"
    steps:
      - name: Verify finished private CircleCI job, provenance, complete artifact, SHA256, certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CIRCLECI_READ_TOKEN"
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.parse
          base="https://circleci.com/api/v2"
          project="/project/gh/wilitohtc24-jpg/weex-auto-trader-android"
          token=os.environ["CIRCLECI_READ_TOKEN"]
          wid=os.environ["EXPECTED_WORKFLOW_ID"]
          assert re.fullmatch(r"[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}",wid)
          headers={"Circle-Token":token,"Accept":"application/json",
                   "User-Agent":"pr184-private-signed-independent-audit"}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)
          workflow=get("/workflow/"+wid)
          assert workflow.get("status")=="success",("WRONG_CIRCLECI_STATUS",workflow.get("status"))
          pipeline=get("/pipeline/"+workflow["pipeline_id"])
          vcs=pipeline.get("vcs") or {}
          assert vcs.get("revision")==os.environ["EXPECTED_AUTH_SHA"],"WRONG_BUILD_SHA"
          assert vcs.get("branch")=="build/weex-pr184-owner-private-apk-v3-20261123","WRONG_BUILD_BRANCH"
          jobs=get("/workflow/"+wid+"/job").get("items",[])
          matches=[j for j in jobs if j.get("name")=="pr184_private_signed_candidate"
                   and j.get("status")=="success"]
          assert len(matches)==1,"NO_UNIQUE_SUCCESSFUL_PRIVATE_BUILD_JOB"
          job=str(matches[0]["job_number"])
          rows=get(project+"/"+job+"/artifacts").get("items",[])
          prefix="private-pr184-circleci-candidate/"
          assets={x.get("path"):x for x in rows}
          names=("WEEX-IA-Trader-release.apk","apk-sha256.txt",
                 "signing-certificate.txt","release.json","candidate-provenance.txt")
          assert all(prefix+n in assets for n in names),"PR184_PRIVATE_ARTIFACTS_MISSING"
          print("PR184_SIGNED_PRIVATE_ARTIFACTS_ALL_PRESENT job="+job,flush=True)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,url):
                  nxt=super().redirect_request(req,fp,code,msg,headers,url)
                  if nxt is not None:
                      for d in (nxt.headers,nxt.unredirected_hdrs):
                          for key in list(d):
                              if key.lower()=="circle-token":
                                  del d[key]
                  return nxt
          opener=urllib.request.build_opener(SafeRedirect())
          def remote(name):
              url=assets[prefix+name].get("url","")
              parsed=urllib.parse.urlparse(url)
              assert parsed.scheme=="https" and parsed.hostname in (
                  "circleci.com","output.circle-artifacts.com"),"UNTRUSTED_ARTIFACT_HOST"
              return opener.open(urllib.request.Request(url,headers={
                  "Circle-Token":token,"User-Agent":"pr184-private-auditor"}),timeout=150)
          def small(name,limit=250000):
              with remote(name) as r:data=r.read(limit+1)
              assert len(data)<=limit,"OVERSIZED_METADATA"
              return data.decode("utf8")
          expected=small("apk-sha256.txt").split()[0].lower()
          assert re.fullmatch("[a-f0-9]{64}",expected),"INVALID_APK_SHA256"
          prov=dict(x.split("=",1) for x in small("candidate-provenance.txt").splitlines() if "=" in x)
          assert prov.get("source")==os.environ["EXPECTED_AUTH_SHA"],"WRONG_SOURCE_PROVENANCE"
          assert prov.get("green_source")==os.environ["EXPECTED_GREEN_SHA"],"WRONG_GREEN_SHA"
          assert prov.get("private_only")=="true" and prov.get("ota_publication")=="false","NOT_PRIVATE"
          assert prov.get("previousOTA")==os.environ["PREVIOUS_PUBLIC_OTA"],"WRONG_OLD_OTA"
          version=int(prov["versionCode"])
          assert int(os.environ["PREVIOUS_PUBLIC_OTA"])<version<=2100000000,"NON_INSTALLABLE_VERSION"
          manifest=json.loads(small("release.json"))
          for k in ("versionCode","version_code"):
              if k in manifest:assert int(manifest[k])==version,"VERSION_MISMATCH"
          if "packageName" in manifest:
              assert manifest["packageName"]=="com.wilito.weexautotrader","PACKAGE_MISMATCH"
          cert=small("signing-certificate.txt")
          patt=(r"(?mi)^\s*Signer\s+#\d+\s+certificate\s+SHA-256\s+digest:\s*([a-f0-9:]+)\s*$",
                r"(?mi)^\s*V\d+(?:\.\d+)?\s+Signer:\s+certificate\s+SHA-256\s+digest:\s*([a-f0-9:]+)\s*$")
          digests={v.replace(":","").lower() for p in patt for v in re.findall(p,cert,re.I)}
          assert digests=={os.environ["EXPECTED_SIGNER"]},"WRONG_SIGNING_CERTIFICATE"
          h=hashlib.sha256()
          total=0
          with remote("WEEX-IA-Trader-release.apk") as source:
              with open("/tmp/weex-pr184-private-signed.apk","wb") as output:
                  first=source.read(4)
                  assert first==b"PK\x03\x04","NOT_APK_ZIP"
                  h.update(first);output.write(first);total+=4
                  while True:
                      b=source.read(1024*1024)
                      if not b:break
                      h.update(b);output.write(b);total+=len(b)
                      assert total<200*1024*1024,"APK_TOO_LARGE"
          assert total>10*1024*1024 and h.hexdigest()==expected,"SIGNED_APK_SHA256_MISMATCH"
          print("PR184_PRIVATE_APK_VERSION_CODE="+str(version),flush=True)
          print("PR184_PRIVATE_APK_SHA256="+expected,flush=True)
          print("PR184_PRIVATE_APK_SIZE_BYTES="+str(total),flush=True)
          print("PR184_PRIVATE_APK_CIRCLECI_JOB="+job,flush=True)
          print("PR184_PRIVATE_APK_BYTE_CERT_PROVENANCE_AUDIT_PASS_NO_OTA",flush=True)
          PY
      - name: Verify APK cryptographic signature with Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -x "$BIN"
          "$BIN" verify --verbose --print-certs /tmp/weex-pr184-private-signed.apk > /tmp/pr184-verified-signer.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=Path("/tmp/pr184-verified-signer.txt").read_text()
          values={v.replace(":","").lower() for v in re.findall(
              r"(?mi)^\s*(?:Signer\s+#\d+|V\d+(?:\.\d+)?\s+Signer:)\s+certificate\s+SHA-256\s+digest:\s*([a-f0-9:]+)\s*$",s,re.I)}
          # A certificate digest is public metadata, not a signing key.
          for ln in s.splitlines():
              if "certificate sha-256 digest" in ln.lower():
                  print("PR184_APKSIGNER_PUBLIC_CERT_LINE="+ln.strip()[:230],flush=True)
          print("PR184_APKSIGNER_PARSED_DIGEST_COUNT="+str(len(values)),flush=True)
          assert values=={os.environ["EXPECTED_SIGNER"]},"PR184_APKSIGNER_ORIGINAL_CERT_MISMATCH"
          print("PR184_PRIVATE_SIGNED_APK_INDEPENDENT_APKSIGNER_PASS_NO_OTA")
          PY
