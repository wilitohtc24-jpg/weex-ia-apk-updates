# Explicit user instruction: "Publicala" on 2026-11-23.
# Promote only the SAME independently verified CircleCI APK staged as draft.
# No rebuild, no signer change, no real WEEX orders.
name: WEEX PR184 owner-approved exact signed BETA OTA v30379864
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-pr184-promote-owner-approved-public-beta-ota-20261123.yml
permissions:
  contents: write
concurrency:
  group: weex-global-beta-ota-promotion
  cancel-in-progress: false
jobs:
  promote-verified-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "455005639"
      VERSION_CODE: "30379864"
      STAGE_RUN_ID: "45115126637"
      STAGE_WORKFLOW_SHA: "48f5abf28b7d9911470ffd90ff1e51e2378a74c1"
      SIGNED_UPGRADE_RUN_ID: "45109650232"
      SIGNED_UPGRADE_HEAD: "81a0dbaac882a762eabaa3f3d56e9d6896742222"
      AUTHORIZED_BUILD_SHA: "bc7c626090e1b1dd6b05f62251fc9becbfe3d2af"
      GREEN_SOURCE_SHA: "800be05454697cb4647d60b9d4abb89b0da2701b"
      APP_SHA256: "283754aa6e840234d9c9e87ed09deaaa7ee4e3512ba52bd34a309afd20556769"
      APP_BYTES: "63560151"
      SIGNER_SHA256: "5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"
      PREVIOUS_LATEST: "v30205252"
      ARTIFACT_AUDIT_RUN: "45109567059"
      ARTIFACT_AUDIT_HEAD: "07479c770163ba82e2e455050d7740abbca79f22"
      JUNIT_RUN: "45103785323"
      JUNIT_HEAD: "e946e33a8cfdb988ab2caa010d35a0428955a312"
      ANDROID_ART_SOURCE_RUN: "45105974721"
      ANDROID_ART_SOURCE_HEAD: "353d07f0b39c49ad5f53082677d8facc9182941e"
    steps:
      - name: Confirm explicit owner approval, exact release draft and independent Android test
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wilitohtc24-jpg/weex-ia-apk-updates"
          test "$GITHUB_EVENT_NAME" = "push" && test "$GITHUB_REF" = "refs/heads/main"
          test "$VERSION_CODE" -gt 30205252
          mkdir -p /tmp/weex-pr184-promote
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > /tmp/weex-pr184-promote/draft.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/weex-pr184-promote/prior.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" > /tmp/weex-pr184-promote/stage.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_UPGRADE_RUN_ID" > /tmp/weex-pr184-promote/upgrade.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_AUDIT_RUN" > /tmp/weex-pr184-promote/audit.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$JUNIT_RUN" > /tmp/weex-pr184-promote/junit.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_ART_SOURCE_RUN" > /tmp/weex-pr184-promote/source-art.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("/tmp/weex-pr184-promote")
          def read(name):return json.loads((root/(name+".json")).read_text())
          draft=read("draft")
          prior=read("prior")
          stage=read("stage")
          upgrade=read("upgrade")
          audit=read("audit")
          junit=read("junit")
          source_art=read("source-art")
          assert prior["tag_name"]==os.environ["PREVIOUS_LATEST"]
          assert prior["id"]==453415973 and not prior["draft"] and not prior["prerelease"]
          assert draft["id"]==int(os.environ["RELEASE_ID"])
          assert draft["draft"] is True and draft["prerelease"] is False and draft["published_at"] is None
          assert draft["tag_name"] in ("v"+os.environ["VERSION_CODE"],"untagged-c7ad92b0a1b68a9d21e5")
          body=draft.get("body") or ""
          for required in (
              "WEEX_OTA_RELEASE_APPROVED_V1",
              "WEEX_OTA_PUBLIC_TEST_BETA_V1",
              "WEEX_PR184_OWNER_AUTHORIZED_GLOBAL_BETA_20261123_V1",
              os.environ["APP_SHA256"],
              os.environ["AUTHORI"+"ZED_BUILD_SHA"],
              os.environ["GREEN_SOURCE_SHA"],
              os.environ["SIGNER_SHA256"]
          ):
              assert required in body,"Owner-approved OTA proof/notes missing"
          assets={a["name"]:a for a in draft["assets"]}
          assert set(assets)=={"WEEX-IA-Trader-release.apk","apk-sha256.txt"}
          apk=assets["WEEX-IA-Trader-release.apk"]
          assert apk["state"]=="uploaded"
          assert apk["digest"]=="sha256:"+os.environ["APP_SHA256"]
          assert apk["size"]==int(os.environ["APP_BYTES"])
          assert assets["apk-sha256.txt"]["state"]=="uploaded"
          assert stage["id"]==int(os.environ["STAGE_RUN_ID"])
          assert stage["status"]=="completed" and stage["conclusion"]=="success"
          assert stage["head_sha"]==os.environ["STAGE_WORKFLOW_SHA"]
          assert upgrade["id"]==int(os.environ["SIGNED_UPGRADE_RUN_ID"])
          assert upgrade["status"]=="completed" and upgrade["conclusion"]=="success"
          assert upgrade["head_sha"]==os.environ["SIGNED_UPGRADE_HEAD"]
          for run,label in ((audit,"ARTIFACT_AUDIT"),(junit,"JUNIT"),(source_art,"SOURCE_ANDROID_ART")):
              assert run["status"]=="completed" and run["conclusion"]=="success",(label,"QA_NOT_GREEN")
          assert audit["id"]==int(os.environ["ARTIFACT_AUDIT_RUN"]) and audit["head_sha"]==os.environ["ARTIFACT_AUDIT_HEAD"]
          assert junit["id"]==int(os.environ["JUNIT_RUN"]) and junit["head_sha"]==os.environ["JUNIT_HEAD"]
          assert source_art["id"]==int(os.environ["ANDROID_ART_SOURCE_RUN"]) and source_art["head_sha"]==os.environ["ANDROID_ART_SOURCE_HEAD"]
          print("PR184_OWNER_APPROVAL_VERIFIED_EXACT_DRAFT_SIGNED_APK_PRIOR_OTA_AND_ANDROID_QA")
          PY

      - name: Correct beta notes while release is still private draft
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = "true"
          cat > /tmp/weex-pr184-promote/approved-beta-notes.md <<EOF
          WEEX_OTA_RELEASE_APPROVED_V1
          WEEX_OTA_PUBLIC_TEST_BETA_V1
          WEEX_PR184_OWNER_AUTHORIZED_GLOBAL_BETA_20261123_V1
          
          WEEX IA Trader PR184 — BETA publica VOLUNTARIA v$VERSION_CODE.
          El propietario autorizo que TODOS los usuarios puedan probar esta APK.
          Es EXACTAMENTE la APK firmada que aprobo auditoria y reinstalacion Android.
          Instalar encima de la actual, NO DESINSTALAR ni borrar datos.
          
          NOVEDAD: proteccion de GANANCIAS NETAS desde +4 USDT de posiciones
          WEEX COMBINED NUEVAS de origen bot verificado con un unico STOP/journal.
          El panel de propietario y la habilitacion global siguen siendo EXCLUSIVOS;
          los demas NO pueden activar esta protección ni acceder al panel privado.
          El permiso global debe estar ON y la identidad, posicion y STOP/TP comprobados.
          Sin modificar posiciones manuales ni de origen incierto.
          
          AVISO: esta proteccion COMBINED REAL AÚN NO ESTÁ DEMOSTRADA
          en ordenes WEEX REAL con dinero. Las pruebas fueron offline/sinteticas.
          STOP y trading automatico no garantizan beneficios; slippage, gaps,
          comisiones, liquidaciones y perdidas siguen siendo posibles.
          Uso voluntario: comprobar SIM y, antes de REAL, verificar en WEEX
          posiciones, saldo, STOP/TP y escaner. No forzar ordenes reales de QA.
          
          VersionCode: $VERSION_CODE
          APK SHA-256: $APP_SHA256
          Tamano: $APP_BYTES bytes
          Certificado original SHA256: $SIGNER_SHA256
          Paquete: com.wilito.weexautotrader
          Compilacion autorizada: $AUTHORIZED_BUILD_SHA
          Codigo fuente probado: $GREEN_SOURCE_SHA
          CircleCI job: #53063
          Auditoria independiente: https://github.com/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_AUDIT_RUN
          Android RELEASE in-place: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SIGNED_UPGRADE_RUN_ID
          PR DRAFT: https://github.com/wilitohtc24-jpg/weex-auto-trader-android/pull/184
          EOF
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="WEEX IA Trader BETA de prueba - v$VERSION_CODE" \
            -F draft=true -F prerelease=false \
            -f body="$(cat /tmp/weex-pr184-promote/approved-beta-notes.md)" \
            > /tmp/weex-pr184-promote/approved-draft.json
          python3 - <<'PY'
          import json,os
          r=json.load(open("/tmp/weex-pr184-promote/approved-draft.json"))
          text=r.get("body") or ""
          assert r["draft"] is True and r["prerelease"] is False
          assert r["tag_name"] in ("v"+os.environ["VERSION_CODE"],"untagged-c7ad92b0a1b68a9d21e5")
          assert "PR184" in text and "TODOS los usuarios" in text
          assert "NO pueden activar esta protección" in text
          assert os.environ["APP_SHA256"] in text
          assert "WEEX_PR184_OWNER_AUTHORIZED_GLOBAL_BETA_20261123_V1" in text
          assert "WEEX IA Trader PR #128" not in text and "PR128" not in text
          print("PR184_BETA_HONEST_PUBLIC_WARNINGS_VERIFIED_WHILE_DRAFT")
          PY

      - name: Publish verified exact draft as newest non-prerelease OTA
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$PREVIOUS_LATEST"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="v$VERSION_CODE" -f target_commitish=main \
            -F draft=false -F prerelease=false -f make_latest=true \
            > /tmp/weex-pr184-promote/published.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/weex-pr184-promote/latest.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("/tmp/weex-pr184-promote")
          latest=json.loads((root/"latest.json").read_text())
          promoted=json.loads((root/"published.json").read_text())
          assert promoted["id"]==latest["id"]==int(os.environ["RELEASE_ID"])
          assert latest["tag_name"]=="v"+os.environ["VERSION_CODE"]
          assert latest["draft"] is False and latest["prerelease"] is False
          assert latest["published_at"] is not None and "BETA" in latest["name"]
          for marker in ("WEEX_OTA_RELEASE_APPROVED_V1",
                         "WEEX_OTA_PUBLIC_TEST_BETA_V1",
                         "WEEX_PR184_OWNER_AUTHORIZED_GLOBAL_BETA_20261123_V1"):
              assert marker in latest["body"]
          assert os.environ["APP_SHA256"] in latest["body"]
          assert "TODOS los usuarios" in latest["body"]
          assert "AÚN NO ESTÁ DEMOSTRADA" in latest["body"]
          assert "NO pueden activar esta protección" in latest["body"]
          assert "PR128" not in latest["body"] and "PR129" not in latest["body"]
          assets={a["name"]:a for a in latest["assets"]}
          assert set(assets)=={"WEEX-IA-Trader-release.apk","apk-sha256.txt"}
          apk=assets["WEEX-IA-Trader-release.apk"]
          assert apk["state"]=="uploaded" and apk["size"]==int(os.environ["APP_BYTES"])
          assert apk["digest"]=="sha256:"+os.environ["APP_SHA256"]
          expected=("https://github.com/"+os.environ["GITHUB_REPOSITORY"]+
                    "/releases/download/v"+os.environ["VERSION_CODE"]+
                    "/WEEX-IA-Trader-release.apk")
          assert apk["browser_download_url"]==expected,(
              "Unexpected URL for OTA client",apk["browser_download_url"])
          print("PR184_OWNER_APPROVED_PUBLIC_BETA_OTA_LATEST_DISCOVERABLE_VERIFIED")
          print("PR184_PUBLIC_OTA_VERSION="+os.environ["VERSION_CODE"])
          print("PR184_PUBLIC_OTA_APK_SHA256="+os.environ["APP_SHA256"])
          print("PR184_PUBLIC_OTA_APK_URL="+expected)
          PY
