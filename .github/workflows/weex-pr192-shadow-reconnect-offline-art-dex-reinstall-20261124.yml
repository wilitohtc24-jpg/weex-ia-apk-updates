      WEEX_ART_QA_EXPORT_DIR: /tmp/weex-pr192-art-materialized
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout immutable private source, no write credentials
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 105df5cfbe79875eb13acef4bd9134f917a8c7ce
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Confirm source and preserve owner release separation
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object .circleci/config.yml)" = 48333b42698fde7ed05703fd46e79135d87d97ce
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/NeonTransportFailureDiagnostic.kt)" = 3418d48e3680e620cd6af43ec1456109e89a783a
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/MainActivity.kt)" = fb0e9a6707c05732baed18187ab1253dd69fdddd
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealProfitStopGateChartStatus.kt)" = dbe7cf9f6c5b00125b9257ed3a8615b2da1ce6d0
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealProfitStopGateChartStatusTest.kt)" = 40e1e4dd0d296ccf1f730c43b31812122139bc98
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicy.kt)" = a74aa0d0ab074b510aafa145486dd51027981ce9
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicyTest.kt)" = 992f29706f24771ff3ce354c5650c662eef1403f
          # Existing online shadow training now labels ONLY its own TF and exact
          # verified future closed candle (never a late price after VPN gaps).
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/OnlineShadowLearning.kt)" = 9fb7f2c4ba5dbf3c0a613a1cf445f44d6815e9d2
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicy.kt)" = 87a63bff67f1d1746799e8c8c478af13a9a85f64
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicyTest.kt)" = adc0070c248940e760674996d2b2f21cc137c459
          grep -Fq 'RealProfitStopGateChartStatus.message(' app/src/main/java/com/wilito/weexautotrader/MainActivity.kt
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealAppliedLearningCertifiedClosePipeline.kt)" = 46fdc0332a43004cb935680d633ec0a3bb08ad3d
          test ! -e app/weex-ia-signing.jks
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPendingHistoricalMakerStudyPolicy.kt)" = b2d77430ad76fbc4baed76739042ca080a39e149
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPendingHistoricalMakerReadOnlyWorker.kt)" = 7fb6fccd8848789701c63ed4b3e137c86c1bb608
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealPendingHistoricalMakerStudyPolicyTest.kt)" = aa9e37b31c94873232fab64268417ae2a8fd466a
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPendingEntryCoordinator.kt)" = a6bd5cb4d7326daa468fe50e9e60a2b2ceab80ad
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/TraderService.kt)" = 9edebea3ece9258115640b7168e7886f6d88614f
          test "$(git hash-object ci/verify_pr192_historical_maker_offscanner_readonly_v1.py)" = 1c12ea88f006daaac6b87598cf3c82df0d4d9acf
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealSignedOriginalOpeningReadOnlyCollector.kt)" = c29b9480e17050ee23b3576f2cffa78bb3ab3965
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPendingHistoricalMakerRoundTripQuantityPolicy.kt)" = 244f6d26cf02937a6afdfa15fe1e2d8bbcf5c24f
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealPendingHistoricalMakerRoundTripQuantityPolicyTest.kt)" = cf866924d06f8acdb68408f48ef82d7a67673fac
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealSignedOriginalOpeningReadOnlyCollectorTest.kt)" = a705279fe02a92287cc880f5ccae8860e12133d8
          test -s app/src/test/java/com/wilito/weexautotrader/RealPendingHistoricalMakerRoundTripQuantityPolicyTest.kt
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealLegacyMakerSignedOpeningReadOnlyCollector.kt)" = 02f5b36e755453e98c4a471a5ab06fc97178a1e5
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealLegacyMakerSignedOpeningReadOnlyCollectorTest.kt)" = 57c99705acd7739a067cff19504898a25f2609c0
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealDailyLedgerBackgroundSingleFlight.kt)" = 12582bc30c21c7e70abd92593c76b9c97b11c99a
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealDailyLedgerBackgroundSingleFlightTest.kt)" = da38a6c46328f4c409305ceeca1b5fa260ce2d6d
          test "$(git hash-object ci/patch_weex_funding_ledger.py)" = 54c1ae8c63f5fd34b230d63639ae8a8100839530
          test "$(git hash-object ci/verify_pr192_real_daily_ledger_offscanner_v1.py)" = 2b12b28bf3e07203fabeed875efc92ca4c311364
          test "$(git hash-object ci/verify_real_preflight_progress_v1.py)" = 12ea54ebdc61fd95d67e802c11a459c86e2f500e
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealTradingPnl.kt)" = 34cf5e5b12cbf54bfbde86fc108773389bdc860d
          python3 ci/verify_pr192_real_daily_ledger_offscanner_v1.py
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/WeexPrivateApi.kt)" = 61fd38f5244974b943105f8521e49a09eee83d84
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealHistoricalOrderFillWindowPolicy.kt)" = 77d2596a0f870b64c2f3d7aa23f7e2c9472c391c
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealHistoricalOrderFillWindowPolicyTest.kt)" = bd0a4d4f1eeda08b04f3a2ffb9eebc3ee76c8d21
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealBotSignedCloseReadOnlyCollector.kt)" = f83d96986e0f7af4ea5cc19857fdc212060804dc
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealBotSignedCloseReadOnlyCollectorTest.kt)" = 9e48b9de00b1e5475f21e874410a02a43171ceec
          python3 ci/verify_pr192_historical_maker_offscanner_readonly_v1.py
          python3 ci/verify_manual_build_only.py
          echo PR192_ART_SOURCE_PINNED_NO_RELEASE_SIGNER
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35 and pinned Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -n "$MANAGER"
            "$MANAGER" 'platforms;android-35' >/dev/null
          fi
          curl -fsSL --retry 3 --retry-delay 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/pr192-gradle.zip
          printf '%s  %s\n' '31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26' /tmp/pr192-gradle.zip | sha256sum -c -
          mkdir -p "$HOME/.gradle-dist"
          unzip -q -o /tmp/pr192-gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Canonical materialization, Android JUnit and disposable debug DEX
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          # Full source + JUnit proof is mandatory BEFORE debug APK creation.
          if ! python3 ci/preflight_full_presigning_source_v1.py >/tmp/pr192-art-presign.log 2>&1; then
            echo "::error::PR192_ART_CANONICAL_PRESIGN_FAILED_NO_OTA"
            grep -E 'WEEX_PRESIGN_FIRST_FAILURE_LINE|PRESIGN_FAILURE_CONTEXT|WEEX_AUDIT_JUNIT_FAILED_TESTS_COUNT|AUDIT_JUNIT_FAILED|WEEX_AUDIT_KOTLIN_FIRST_ERROR|WEEX_PREFLIGHT_BLOCKED' /tmp/pr192-art-presign.log | tail -70 || true
            exit 1
          fi
          grep -Fq 'WEEX_AUDIT_JUNIT_PASS' /tmp/pr192-art-presign.log
          grep -Fq 'WEEX_PRESIGN_SOURCE_REPLAY_PASS' /tmp/pr192-art-presign.log
          FINAL=/tmp/weex-pr192-art-materialized/main/java/com/wilito/weexautotrader
          test -s "$FINAL/TraderService.kt"
          test -s "$FINAL/NeonTransportFailureDiagnostic.kt"
          test -s "$FINAL/RealAppliedLearningCertifiedClosePipeline.kt"
          test -s "$FINAL/CausalPricePathForecastStudy.kt"
          test -s "$FINAL/RealContinuousImprovementContinuityPolicy.kt"
          test -s "$FINAL/OnlineShadowMaturationPolicy.kt"
          test -s "$FINAL/RealPendingHistoricalMakerReadOnlyWorker.kt"
          test -s "$FINAL/RealPendingHistoricalMakerRoundTripQuantityPolicy.kt"
          test -s "$FINAL/RealLegacyMakerSignedOpeningReadOnlyCollector.kt"
          test -s "$FINAL/RealHistoricalOrderFillWindowPolicy.kt"
          test -s "$FINAL/RealBotSignedCloseReadOnlyCollector.kt"
          test -s "$FINAL/RealDailyLedgerBackgroundSingleFlight.kt"
          grep -Fq 'realDailyLedgerBackground.scheduleIfIdle {' "$FINAL/TraderService.kt"
          grep -Fq 'REAL_LEDGER_OFFSCANNER_COMMIT_GUARD_V1' "$FINAL/TraderService.kt"
          grep -Fq 'RealTradingPnl.markSyncInProgress(applicationContext)' "$FINAL/TraderService.kt"
          grep -Fq 'fun markSyncInProgress(' "$FINAL/RealTradingPnl.kt"
          grep -Fq 'historical?.schedule(stored,status,detail?.executedQuantity,filledIntoPosition)' "$FINAL/RealPendingEntryCoordinator.kt"
          grep -Fq 'OnlineShadowMaturationPolicy.classify(' "$FINAL/OnlineShadowLearning.kt"
          grep -Fq 'MAX_FOREIGN_CONTEXT_RECOVERY_GRACE_MS' "$FINAL/OnlineShadowMaturationPolicy.kt"
          grep -Fq 'age>horizon+MAX_FOREIGN_CONTEXT_RECOVERY_GRACE_MS' "$FINAL/OnlineShadowMaturationPolicy.kt"
          grep -Fq 'vpnGapOnOtherMarketDoesNotDestroyOriginalHistoricalTrainingTarget' app/src/test/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicyTest.kt
          grep -Fq 'vpnFirstOwnMarketTickWithoutCandlesCanLaterLearnOnlyOriginalClosedBar' app/src/test/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicyTest.kt
          grep -Fq 'oldSameMarketHistoryExpiresAfterRecoveryCapEvenIfPriceIsPresent' app/src/test/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicyTest.kt
          test -s app/src/test/java/com/wilito/weexautotrader/OnlineShadowMaturationPolicyTest.kt
          test -s app/src/test/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicyTest.kt
          test -s app/src/test/java/com/wilito/weexautotrader/CausalPricePathForecastStudyTest.kt
          grep -Fq 'RealVerifiedLearningProgressCard(' "$FINAL/MainActivity.kt"
          grep -Fq 'optionalProfitStopFreshOwnerAuthority' "$FINAL/Diagnostics.kt"
          test -s "$FINAL/RealProfitStopGateChartStatus.kt"
          grep -Fq 'RealProfitStopGateChartStatus.message(' "$FINAL/MainActivity.kt"
          # Only an ephemeral exported source tree is modified; original
          # canonical signed source in Git remains untouched and pinned.
          rsync -a --delete /tmp/weex-pr192-art-materialized/main/ app/src/main/
          cp /tmp/weex-pr192-art-materialized/build.gradle.kts app/build.gradle.kts
          # Original RELEASE keystore must NEVER be sourced by an offline test.
          test ! -e app/weex-ia-signing.jks
          keytool -genkeypair -keystore app/weex-ia-signing.jks -storepass android -keypass android -alias weexia -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=PR192-OFFLINE-TEST-ONLY,OU=DISPOSABLE,O=NEVER-RELEASE' >/dev/null 2>&1
          test -s app/weex-ia-signing.jks
          # Emulator-specific x86_64 and AndroidX test-only dependencies.
          # This is a disposable CI checkout; do NOT commit to production.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text(encoding="utf-8")
          abi='abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))'
          assert s.count(abi)==1, "PR192_ART_ABI_BASE_CHANGED"
          s=s.replace(abi,'abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86_64"))',1)
          default='    defaultConfig {'
          assert s.count(default)==1, "PR192_ART_DEFAULTCONFIG_BASE_CHANGED"
          s=s.replace(default,default+'\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"',1)
          dep='    testImplementation("junit:junit:4.13.2")'
          assert s.count(dep)==1, "PR192_ART_JUNIT_BASE_CHANGED"
          s=s.replace(dep,dep+
              '\n    androidTestImplementation("androidx.test:runner:1.6.2")'+
              '\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")',1)
          p.write_text(s,encoding="utf-8")
          print("PR192_DISPOSABLE_EMULATOR_ONLY_ABI_AND_JUNIT_DEPENDENCIES")
          PY
          mkdir -p app/src/androidTest/java/com/wilito/weexautotrader
          cat > app/src/androidTest/java/com/wilito/weexautotrader/Pr192OfflineArtTest.kt <<'KOTLIN'
          package com.wilito.weexautotrader

          import android.content.Context
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class Pr192OfflineArtTest {
              private val context:Context
                  get()=InstrumentationRegistry.getInstrumentation().targetContext

              @Test fun criticalClassesLoadWithoutStartingLiveTrading() {
                  val classes=listOf(
                      "com.wilito.weexautotrader.TraderService",
                      "com.wilito.weexautotrader.RealCombinedContinuousNetProfitCoordinator",
                      "com.wilito.weexautotrader.NeonTransportFailureDiagnostic",
                      "com.wilito.weexautotrader.ConnectionRouteReadOnlyPolicy",
                      "com.wilito.weexautotrader.RealAppliedLearningCertifiedClosePipeline",
                      "com.wilito.weexautotrader.RealAppliedLearningLedgerCoordinator",
                      "com.wilito.weexautotrader.RealVerifiedLearningProgressPolicy",
                      "com.wilito.weexautotrader.RealProfitStopGateChartStatus",
                      "com.wilito.weexautotrader.CausalPricePathForecastStudy",
                      "com.wilito.weexautotrader.RealContinuousImprovementContinuityPolicy",
                      "com.wilito.weexautotrader.OnlineShadowMaturationPolicy",
                      "com.wilito.weexautotrader.RealPendingHistoricalMakerReadOnlyWorker",
                      "com.wilito.weexautotrader.RealPendingHistoricalMakerRoundTripQuantityPolicy",
                      "com.wilito.weexautotrader.RealLegacyMakerSignedOpeningReadOnlyCollector",
                      "com.wilito.weexautotrader.RealHistoricalOrderFillWindowPolicy",
                      "com.wilito.weexautotrader.RealBotSignedCloseReadOnlyCollector",
                      "com.wilito.weexautotrader.RealDailyLedgerBackgroundSingleFlight"
                  )
                  for(name in classes) assertTrue(name,Class.forName(name)!=null)
              }

              @Test fun writeUpgradeSentinel() {
                  assertTrue(context.getSharedPreferences(
                      "pr192_disposable_art",Context.MODE_PRIVATE
                  ).edit().putString("check","PR192_KEEP_DATA").commit())
              }

              @Test fun verifyUpgradeSentinel() {
                  assertEquals("PR192_KEEP_DATA",context.getSharedPreferences(
                      "pr192_disposable_art",Context.MODE_PRIVATE
                  ).getString("check",null))
              }
          }
          KOTLIN
          if ! gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest > /tmp/pr192-art-gradle.log 2>&1; then
            echo "::error::PR192_OFFLINE_DEX_BUILD_FAILED"
            grep -E '^e: |^error: |FAILURE:|Execution failed for' /tmp/pr192-art-gradle.log | tail -70 || true
            tail -25 /tmp/pr192-art-gradle.log || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo PR192_DISPOSABLE_DEBUG_DEX_BUILD_PASS_NO_RELEASE_NO_OTA
      - name: Enable KVM for isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build offline emulator test script
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pr192-art-offline-runner.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          fail() {
            local rc="$?" line="$1"
            trap - ERR
            echo "::error::PR192_OFFLINE_ART_FAILED_LINE=$line rc=$rc"
            for file in /tmp/pr192-first-launch.log /tmp/pr192-relaunch.log /tmp/pr192-dex.log /tmp/pr192-data-write.log /tmp/pr192-data-read.log; do
              if [ -f "$file" ]; then echo "ART_DIAG_FILE=$file"; tail -28 "$file" || true; fi
            done
            adb logcat -d -b crash | tail -100 || true
            exit "$rc"
          }
          trap 'fail "$LINENO"' ERR
          cd "$GITHUB_WORKSPACE/source"
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global airplane_mode_on 1
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb install -r "$APP"
          adb install -r "$TEST"
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr192-first-launch.log
          grep -Fq 'Status: ok' /tmp/pr192-first-launch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr192-crashes; then
            echo "::error::PR192_VERIFYERROR_OR_STARTUP_CRASH"; exit 1
          fi
          for spec in criticalClassesLoadWithoutStartingLiveTrading writeUpgradeSentinel; do
            timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class "com.wilito.weexautotrader.Pr192OfflineArtTest#$spec" com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > "/tmp/pr192-$spec.log"
            grep -Fq 'OK (1 test)' "/tmp/pr192-$spec.log" || { tail -55 "/tmp/pr192-$spec.log"; exit 1; }
          done
          adb install -r "$APP"
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr192OfflineArtTest#verifyUpgradeSentinel com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr192-data-read.log
          grep -Fq 'OK (1 test)' /tmp/pr192-data-read.log
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr192-relaunch.log
          grep -Fq 'Status: ok' /tmp/pr192-relaunch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr192-crashes; then
            echo "::error::PR192_POST_REINSTALL_VERIFYERROR"; exit 1
          fi
          echo PR192_ANDROID35_ART_DEX_OFFLINE_REINSTALL_DATA_PASS_NO_ORDERS_NO_OTA
          RUNNER
          bash -n /tmp/pr192-art-offline-runner.sh
          chmod 700 /tmp/pr192-art-offline-runner.sh
      - name: Verify ART startup, class-load and in-place upgrade with data retained
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash /tmp/pr192-art-offline-runner.sh
