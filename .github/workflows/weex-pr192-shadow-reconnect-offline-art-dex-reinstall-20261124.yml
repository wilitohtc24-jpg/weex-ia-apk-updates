# Immutable PR192 Android ART/DEX smoke, ephemeral debug key; NO signing release, WEEX, Neon calls, or OTA.
name: WEEX PR195 original opening signed window ART DEX reinstall NO OTA
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr192-shadow-reconnect-offline-art-dex-reinstall-20261124.yml
permissions:
  contents: read
jobs:
  art-dex-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      SOURCE_SHA: 105df5cfbe79875eb13acef4bd9134f917a8c7ce
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      WEEX_AUDIT_RUN_ANDROID_JUNIT: "1"
