name: WEEX PR202 exact private build evidence NO APK
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr202-private-qa-binding-no-apk-20261124.yml
permissions:
  contents: read
jobs:
  private-qa-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 3777bf41dbdc67935fed9f95b29c4408d1240883
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Validate exact source and read-only QA evidence
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3777bf41dbdc67935fed9f95b29c4408d1240883"
          python3 ci/test_private_candidate_qa_evidence_v1.py
          python3 ci/verify_private_candidate_qa_evidence_v1.py --evidence ci/private_candidate_pr201_qa_evidence.json --expected-source 365d3847f9d23410ab16b189b1632a4ea1c9a049
