name: WEEX PR205 owner-authorized opt-in diagnostic beta (NOT stable OTA)
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr205-opt-in-diagnostic-beta-20261125.yml
permissions:
  contents: write
jobs:
  publish-opt-in-beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
    steps:
      - name: Download official prior OTA APK and exact signed CircleCI PR205 APK (no publication)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weex-pr205-signed-upgrade
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.error,urllib.parse
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token
          oldbase="https://github.com/wilitohtc24-jpg/weex-ia-apk-updates/releases/download/v30379864/"
          oldsha=urllib.request.urlopen(urllib.request.Request(oldbase+"apk-sha256.txt",headers={"User-Agent":"weex-signed-android-upgrade"}),timeout=30).read().decode().split()[0].lower()
          assert oldsha=="283754aa6e840234d9c9e87ed09deaaa7ee4e3512ba52bd34a309afd20556769"
          with urllib.request.urlopen(urllib.request.Request(oldbase+"WEEX-IA-Trader-release.apk",headers={"User-Agent":"weex-signed-android-upgrade"}),timeout=120) as response:
              with open("/tmp/weex-pr205-signed-upgrade/old.apk","wb") as file:
                  h=hashlib.sha256()
                  while True:
                      data=response.read(1024*1024)
                      if not data:break
                      h.update(data);file.write(data)
          assert h.hexdigest()==oldsha, "Prior OTA hash mismatch"
          assert os.path.getsize("/tmp/weex-pr205-signed-upgrade/old.apk")==63560151
          print("PR205_PREVIOUS_OFFICIAL_OTA_SHA256_MATCH")

          endpoint="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/53096/artifacts"
          request=urllib.request.Request(endpoint,headers={"Circle-Token":token,"Accept":"application/json"})
          with urllib.request.urlopen(request,timeout=25) as response:
              assets=json.load(response)["items"]
          bypath={a.get("path"):a for a in assets}
          prefix="private-pr205-circleci-candidate/"
          assert prefix+"WEEX-IA-Trader-release.apk" in bypath
          assert prefix+"apk-sha256.txt" in bypath
          assert prefix+"candidate-provenance.txt" in bypath
          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  new=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if new is not None:
                      for d in (new.headers,new.unredirected_hdrs):
                          for key in list(d):
                              if key.lower()=="circle-token":del d[key]
                  return new
          opener=urllib.request.build_opener(NoAuthRedirect())
          def get_asset(name):
              url=bypath[prefix+name]["url"]
              parsed=urllib.parse.urlparse(url)
              host=(parsed.hostname or "").lower()
              assert parsed.scheme=="https"
              official=host=="circleci.com" or host.endswith(".circleci.com") or host=="circle-artifacts.com" or host.endswith(".circle-artifacts.com")
              assert official or host.endswith(".amazonaws.com") or host.endswith(".cloudfront.net") or host=="storage.googleapis.com"
              headers={"User-Agent":"weex-signed-production-test"}
              if official:headers["Circle-Token"]=token
              return opener.open(urllib.request.Request(url,headers=headers),timeout=120)
          with get_asset("candidate-provenance.txt") as response:
              provenance=dict(line.split("=",1) for line in response.read(8192).decode().splitlines() if "=" in line)
          assert provenance["source"]=="47a46990f98e56934f07d3ca31d1b4a347cc8bf3"
          assert provenance["green_source"]=="c94e73adc52bd8559fb687f57e34808f410490f5"
          assert provenance["versionCode"]=="30536366"
          assert provenance["private_only"]=="true" and provenance["ota_publication"]=="false"
          with get_asset("apk-sha256.txt") as response:
              expected=response.read(200).decode().split()[0].lower()
          assert expected=="321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718"
          with get_asset("WEEX-IA-Trader-release.apk") as response:
              h=hashlib.sha256()
              with open("/tmp/weex-pr205-signed-upgrade/new.apk","wb") as file:
                  while True:
                      data=response.read(1024*1024)
                      if not data:break
                      h.update(data);file.write(data)
          assert h.hexdigest()==expected,"Signed candidate bytes changed"
          assert os.path.getsize("/tmp/weex-pr205-signed-upgrade/new.apk")==63666705
          print("PR205_EXACT_SIGNED_APK_SHA256_VERIFIED_NO_PUBLIC_UPLOAD")
          PY
      - name: Check exact independent audits and publish only an opt-in prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=wilitohtc24-jpg/weex-ia-apk-updates
          tag=beta-v30536366
          sha=321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718
          size=63666705
          signer=5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6
          for run in 45515651509 45516051110; do
            gh api "repos/$repo/actions/runs/$run" --jq '.conclusion' | grep -Fx success
          done
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx v30379864
          if gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing beta"; exit 1
          fi
          apk=/tmp/weex-pr205-signed-upgrade/new.apk
          test "$(stat -c%s "$apk")" = "$size"
          echo "$sha  $apk" | sha256sum -c -
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk" | grep -F "$signer"
          mkdir -p /tmp/pr205-public-beta
          cp "$apk" /tmp/pr205-public-beta/WEEX-IA-Trader-release.apk
          printf '%s  WEEX-IA-Trader-release.apk\n' "$sha" > /tmp/pr205-public-beta/apk-sha256.txt
          cat > /tmp/pr205-beta-notes.md <<'NOTES'
          **BETA PÚBLICA DE DIAGNÓSTICO — INSTALACIÓN VOLUNTARIA. NO OTA ESTABLE.**
          
          El propietario solicitó expresamente que todos puedan probar esta APK.
          Es la misma APK privada firmada en CircleCI, sin recompilar ni modificar.
          La firma y actualización en emulador Android pasaron; NO se ha certificado
          el funcionamiento en el teléfono del propietario ni la cobertura funcional completa.
          Probar exclusivamente en SIM y con REAL desactivado; no instalar mientras
          existan posiciones reales abiertas. Cierre/reentrada, protección de ganancias,
          aprendizaje aplicado, predicciones y conectividad todavía requieren validación.
          No garantiza rentabilidad ni protección de pérdidas.
          
          Versión: 30536366
          SHA-256: 321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718
          Tamaño: 63666705 bytes.
          Auditoría binaria: https://github.com/wilitohtc24-jpg/weex-ia-apk-updates/actions/runs/45515651509
          Actualización firmada: https://github.com/wilitohtc24-jpg/weex-ia-apk-updates/actions/runs/45516051110
          La OTA estable v30379864 permanece sin cambios. No se promueve automáticamente esta beta.
          NOTES
          gh release create "$tag" /tmp/pr205-public-beta/WEEX-IA-Trader-release.apk /tmp/pr205-public-beta/apk-sha256.txt --repo "$repo" --target main --draft --prerelease --latest=false --title "WEEX IA Trader 30536366 — BETA diagnóstico voluntaria" --notes-file /tmp/pr205-beta-notes.md
          gh api "repos/$repo/releases/tags/$tag" > /tmp/pr205-draft.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pr205-draft.json'))
          assert r['draft'] and r['prerelease']
          a=[a for a in r['assets'] if a['name']=='WEEX-IA-Trader-release.apk']
          assert len(a)==1 and a[0]['state']=='uploaded'
          assert a[0]['size']==63666705
          assert a[0]['digest']=='sha256:321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718'
          assert 'WEEX_OTA_RELEASE_APPROVED_V1' not in r['body']
          PY
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx v30379864
          gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
          gh api "repos/$repo/releases/tags/$tag" > /tmp/pr205-public-beta.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pr205-public-beta.json'))
          assert not r['draft'] and r['prerelease'] and r['published_at']
          a=[a for a in r['assets'] if a['name']=='WEEX-IA-Trader-release.apk']
          assert len(a)==1 and a[0]['digest']=='sha256:321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718' and a[0]['size']==63666705
          print('PR205_OPT_IN_PUBLIC_BETA_VERIFIED_NOT_STABLE_OTA')
          PY
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx v30379864
