name: WEEX PR205 owner-authorized opt-in diagnostic beta (NOT stable OTA)
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr205-opt-in-diagnostic-beta-20261125.yml
permissions:
  contents: write
jobs:
  publish-opt-in-beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify existing exact beta draft by ID and promote prerelease only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=wilitohtc24-jpg/weex-ia-apk-updates
          tag=beta-v30536366
          id=457496553
          for run in 45515651509 45516051110; do
            gh api "repos/$repo/actions/runs/$run" --jq '.conclusion' | grep -Fx success
          done
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx v30379864
          gh api "repos/$repo/releases/$id" > /tmp/pr205-beta-draft.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pr205-beta-draft.json'))
          assert r['id']==457496553 and r['draft'] and r['prerelease'] and not r['published_at']
          assert r['tag_name'] in ('beta-v30536366','untagged-3776220dc8e82a17687c')
          a=[a for a in r['assets'] if a['name']=='WEEX-IA-Trader-release.apk']
          assert len(a)==1 and a[0]['state']=='uploaded' and a[0]['size']==63666705
          assert a[0]['digest']=='sha256:321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718'
          assert 'WEEX_OTA_RELEASE_APPROVED_V1' not in r['body']
          assert 'exclusivamente en SIM' in r['body']
          print('EXACT_DRAFT_VERIFIED_BY_ID')
          PY
          gh api --method PATCH "repos/$repo/releases/$id" -f tag_name="$tag" -F draft=false -F prerelease=true -f make_latest=false > /tmp/pr205-public-beta.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pr205-public-beta.json'))
          assert r['id']==457496553 and r['tag_name']=='beta-v30536366'
          assert not r['draft'] and r['prerelease'] and r['published_at']
          a=[a for a in r['assets'] if a['name']=='WEEX-IA-Trader-release.apk']
          assert len(a)==1 and a[0]['state']=='uploaded' and a[0]['size']==63666705 and a[0]['digest']=='sha256:321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718'
          print('PR205_OPT_IN_PUBLIC_BETA_VERIFIED_NOT_STABLE_OTA')
          PY
          gh api "repos/$repo/releases/latest" --jq '.tag_name' | grep -Fx v30379864
