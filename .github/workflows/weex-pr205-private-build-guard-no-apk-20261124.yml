name: WEEX PR205 private build guard NO APK
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr205-private-build-guard-no-apk-20261124.yml
permissions:
  contents: read
jobs:
  private-build-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 965611c21b4f96564524a508592cc21138c3cb9f
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify private build guard and no-op without authorization
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "965611c21b4f96564524a508592cc21138c3cb9f"
          bash -n ci/build_private_pr205_circleci_once.sh
          python3 ci/verify_manual_build_only.py
          python3 ci/verify_owner_manual_build_contract_v1.py
          python3 ci/test_manual_build_only_final_tail_v1.py
          python3 ci/verify_private_candidate_qa_evidence_v1.py --evidence ci/private_candidate_pr204_qa_evidence.json --expected-source c94e73adc52bd8559fb687f57e34808f410490f5
          test ! -e ci/requests/pr205-circleci-one-private.txt
          bash ci/build_private_pr205_circleci_once.sh | tee /tmp/pr205-noop.log
          grep -Fxq PR205_PRIVATE_CANDIDATE_NOT_AUTHORIZED_NO_APK /tmp/pr205-noop.log
          test ! -e private-pr205-circleci-candidate
          test ! -e app/weex-ia-signing.jks
          echo PR205_PRIVATE_BUILD_GUARD_PASS_NO_APK_NO_OTA
