name: WEEX PR238 signed production APK in-place upgrade ART (NO OTA)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Independently audited SHA256
        required: true
        type: string
      candidate_bytes:
        description: Independently audited size
        required: true
        type: string
      candidate_version:
        description: Independently audited versionCode
        required: true
        type: string
permissions:
  contents: read
jobs:
  actual-signed-apk-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        baseline: ["30536366", "30619636"]
    env:
      BASELINE: ${{ matrix.baseline }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_BYTES: ${{ inputs.candidate_bytes }}
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
    steps:
      - name: Download official prior OTA APK and exact signed CircleCI PR238 APK (no publication)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/weex-pr238-signed-upgrade
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.error,urllib.parse
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token
          expected=os.environ["CANDIDATE_SHA"]
          version=os.environ["CANDIDATE_VERSION"]
          size=os.environ["CANDIDATE_BYTES"]
          assert re.fullmatch(r"[0-9a-f]{64}",expected)
          assert re.fullmatch(r"[0-9]{1,10}",version) and 30619636<int(version)<=2100000000
          assert re.fullmatch(r"[0-9]{1,10}",size) and 10*1024*1024<int(size)<=200*1024*1024
          oldbase="https://github.com/wilitohtc24-jpg/weex-ia-apk-updates/releases/download/v30536366/"
          oldsha=urllib.request.urlopen(urllib.request.Request(oldbase+"apk-sha256.txt",headers={"User-Agent":"weex-signed-android-upgrade"}),timeout=30).read().decode().split()[0].lower()
          assert oldsha=="321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718"
          with urllib.request.urlopen(urllib.request.Request(oldbase+"WEEX-IA-Trader-release.apk",headers={"User-Agent":"weex-signed-android-upgrade"}),timeout=120) as response:
              with open("/tmp/weex-pr238-signed-upgrade/old.apk","wb") as file:
                  h=hashlib.sha256()
                  while True:
                      data=response.read(1024*1024)
                      if not data:break
                      h.update(data);file.write(data)
          assert h.hexdigest()==oldsha, "Prior OTA hash mismatch"
          assert os.path.getsize("/tmp/weex-pr238-signed-upgrade/old.apk")==63666705
          print("PR238_PREVIOUS_OFFICIAL_OTA_SHA256_MATCH")

          headers={"Circle-Token":token,"Accept":"application/json"}
          with urllib.request.urlopen(urllib.request.Request("https://circleci.com/api/v2/workflow/d1620d6f-1344-43a8-9a31-d24e04fca39a/job",headers=headers),timeout=25) as response:
              jobs=json.load(response)["items"]
          matches=[j for j in jobs if j.get("id")=="617e4223-7c56-437f-8e8a-e2d7ed792b1e" and j.get("name")=="pr238_circleci_private_candidate" and j.get("status")=="success" and j.get("project_slug")=="gh/wilitohtc24-jpg/weex-auto-trader-android"]
          assert len(matches)==1
          number=matches[0]["job_number"]
          assert type(number) is int and number>0
          endpoint="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/"+str(number)+"/artifacts"
          request=urllib.request.Request(endpoint,headers={"Circle-Token":token,"Accept":"application/json"})
          with urllib.request.urlopen(request,timeout=25) as response:
              assets=json.load(response)["items"]
          bypath={a.get("path"):a for a in assets}
          assert len(bypath)==len(assets)
          prefix="private-pr238-circleci-candidate/"
          assert prefix+"WEEX-IA-Trader-release.apk" in bypath
          assert prefix+"apk-sha256.txt" in bypath
          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  new=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if new is not None:
                      for d in (new.headers,new.unredirected_hdrs):
                          for key in list(d):
                              if key.lower()=="circle-token":del d[key]
                  return new
          opener=urllib.request.build_opener(NoAuthRedirect())
          def get_asset(name):
              url=bypath[prefix+name]["url"]
              parsed=urllib.parse.urlparse(url)
              host=(parsed.hostname or "").lower()
              assert parsed.scheme=="https" and host
              official=host=="circleci.com" or host.endswith(".circleci.com") or host=="circle-artifacts.com" or host.endswith(".circle-artifacts.com")
              assert official or host.endswith(".amazonaws.com") or host.endswith(".cloudfront.net") or host=="storage.googleapis.com"
              headers={"User-Agent":"weex-signed-production-test"}
              if official:headers["Circle-Token"]=token
              return opener.open(urllib.request.Request(url,headers=headers),timeout=120)
          with get_asset("apk-sha256.txt") as response:
              supplied=response.read(200).decode().split()[0].lower()
          assert supplied==expected
          with get_asset("WEEX-IA-Trader-release.apk") as response:
              h=hashlib.sha256()
              with open("/tmp/weex-pr238-signed-upgrade/new.apk","wb") as file:
                  while True:
                      data=response.read(1024*1024)
                      if not data:break
                      h.update(data);file.write(data)
          assert h.hexdigest()==expected,"Signed candidate bytes changed"
          assert os.path.getsize("/tmp/weex-pr238-signed-upgrade/new.apk")==int(size)
          print("PR238_EXACT_SIGNED_APK_SHA256_VERIFIED_NO_PUBLIC_UPLOAD")
          if os.environ["BASELINE"]=="30619636":
              endpoint="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/53101/artifacts"
              with urllib.request.urlopen(urllib.request.Request(endpoint,headers={"Circle-Token":token,"Accept":"application/json"}),timeout=25) as response:
                  assets=json.load(response)["items"]
              bypath={a.get("path"):a for a in assets}
              assert len(bypath)==len(assets)
              prefix="private-pr220-circleci-candidate/"
              with get_asset("WEEX-IA-Trader-release.apk") as response, open("/tmp/weex-pr238-signed-upgrade/old.apk","wb") as file:
                  h=hashlib.sha256()
                  count=0
                  while True:
                      data=response.read(1024*1024)
                      if not data:break
                      count+=len(data)
                      assert count<=63732241
                      h.update(data);file.write(data)
              assert count==63732241 and h.hexdigest()=="72ccc04723e8a542b620272b814a80cf913a425daa108bb50e54b8194704dc0f"
              print("PR238_PRIOR_PRIVATE_SHA256_VERIFIED")
          else:
              assert os.environ["BASELINE"]=="30536366"
          PY
      - name: Verify original certificate of both signed APKs before install
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$signer"
          for apk in old new; do
            "$signer" verify --verbose --print-certs "/tmp/weex-pr238-signed-upgrade/$apk.apk" > "/tmp/pr238-$apk-cert.txt"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          canonical="5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"
          for apk in ("old","new"):
              text=Path("/tmp/pr238-"+apk+"-cert.txt").read_text()
              values=re.findall(r"(?mi)^\s*(?:Signer\s+#\d+|Signer\s+\([^\r\n)]*\)|V\d+(?:\.\d+)?\s+Signer:)\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",text)
              assert {v.replace(":","").lower() for v in values}=={canonical}
          PY
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create signed APK offline upgrade runner
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr238-signed-upgrade-test.sh <<'ART_TEST'
          #!/usr/bin/env bash
          set -euo pipefail
          pkg="com.wilito.weexautotrader"
          # No account, network or REAL trades in this disposable emulator.
          adb shell svc wifi disable
          adb shell svc data disable
          adb install /tmp/weex-pr238-signed-upgrade/old.apk | grep -q Success
          oldmeta="$(adb shell dumpsys package "$pkg")"
          printf '%s\n' "$oldmeta" | grep -Eq "versionCode=${BASELINE}([[:space:]]|$)"
          original_installed="$(printf '%s\n' "$oldmeta" | grep 'firstInstallTime=' | head -1 | tr -d '\r')"
          test -n "$original_installed"
          echo PR238_PRIOR_SIGNED_RELEASE_INSTALLED
          # Do not clear/uninstall or touch app data: this is an in-place update.
          adb install -r /tmp/weex-pr238-signed-upgrade/new.apk | grep -q Success
          newmeta="$(adb shell dumpsys package "$pkg")"
          printf '%s\n' "$newmeta" | grep -Eq "versionCode=${CANDIDATE_VERSION}([[:space:]]|$)"
          new_installed="$(printf '%s\n' "$newmeta" | grep 'firstInstallTime=' | head -1 | tr -d '\r')"
          test "$new_installed" = "$original_installed"
          echo PR238_SIGNED_RELEASE_UPDATED_IN_PLACE_SAME_CERT_AND_DATA_DIRECTORY
          adb logcat -c
          adb shell am start -W -n "$pkg/.LauncherActivity" > /tmp/pr238-release-launch.txt
          grep -q 'Status: ok' /tmp/pr238-release-launch.txt
          resumed=0
          for attempt in $(seq 1 35); do
              focus="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|mTopResumedActivity' || true)"
              if printf '%s' "$focus" | grep -q "$pkg/.MainActivity"; then
                  resumed=1;break
              fi
              sleep 1
          done
          test "$resumed" = 1
          test -n "$(adb shell pidof "$pkg" | tr -d '\r')"
          echo PR238_SIGNED_RELEASE_MAINACTIVITY_RESUMED_AFTER_REAL_UPGRADE
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|java.lang.VerifyError' > /tmp/pr238-release-crashes.txt; then
              echo "::error::PR238_SIGNED_APK_RUNTIME_CRASH"
              head -15 /tmp/pr238-release-crashes.txt
              exit 1
          fi
          echo PR238_SIGNED_RELEASE_INPLACE_UPGRADE_ART_PASS_NO_REAL_ORDERS_NO_OTA
          ART_TEST
          bash -n /tmp/pr238-signed-upgrade-test.sh
          chmod 700 /tmp/pr238-signed-upgrade-test.sh
      - name: Run actual signed production in-place update and MainActivity ART
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash /tmp/pr238-signed-upgrade-test.sh
