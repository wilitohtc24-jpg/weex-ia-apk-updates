              @Test fun signedFillReplayRollsBackConflictingBatch() {
                  val original=RealTradeFill(
                      tradeId="987654321000001",orderId="987654321000011",
                      executedAt=1_800_000_000_000L,symbol="BNBUSDT",
                      side="BUY",positionSide="SHORT",price=600.0,
                      quantity=0.25,commission=0.1,realizedPnl=2.5)
                  val newRow=original.copy(tradeId="987654321000002")
                  val db=TradeDatabase(context)
                  try {
                      assertEquals(1,db.recordRealFills(listOf(original)))
                      assertEquals(0,db.recordRealFills(listOf(original.copy())))
                      val failure=runCatching {
                          db.recordRealFills(listOf(newRow,original.copy(commission=0.11)))
                      }.exceptionOrNull()
                      assertEquals("REAL_FILLS_CONFLICTING_REPLAY",failure?.message)
                      db.readableDatabase.rawQuery(
                          "SELECT trade_id,commission,realized_pnl FROM real_fills WHERE trade_id IN (?,?)",
                          arrayOf(original.tradeId,newRow.tradeId)
                      ).use { c ->
                          assertTrue(c.moveToFirst())
                          assertEquals(original.tradeId,c.getString(0))
                          assertEquals(0.1,c.getDouble(1),1e-9)
                          assertEquals(2.5,c.getDouble(2),1e-9)
                          assertFalse(c.moveToNext())
                      }
                      assertEquals(1,db.recordRealFills(listOf(newRow)))
                      assertEquals(0,db.recordRealFills(listOf(newRow)))
                  } finally { db.close() }
              }

              private val ledgerDay=1_800_000_000_000L
              private val ledgerA="a".repeat(64)
              private val ledgerB="b".repeat(64)
              private fun ledgerFill()=RealTradeFill(
                  tradeId="987654321900001",orderId="987654321900011",
                  executedAt=ledgerDay+1_000L,symbol="BNBUSDT",
                  side="BUY",positionSide="SHORT",price=600.0,
                  quantity=0.25,commission=0.1,realizedPnl=2.5)
              private fun ledgerSeed(account:String,fill:RealTradeFill)=
                  RealAccountDailyLedgerObservation(account,ledgerDay,
                      ledgerDay+10_000L,ledgerDay+20_000L,listOf(fill),-0.2)
              @Test fun scopedLedgerRejectsGapsAndPreservesTwoAccounts() {
                  val first=ledgerFill()
                  val seed=ledgerSeed(ledgerA,first)
                  val foreign=ledgerSeed(ledgerB,first.copy(realizedPnl=-7.0))
                  val later=seed.copy(readStartedAt=ledgerDay+30_000L,
                      readCompletedAt=ledgerDay+40_000L,
                      fills=listOf(first.copy(tradeId="987654321900002",executedAt=ledgerDay+25_000L)))
                  RealAccountDailyLedgerStore(context).use { store ->
                      assertNull(store.recordWindow(later,ledgerDay+2_000L))
                      assertTrue(store.recordCompleteDay(seed))
                      assertTrue(store.recordCompleteDay(foreign))
                      assertNull(store.recordWindow(later,ledgerDay+10_001L))
                      val saved=store.recordWindow(later,ledgerDay+2_000L)!!
                      assertEquals(2,saved.fills.size)
                      assertEquals(4.6,saved.observedAccountNet,1e-9)
                      val bad=later.copy(readStartedAt=ledgerDay+50_000L,
                          readCompletedAt=ledgerDay+60_000L,
                          fills=listOf(first.copy(commission=0.2))+later.fills)
                      assertNull(store.recordWindow(bad,ledgerDay))
                  }
              }
              @Test fun scopedLedgerSurvivesReinstallWithoutCrossAccountAttribution() {
                  RealAccountDailyLedgerStore(context).use { store ->
                      store.readableDatabase.rawQuery(
                          "SELECT account_proof,COUNT(*),SUM(realized_pnl) FROM account_fills WHERE day_start=? GROUP BY account_proof ORDER BY account_proof",
                          arrayOf(ledgerDay.toString())
                      ).use { c ->
                          assertTrue(c.moveToFirst())
                          assertEquals(ledgerA,c.getString(0))
                          assertEquals(2,c.getInt(1))
                          assertEquals(5.0,c.getDouble(2),1e-9)
                          assertTrue(c.moveToNext())
                          assertEquals(ledgerB,c.getString(0))
                          assertEquals(1,c.getInt(1))
                          assertEquals(-7.0,c.getDouble(2),1e-9)
                          assertFalse(c.moveToNext())
                      }
                  }
              }

              private fun fakeDestination()=WithdrawalDestinationDraft(
                  "TRON","DISPOSABLE-QA-NOT-A-REAL-WALLET",""
              )

              @Test fun writeEncryptedWithdrawalDraft()=runBlocking {
                  val draft=fakeDestination()
                  WithdrawalDestinationDraftStore.save(context,draft)
                  assertEquals(draft,WithdrawalDestinationDraftStore.load(context))
                  val file=File(context.noBackupFilesDir,"a27_destination_draft_v1")
                  assertTrue(file.isFile)
                  val encrypted=file.readBytes()
                  assertTrue(encrypted.size>=29)
                  assertFalse(String(encrypted,Charsets.ISO_8859_1).contains(draft.address))
                  assertFalse(String(encrypted,Charsets.ISO_8859_1).contains("A27_DESTINATION_DRAFT_1"))
                  // Fresh GCM nonce on repeated explicit save.
                  WithdrawalDestinationDraftStore.save(context,draft)
                  assertFalse(encrypted.contentEquals(file.readBytes()))
              }

              @Test fun verifyEncryptedWithdrawalDraftAfterReinstall()=runBlocking {
                  assertEquals(fakeDestination(),WithdrawalDestinationDraftStore.load(context))
                  WithdrawalDestinationDraftStore.clear(context)
                  assertNull(WithdrawalDestinationDraftStore.load(context))
              }

              private fun fakePending()=WithdrawalPendingRecord(
                  WithdrawalExactHistoryKey("a".repeat(64),"openapi_Disposable00000001",
                      fakeDestination(),1_800_000_000_000L),
                  java.math.BigDecimal("20"),WithdrawalPendingPhase.PREPARED
              )

              @Test fun writeAndMarkEncryptedPendingWithdrawal()=runBlocking {
                  val record=fakePending()
                  assertNull(WithdrawalPendingRecordStore.load(context))
                  assertTrue(WithdrawalPendingRecordStore.prepare(context,record))
                  assertEquals(record.encode(),WithdrawalPendingRecordStore.load(context)?.encode())
                  assertFalse(WithdrawalPendingRecordStore.prepare(context,record))
                  val file=File(context.noBackupFilesDir,"a27_pending_withdrawal_v1")
                  val prepared=file.readBytes()
                  assertFalse(String(prepared,Charsets.ISO_8859_1).contains(record.key.destination.address))
                  assertFalse(String(prepared,Charsets.ISO_8859_1).contains(record.key.clientWithdrawId))
                  assertTrue(WithdrawalPendingRecordStore.markMayHaveBeenSubmitted(context,record))
                  assertFalse(prepared.contentEquals(file.readBytes()))
                  assertFalse(WithdrawalPendingRecordStore.markMayHaveBeenSubmitted(context,record))
              }

              @Test fun verifyPendingWithdrawalAfterReinstall()=runBlocking {
                  val expected=fakePending().copy(phase=WithdrawalPendingPhase.MAY_HAVE_BEEN_SUBMITTED)
                  assertEquals(expected.encode(),WithdrawalPendingRecordStore.load(context)?.encode())
                  assertFalse(WithdrawalPendingRecordStore.prepare(context,fakePending()))
                  assertFalse(WithdrawalPendingRecordStore.markMayHaveBeenSubmitted(context,fakePending()))
                  val file=File(context.noBackupFilesDir,"a27_pending_withdrawal_v1")
                  // Disposable emulator only: damage authenticated ciphertext.
                  val bytes=file.readBytes()
                  bytes[bytes.lastIndex]=(bytes.last().toInt() xor 1).toByte()
                  file.writeBytes(bytes)
                  assertTrue(runCatching{WithdrawalPendingRecordStore.load(context)}.isFailure)
                  assertTrue(runCatching{WithdrawalPendingRecordStore.prepare(context,fakePending())}.isFailure)
                  assertTrue(file.delete())
                  assertTrue(runCatching{WithdrawalPendingRecordStore.load(context)}.isFailure)
                  assertTrue(runCatching{WithdrawalPendingRecordStore.prepare(context,fakePending())}.isFailure)
              }

              @Test fun writeUpgradeSentinel() {
                  assertTrue(context.getSharedPreferences(
                      "pr192_disposable_art",Context.MODE_PRIVATE
                  ).edit().putString("check","PR192_KEEP_DATA").commit())
              }

              @Test fun verifyUpgradeSentinel() {
                  assertEquals("PR192_KEEP_DATA",context.getSharedPreferences(
                      "pr192_disposable_art",Context.MODE_PRIVATE
                  ).getString("check",null))
              }
          }
          KOTLIN
          if ! gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest > /tmp/pr192-art-gradle.log 2>&1; then
            echo "::error::PR192_OFFLINE_DEX_BUILD_FAILED"
            grep -Eo 'app/src/[A-Za-z0-9_./-]+\.kt:[0-9]+:[0-9]+|Execution failed for task .:app:[A-Za-z0-9_]+|BUILD FAILED|Could not resolve|Could not download|OutOfMemoryError|daemon disappeared' /tmp/pr192-art-gradle.log | sort -u | tail -50 || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo PR192_DISPOSABLE_DEBUG_DEX_BUILD_PASS_NO_RELEASE_NO_OTA
      - name: Enable KVM for isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build offline emulator test script
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pr192-art-offline-runner.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          fail() {
            local rc="$?" line="$1"
            trap - ERR
            echo "::error::PR192_OFFLINE_ART_FAILED_LINE=$line rc=$rc"
            for file in /tmp/pr192-first-launch.log /tmp/pr192-relaunch.log /tmp/pr192-dex.log /tmp/pr192-data-write.log /tmp/pr192-data-read.log; do
              if [ -f "$file" ]; then echo "ART_DIAG_FILE=$file"; tail -28 "$file" || true; fi
            done
            adb logcat -d -b crash | tail -100 || true
            exit "$rc"
          }
          trap 'fail "$LINENO"' ERR
          cd "$GITHUB_WORKSPACE/source"
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global airplane_mode_on 1
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb install -r "$APP"
          adb install -r "$TEST"
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr192-first-launch.log
          grep -Fq 'Status: ok' /tmp/pr192-first-launch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr192-crashes; then
            echo "::error::PR192_VERIFYERROR_OR_STARTUP_CRASH"; exit 1
          fi
          for spec in criticalClassesLoadWithoutStartingLiveTrading signedFillReplayRollsBackConflictingBatch scopedLedgerRejectsGapsAndPreservesTwoAccounts writeUpgradeSentinel writeEncryptedWithdrawalDraft writeAndMarkEncryptedPendingWithdrawal; do
            timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class "com.wilito.weexautotrader.Pr192OfflineArtTest#$spec" com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > "/tmp/pr192-$spec.log"
            grep -Fq 'OK (1 test)' "/tmp/pr192-$spec.log" || { tail -55 "/tmp/pr192-$spec.log"; exit 1; }
          done
          adb install -r "$APP"
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr192OfflineArtTest#verifyUpgradeSentinel com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr192-data-read.log
          grep -Fq 'OK (1 test)' /tmp/pr192-data-read.log
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr192OfflineArtTest#scopedLedgerSurvivesReinstallWithoutCrossAccountAttribution com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr272-account-ledger-read.log
          grep -Fq 'OK (1 test)' /tmp/pr272-account-ledger-read.log || { tail -55 /tmp/pr272-account-ledger-read.log; exit 1; }
          echo PR272_ACCOUNT_LEDGER_TWO_SCOPES_REINSTALL_PASS
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr192OfflineArtTest#verifyEncryptedWithdrawalDraftAfterReinstall com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr212-withdrawal-read.log
          grep -Fq 'OK (1 test)' /tmp/pr212-withdrawal-read.log || { tail -55 /tmp/pr212-withdrawal-read.log; exit 1; }
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr192OfflineArtTest#verifyPendingWithdrawalAfterReinstall com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr234-pending-read.log
          grep -Fq 'OK (1 test)' /tmp/pr234-pending-read.log || { tail -55 /tmp/pr234-pending-read.log; exit 1; }
          echo PR234_PENDING_JOURNAL_KEYSTORE_REINSTALL_CORRUPTION_AND_MISSING_FAIL_CLOSED
          echo PR234_DESTINATION_KEYSTORE_ENCRYPTED_REINSTALL_DELETE_PASS
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr192-relaunch.log
          grep -Fq 'Status: ok' /tmp/pr192-relaunch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr192-crashes; then
            echo "::error::PR192_POST_REINSTALL_VERIFYERROR"; exit 1
          fi
          echo PR272_ANDROID35_SQLITE_ART_DEX_OFFLINE_REINSTALL_DATA_PASS_NO_ORDERS_NO_OTA
          RUNNER
          bash -n /tmp/pr192-art-offline-runner.sh
          chmod 700 /tmp/pr192-art-offline-runner.sh
      - name: Verify ART startup, class-load and in-place upgrade with data retained
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash /tmp/pr192-art-offline-runner.sh
