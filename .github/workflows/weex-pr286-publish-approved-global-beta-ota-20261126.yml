# Explicit owner authorization 26-Nov-2026: show update inside APK for all users.
# Voluntary public test beta, not acceptance of REAL behavior. No trading or rebuild.
name: WEEX PR286 owner-authorized in-app beta OTA 30704940
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr286-publish-approved-global-beta-ota-20261126.yml
permissions:
  contents: write
concurrency:
  group: weex-pr286-opt-in-beta
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: wilitohtc24-jpg/weex-ia-apk-updates
      RELEASE_ID: "459958963"
      ASSET_ID: "797943559"
      VERSION: "30704940"
      SHA: fcf2fc880dfbb3fb2693830e285a84a1c7b9e2f77f11a286be4a8c9af1493de2
      BYTES: "63830545"
      SIGNER: 5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6
    steps:
      - name: Verify exact existing public beta and prior OTA before promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$GITHUB_REF" = "refs/heads/qa/weex-pr192-shadow-reconnect-20261124"
          test "$GITHUB_EVENT_NAME" = push
          gh api "repos/$REPO/releases/$RELEASE_ID" > /tmp/beta.json
          gh api "repos/$REPO/releases/latest" > /tmp/old.json
          for entry in "45902846558:aab858329774679b68e547dba088ebe139af93dd" "45904143636:5f33a394199779be16b3ed29a8684136c362a321" "45904628259:2316f2d1b5962e2c98eba344cdac8f1359e3d2bc" "45906024970:d697955963161716e980f6d6b9bfee165425fa5b"; do
            run="${entry%%:*}"; sha="${entry#*:}"
            gh api "repos/$REPO/actions/runs/$run" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["head_sha"]==sys.argv[1] and r["status"]=="completed" and r["conclusion"]=="success"' "$sha"
          done
          python3 - <<'PY'
          import json,os
          r=json.load(open("/tmp/beta.json"))
          old=json.load(open("/tmp/old.json"))
          assert old["tag_name"]=="v30536366" and old["draft"] is False and old["prerelease"] is False
          prior=[a for a in old["assets"] if a["name"]=="WEEX-IA-Trader-release.apk"]
          assert len(prior)==1 and prior[0]["digest"]=="sha256:321d21511bab048c36e473040691534d3bbc3e027e7b837765d0351ebee2b718"
          assert int(os.environ["VERSION"])>30629089
          assert r["id"]==int(os.environ["RELEASE_ID"]) and r["tag_name"]=="v"+os.environ["VERSION"]
          assert r["draft"] is False and r["prerelease"] is True and r["published_at"]
          assert "WEEX_PUBLIC_OPT_IN_TEST_BETA_V1" in r["body"] and os.environ["SHA"] in r["body"] and os.environ["SIGNER"] in r["body"]
          assert "610287e3bc69155fa6c2ac290902879689d7e3fd" in r["body"]
          a=[a for a in r["assets"] if a["name"]=="WEEX-IA-Trader-release.apk"]
          assert len(a)==1 and a[0]["id"]==int(os.environ["ASSET_ID"]) and a[0]["state"]=="uploaded"
          assert a[0]["size"]==int(os.environ["BYTES"]) and a[0]["digest"]=="sha256:"+os.environ["SHA"]
          print("PR286_OWNER_AUTHORIZED_OTA_BETA_EXACT_PRECHECK_PASS")
          PY
      - name: Apply explicit beta warning and approval metadata, then verify before promotion
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<EOF
          WEEX_OTA_RELEASE_APPROVED_V1
          WEEX_OTA_PUBLIC_TEST_BETA_V1
          WEEX_PR286_OWNER_AUTHORIZED_GLOBAL_BETA_20261126_V1

          WEEX IA Trader — BETA voluntaria de prueba para todos.
          El propietario autorizó ofrecer esta actualización dentro de la APK.
          Actualización voluntaria, no desinstales ni borres datos.
          IMPORTANTE: prueba primero en SIM, sin dinero real. No es una versión
          validada para operar en REAL; no garantiza rentabilidad.
          No instales durante una posición REAL activa. Comprueba las protecciones
          y el estado de posiciones en WEEX antes de actualizar.
          Firma original, auditoría independiente y dos actualizaciones Android offline aprobadas.
          Aún no se ha probado la retención de todos los datos en el teléfono del propietario
          ni completado la aceptación A1–A27, incluidos STOP automático y aprendizaje aplicado REAL.
          No se certifica la conservación de posiciones, licencias o aprendizaje en el dispositivo real.

          VersionCode: $VERSION
          APK SHA-256: $SHA
          Bytes: $BYTES
          Signer original SHA-256: $SIGNER
          Package: com.wilito.weexautotrader
          Fuente compilada: 610287e3bc69155fa6c2ac290902879689d7e3fd
          CircleCI job #53109
          Auditoría: https://github.com/$REPO/actions/runs/45902846558
          Actualización: https://github.com/$REPO/actions/runs/45904143636
          EOF
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="v$VERSION" -F draft=false -F prerelease=true -f make_latest=false -f name="WEEX IA Trader BETA de prueba - v$VERSION" -f body="$(cat /tmp/notes.md)" > /tmp/notes-result.json
          python3 - <<'PY'
          import json,os
          r=json.load(open("/tmp/notes-result.json"))
          assert r["id"]==int(os.environ["RELEASE_ID"]) and r["tag_name"]=="v"+os.environ["VERSION"] and r["draft"] is False and r["prerelease"] is True
          assert "WEEX_OTA_RELEASE_APPROVED_V1" in r["body"] and "WEEX_OTA_PUBLIC_TEST_BETA_V1" in r["body"] and "No es una versión" in r["body"]
          PY
      - name: Promote same signed asset to latest OTA and verify anonymous catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = v30536366
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="v$VERSION" -F draft=false -F prerelease=false -f make_latest=true > /tmp/promoted.json
          gh api "repos/$REPO/releases/latest" > /tmp/latest.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          r=json.load(open("/tmp/latest.json"))
          p=json.load(open("/tmp/promoted.json"))
          assert r["id"]==p["id"]==int(os.environ["RELEASE_ID"])
          assert r["tag_name"]=="v"+os.environ["VERSION"] and r["draft"] is False and r["prerelease"] is False and r["published_at"]
          assert "WEEX_OTA_RELEASE_APPROVED_V1" in r["body"] and "WEEX_OTA_PUBLIC_TEST_BETA_V1" in r["body"]
          assert os.environ["SHA"] in r["body"] and os.environ["SIGNER"] in r["body"]
          a=[a for a in r["assets"] if a["name"]=="WEEX-IA-Trader-release.apk"]
          expected="https://github.com/"+os.environ["REPO"]+"/releases/download/v"+os.environ["VERSION"]+"/WEEX-IA-Trader-release.apk"
          assert len(a)==1 and a[0]["id"]==int(os.environ["ASSET_ID"]) and a[0]["state"]=="uploaded"
          assert a[0]["size"]==int(os.environ["BYTES"]) and a[0]["digest"]=="sha256:"+os.environ["SHA"] and a[0]["browser_download_url"]==expected
          for attempt in range(4):
              try:
                  req=urllib.request.Request("https://api.github.com/repos/"+os.environ["REPO"]+"/releases/latest",headers={"User-Agent":"WEEX-OTA-verification","Accept":"application/vnd.github+json"})
                  with urllib.request.urlopen(req,timeout=25) as resp: public=json.load(resp)
                  assert public["id"]==r["id"] and public["tag_name"]==r["tag_name"] and public["draft"] is False and public["prerelease"] is False
                  with urllib.request.urlopen(urllib.request.Request(expected,method="HEAD",headers={"User-Agent":"WEEX-OTA-verification"}),timeout=25) as resp:
                      assert resp.status==200 and int(resp.headers["Content-Length"])==int(os.environ["BYTES"])
                  break
              except Exception:
                  if attempt==3:raise
                  time.sleep(5)
          print("PR286_GLOBAL_BETA_OTA_VISIBLE_IN_RELEASES_LATEST="+r["tag_name"])
          print("PR286_SAME_SIGNED_APK_PUBLIC_DOWNLOAD_VERIFIED="+expected)
          PY
  report-start:
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report OTA beta publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=weex/pr286/global-beta-ota -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  report-finish:
    if: ${{ always() }}
    needs: [promote, report-start]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report exact OTA result
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESULT: ${{ needs.promote.result }}
        run: |
          case "$QA_RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=weex/pr286/global-beta-ota -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
