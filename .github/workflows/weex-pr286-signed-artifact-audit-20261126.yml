name: WEEX PR286 signed CircleCI artifact hash and signer audit (NO OTA)
on:
  push:
    branches: [qa/weex-pr192-shadow-reconnect-20261124]
    paths:
      - .github/workflows/weex-pr286-signed-artifact-audit-20261126.yml
  workflow_dispatch:
concurrency:
  group: pr286-exact-private-audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CIRCLECI_READ_TOKEN: ${{ secrets.WEEX_CIRCLECI_ARTIFACT_READ_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require exact CircleCI job to finish successfully before artifact read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token, "Missing CircleCI read token"
          url="https://circleci.com/api/v2/workflow/347670a8-33af-4156-a347-9a2c1ecb960a/job"
          deadline=time.monotonic()+20*60
          while True:
              request=urllib.request.Request(url,headers={"Circle-Token":token,"Accept":"application/json"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  jobs=json.load(response)["items"]
              matches=[j for j in jobs if j.get("id")=="f41641b8-1da0-40ce-a8a3-8044ef27f251" and j.get("name")=="pr286_circleci_private_candidate" and j.get("project_slug")=="gh/wilitohtc24-jpg/weex-auto-trader-android"]
              assert len(matches)==1,"Exact CircleCI job not found"
              state=matches[0].get("status")
              if state=="success":
                  print("PR286_EXACT_CIRCLECI_JOB_SUCCESS")
                  break
              assert state in {"queued","running","on_hold","blocked","not_running","not_run","scheduled","pending"}, "CircleCI not successful; audit refused"
              print("PR286_WAITING_FOR_EXACT_CIRCLECI_JOB",state,flush=True)
              assert time.monotonic()<deadline,"CircleCI terminal success not observed within bounded monitor"
              time.sleep(45)
          PY
      - name: Verify private signed APK bytes, SHA256, certificate and version without publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.request,urllib.parse,urllib.error
          token=os.environ.get("CIRCLECI_READ_TOKEN","")
          assert token, "CircleCI read token absent"
          workflow="347670a8-33af-4156-a347-9a2c1ecb960a"
          exact_job="f41641b8-1da0-40ce-a8a3-8044ef27f251"
          headers={"Circle-Token":token,"Accept":"application/json"}
          with urllib.request.urlopen(urllib.request.Request("https://circleci.com/api/v2/workflow/"+workflow+"/job",headers=headers),timeout=25) as r:
              jobs=json.load(r)["items"]
          matches=[j for j in jobs if j.get("id")==exact_job and j.get("name")=="pr286_circleci_private_candidate" and j.get("status")=="success"]
          assert len(matches)==1, "Exact successful CircleCI job unavailable"
          job=matches[0]
          assert job.get("project_slug")=="gh/wilitohtc24-jpg/weex-auto-trader-android", "Project mismatch"
          number=job["job_number"]
          assert isinstance(number,int) and number>0
          print("PR286_EXACT_CIRCLECI_JOB_NUMBER="+str(number))
          api="https://circleci.com/api/v2/project/gh/wilitohtc24-jpg/weex-auto-trader-android/"+str(number)+"/artifacts"
          req=urllib.request.Request(api,headers={"Circle-Token":token,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as r:
              items=json.load(r).get("items",[])
          bypath={v.get("path"):v for v in items}
          assert len(bypath)==len(items), "Duplicate artifact paths"
          prefix="private-pr286-circleci-candidate/"
          required=["WEEX-IA-Trader-release.apk","apk-sha256.txt","signing-certificate.txt",
                    "release.json","candidate-provenance.txt"]
          for filename in required:
              assert prefix+filename in bypath, "Missing private candidate "+filename
          print("PR286_SIGNED_ARTIFACT_SET_PRESENT count="+str(len(items)))

          class ScrubAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  new=super().redirect_request(req,fp,code,msg,hdrs,newurl)
                  if new is not None:
                      for name in list(new.headers):
                          if name.lower()=="circle-token":del new.headers[name]
                      for name in list(new.unredirected_hdrs):
                          if name.lower()=="circle-token":del new.unredirected_hdrs[name]
                  return new
          opener=urllib.request.build_opener(ScrubAuthRedirect())

          def source_for(filename):
              url=bypath[prefix+filename].get("url","")
              parsed=urllib.parse.urlparse(url)
              host=(parsed.hostname or "").lower()
              assert parsed.scheme=="https" and host, "Invalid artifact URL"
              if not (host=="circleci.com" or host.endswith(".circleci.com")
                      or host.endswith(".amazonaws.com")
                      or host.endswith(".cloudfront.net")
                      or host=="circle-artifacts.com"
                      or host.endswith(".circle-artifacts.com")
                      or host=="storage.googleapis.com"):
                  print("PR286_ARTIFACT_STORAGE_HOST_TO_REVIEW="+host)
                  raise AssertionError("Unrecognized artifact storage")
              headers={"User-Agent":"weex-pr286-verified-private-apk"}
              # Private CircleCI artifacts require the read token on the official
              # artifact host; the redirect handler removes it before cloud storage.
              if (host=="circleci.com" or host.endswith(".circleci.com")
                  or host=="circle-artifacts.com" or host.endswith(".circle-artifacts.com")):
                  headers["Circle-Token"]=token
              return opener.open(urllib.request.Request(url,headers=headers),timeout=120)
          def small(filename,limit=250000):
              with source_for(filename) as r:
                  data=r.read(limit+1)
              assert len(data)<=limit, "Unexpectedly large metadata"
              return data.decode("utf8")
          expected_sha=small("apk-sha256.txt").strip().split()[0].lower()
          assert re.fullmatch(r"[0-9a-f]{64}",expected_sha)
          provenance={}
          for line in small("candidate-provenance.txt").splitlines():
              if "=" in line:
                  k,v=line.split("=",1)
                  assert k.strip() not in provenance, "Duplicate provenance field"
                  provenance[k.strip()]=v.strip()
          assert provenance.get("source")=="610287e3bc69155fa6c2ac290902879689d7e3fd"
          assert provenance.get("green_source")=="b47b877476e308ba99cfa3ceb569132405c95c24"
          assert provenance.get("previousOTA")=="30536366"
          assert provenance.get("previousPrivate")=="30629089"
          assert provenance.get("private_only")=="true"
          assert provenance.get("ota_publication")=="false"
          version=int(provenance["versionCode"])
          assert 30629089 < version <= 2100000000
          print("PR286_SIGNED_SOURCE_PROVENANCE_VERIFIED")
          print("PR286_SIGNED_VERSION_CODE="+str(version))
          canonical="5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"
          cert=small("signing-certificate.txt")
          # Match ALL three formats admitted by the canonical APK signer gate:
          # numbered signer, minSdk-qualified signer, and v2/v3 scheme-labelled signer.
          signer_patterns=(
              r"(?mi)^\s*Signer\s+#\d+\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",
              r"(?mi)^\s*Signer\s+\([^\r\n)]*\)\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",
              r"(?mi)^\s*V\d+(?:\.\d+)?\s+Signer:\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",
          )
          digests={value.replace(":","").lower()
                   for pattern in signer_patterns for value in re.findall(pattern,cert)}
          print("PR286_SIGNER_DIGEST_IDENTITIES="+str(len(digests)))
          assert digests=={canonical}, "Signer differs from original OTA certificate"
          print("PR286_CANONICAL_SIGNER_VERIFIED="+canonical)
          release=json.loads(small("release.json"))
          assert isinstance(release,dict)
          for k in ("versionCode","version_code"):
              if k in release:
                  assert int(release[k])==version, "release.json version mismatch"
          print("PR286_RELEASE_JSON_VALID")
          h=hashlib.sha256()
          size=0
          first=b""
          with source_for("WEEX-IA-Trader-release.apk") as r, open("/tmp/pr286-exact-private.apk","wb") as out:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk:break
                  if not first:first=chunk[:4]
                  size+=len(chunk)
                  assert size<=200*1024*1024, "Unexpectedly large APK"
                  h.update(chunk)
                  out.write(chunk)
          assert first==b"PK\x03\x04", "Artifact not a ZIP/APK"
          assert size>10*1024*1024, "APK unexpectedly small"
          assert h.hexdigest()==expected_sha,"APK bytes differ from CircleCI SHA256"
          print("PR286_SIGNED_APK_SHA256_MATCH="+h.hexdigest())
          print("PR286_SIGNED_APK_SIZE_BYTES="+str(size))
          with open("/tmp/pr286-exact-private.version","w") as f:f.write(str(version))
          print("PR286_PRIVATE_ARTIFACT_BYTES_AND_METADATA_PASS_NO_OTA")
          PY
      - name: Independently verify signed APK bytes with Android SDK (NO OTA)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/pr286-exact-private.apk /tmp/pr286-exact-private.version /tmp/pr286-cert.txt /tmp/pr286-badging.txt' EXIT
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$signer"
          test -x "$aapt"
          "$signer" verify --verbose --print-certs /tmp/pr286-exact-private.apk > /tmp/pr286-cert.txt
          "$aapt" dump badging /tmp/pr286-exact-private.apk > /tmp/pr286-badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          cert=Path("/tmp/pr286-cert.txt").read_text()
          patterns=(r"(?mi)^\s*Signer\s+#\d+\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",r"(?mi)^\s*Signer\s+\([^\r\n)]*\)\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$",r"(?mi)^\s*V\d+(?:\.\d+)?\s+Signer:\s+certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F:]+)\s*$")
          actual={v.replace(":","").lower() for p in patterns for v in re.findall(p,cert)}
          assert actual=={"5d0698ff9d09d7928944d01260d30b277ca4d20bd52c6cc583147b436b6c22e6"}
          badging=Path("/tmp/pr286-badging.txt").read_text()
          version=Path("/tmp/pr286-exact-private.version").read_text().strip()
          assert re.search(r"(?m)^package: name='com\.wilito\.weexautotrader' versionCode='"+re.escape(version)+"'",badging)
          print("PR286_ACTUAL_APK_SIGNER_PACKAGE_VERSION_PASS")
          print("PR286_PRIVATE_ARTIFACT_INDEPENDENT_AUDIT_PASS_NO_OTA")
          PY

  report-audit-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: Report exact audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=weex/pr286/signed-artifact-audit \
            -f description="Private audit pending; no OTA" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  report-audit-finish:
    if: ${{ always() }}
    needs: [independent-audit, report-audit-start]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: Report exact independent audit result
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESULT: ${{ needs.independent-audit.result }}
        run: |
          case "$QA_RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=weex/pr286/signed-artifact-audit \
            -f description="Private audit: $QA_RESULT; no OTA" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
