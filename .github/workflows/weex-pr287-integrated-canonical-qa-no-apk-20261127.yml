      statuses: write
    steps:
      - name: Expose terminal QA result
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RESULT: ${{ needs.pr192-integrated-source-qa.result }}
        run: |
          state=failure
          if [ "$QA_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=weex/pr287-integrated-qa \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Exact source QA $QA_RESULT; no APK"
