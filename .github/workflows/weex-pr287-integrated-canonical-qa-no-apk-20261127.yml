# Source QA only. Does NOT build/sign an APK, access WEEX, deploy Neon, or publish OTA.
name: WEEX PR287 integrated canonical QA NO APK
on:
  push:
    branches: [qa/weex-pr287-integrated-20261127]
    paths:
      - .github/workflows/weex-pr287-integrated-canonical-qa-no-apk-20261127.yml
permissions:
  contents: read
jobs:
  report-qa-start:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Expose QA run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=weex/pr287-integrated-qa \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Exact source QA started; no APK"
