# Immutable PR287 Android ART/DEX smoke, ephemeral debug key; NO signing release, WEEX, Neon calls, or OTA.
name: WEEX PR287 Neon REAL progress offline ART DEX reinstalacion NO OTA
on:
  push:
    branches: [qa/weex-pr287-integrated-20261127]
    paths:
      - .github/workflows/weex-pr287-offline-art-dex-reinstall-no-ota-20261127.yml
permissions:
  contents: read
jobs:
  art-dex-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      SOURCE_SHA: 70d112b92737682f0feabcf4ba5c4a2d84f653be
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      WEEX_AUDIT_RUN_ANDROID_JUNIT: "1"
      WEEX_QA_OWNER_INTEGRATION: "1"
      WEEX_ART_QA_EXPORT_MATERIALIZED: "1"
      WEEX_ART_QA_EXPORT_DIR: /tmp/weex-pr287-art-materialized
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout immutable private source, no write credentials
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 70d112b92737682f0feabcf4ba5c4a2d84f653be
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Confirm source and preserve owner release separation
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object .circleci/config.yml)" = 526ef068749a56867cda550ee22f25adaa9c3ed5
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/NeonTransportFailureDiagnostic.kt)" = 3418d48e3680e620cd6af43ec1456109e89a783a
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/MainActivity.kt)" = e0e9f9623cdab3d2a53e1b0dbd92f2a700fe3a42
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealProfitStopGateChartStatus.kt)" = dbe7cf9f6c5b00125b9257ed3a8615b2da1ce6d0
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealProfitStopGateChartStatusTest.kt)" = 40e1e4dd0d296ccf1f730c43b31812122139bc98
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicy.kt)" = a74aa0d0ab074b510aafa145486dd51027981ce9
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicyTest.kt)" = 992f29706f24771ff3ce354c5650c662eef1403f
          grep -Fq 'RealProfitStopGateChartStatus.message(' app/src/main/java/com/wilito/weexautotrader/MainActivity.kt
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealAppliedLearningCertifiedClosePipeline.kt)" = 46fdc0332a43004cb935680d633ec0a3bb08ad3d
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealOriginalDecisionDraftStore.kt)" = 75d7d2e89adb9db12d6467e57b59f38048c94c86
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealBotAcceptedEntryStudyPolicy.kt)" = c3d65225528cd6b10d6f272bfe93e7a4cd786be5
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealAppliedExperienceAdvisor.kt)" = 2197dc89a17dcee7926fe9b633adfbc52fb96736
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealAppliedExperienceArchivePolicy.kt)" = 0cb7d97f493fdcf0d0fdcbbb5326f9744c298cbf
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealOriginalDecisionDraftPolicyTest.kt)" = 69b58635d2e8b0bd66e5ce5dc998208a4aa47ab1
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealAppliedExperienceAdvisorTest.kt)" = 63ce5ac283ceed5afe3e46eaae731a698212f05d
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/WithdrawalSetupDialog.kt)" = 3fba862069ba9e34abcd04e14556463a4fce95c0
          test ! -e app/weex-ia-signing.jks
          python3 ci/verify_manual_build_only.py
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/SimulationExecutionCostModel.kt)" = aa5422d61435b9eadefce8fff54e225e36dcd18f
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/PaperTradingEngine.kt)" = c1c1560f269d95b0d0145d5eb77e3fca0c00ab55
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/SequentialCapitalStudyPolicy.kt)" = 65662cedc7f22454a33a785461ffaa1da31e2c4e
          test "$(git hash-object ci/verify_owner_single_slot_standby_v1.py)" = a38ba737992cc8c57122ee5b82aaaa9435c116fe
          test "$(git hash-object ci/verify_final_real_limit_structural_geometry_v1.py)" = c0f67b1d058eb6c6bdfb57e5ad587a9212bfcec2
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealCombinedContinuousNetProfitCoordinator.kt)" = f0d18c8a94730704687de6f856dd6d863b1bbcd0
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPositionOriginPolicy.kt)" = 6ff2f65bb80ab68db68a16aaf5e4e44d20ab6859
          test "$(git hash-object app/src/main/java/com/wilito/weexautotrader/RealPositionOriginResolver.kt)" = 122a469d3caf6f059c6e7a8bc3affc540c9e5633
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealCombinedSignedEvidenceStudyPolicyTest.kt)" = 4f28508bd51f554f60fd845b990184da0bf97d44
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealCombinedUniqueBotPositionCandidatePolicyTest.kt)" = e15b21622c7b475ab0d06c133f32aff0192408c4
          test "$(git hash-object app/src/test/java/com/wilito/weexautotrader/RealPositionOriginPolicyTest.kt)" = 4a482f6b6fab7628268fc8ae82615d141749c6b1
          echo PR287_ART_SOURCE_PINNED_NO_RELEASE_SIGNER
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35 and pinned Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -n "$MANAGER"
            "$MANAGER" 'platforms;android-35' >/dev/null
          fi
          curl -fsSL --retry 3 --retry-delay 3 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/pr287-gradle.zip
          printf '%s  %s\n' '31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26' /tmp/pr287-gradle.zip | sha256sum -c -
          mkdir -p "$HOME/.gradle-dist"
          unzip -q -o /tmp/pr287-gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Canonical materialization, Android JUnit and disposable debug DEX
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          # Full source + JUnit proof is mandatory BEFORE debug APK creation.
          if ! python3 ci/preflight_full_presigning_source_v1.py >/tmp/pr287-art-presign.log 2>&1; then
            echo "::error::PR287_ART_CANONICAL_PRESIGN_FAILED_NO_OTA"
            grep -E 'WEEX_PRESIGN_FIRST_FAILURE_LINE|PRESIGN_FAILURE_CONTEXT|WEEX_AUDIT_JUNIT_FAILED_TESTS_COUNT|AUDIT_JUNIT_FAILED|WEEX_AUDIT_KOTLIN_FIRST_ERROR|WEEX_PREFLIGHT_BLOCKED' /tmp/pr287-art-presign.log | tail -70 || true
            exit 1
          fi
          grep -Fq 'WEEX_AUDIT_JUNIT_PASS' /tmp/pr287-art-presign.log
          grep -Fq 'WEEX_PRESIGN_SOURCE_REPLAY_PASS' /tmp/pr287-art-presign.log
          grep -Fq 'OWNER_INTEGRATION_MATERIALIZED_CONNECTIONS_PRESENT' /tmp/pr287-art-presign.log
          FINAL=/tmp/weex-pr287-art-materialized/main/java/com/wilito/weexautotrader
          test -s "$FINAL/TraderService.kt"
          test -s "$FINAL/NeonTransportFailureDiagnostic.kt"
          test -s "$FINAL/RealAppliedLearningCertifiedClosePipeline.kt"
          test -s "$FINAL/CausalPricePathForecastStudy.kt"
          test -s "$FINAL/RealContinuousImprovementContinuityPolicy.kt"
          test "$(grep -Fc 'SimulationExecutionCostModel.estimatedOpenStopRiskCash(' "$FINAL/PaperTradingEngine.kt")" = 3
          test "$(grep -Fc 'currentOpenRiskUsd=currentOpenRiskUsd' "$FINAL/RealDecisionPlanner.kt")" = 2
          grep -Fq 'fun estimatedOpenStopRiskCash(' "$FINAL/SimulationExecutionCostModel.kt"
          grep -Fq 'A26_EXPLICIT_FLAT_RISK_HANDOFF_V1' "$FINAL/TraderService.kt"
          grep -Fq 'fun studyCoherentCombinedPortfolioRisk(' "$FINAL/SequentialCapitalStudyPolicy.kt"
          grep -Fq 'val pages=protection.completeSignedPages?:return null' "$FINAL/SequentialCapitalStudyPolicy.kt"
          grep -Fq 'val capturedPortfolio=signedPositions.toList()' "$FINAL/RealCombinedContinuousNetProfitCoordinator.kt"
          grep -Fq 'if(position.separatedOpenOrderId !in uniqueOpeningIds)continue' "$FINAL/RealPositionOriginResolver.kt"
          grep -Fq 'LaunchedEffect(destinationLoaded)' "$FINAL/WithdrawalSetupDialog.kt"
          grep -Fq 'if(destinationLoaded)refreshPublicNetworks()' "$FINAL/WithdrawalSetupDialog.kt"
          grep -Fq 'if(!destinationLoaded||savingDestination||loading)return' "$FINAL/WithdrawalSetupDialog.kt"
          test -s app/src/test/java/com/wilito/weexautotrader/RealContinuousImprovementContinuityPolicyTest.kt
          test -s app/src/test/java/com/wilito/weexautotrader/CausalPricePathForecastStudyTest.kt
          grep -Fq 'RealVerifiedLearningProgressCard(' "$FINAL/MainActivity.kt"
          grep -Fq 'optionalProfitStopFreshOwnerAuthority' "$FINAL/Diagnostics.kt"
          test -s "$FINAL/RealProfitStopGateChartStatus.kt"
          grep -Fq 'RealProfitStopGateChartStatus.message(' "$FINAL/MainActivity.kt"
          # Only an ephemeral exported source tree is modified; original
          # canonical signed source in Git remains untouched and pinned.
          rsync -a --delete /tmp/weex-pr287-art-materialized/main/ app/src/main/
          cp /tmp/weex-pr287-art-materialized/build.gradle.kts app/build.gradle.kts
          # Original RELEASE keystore must NEVER be sourced by an offline test.
          test ! -e app/weex-ia-signing.jks
          keytool -genkeypair -keystore app/weex-ia-signing.jks -storepass android -keypass android -alias weexia -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=PR287-OFFLINE-TEST-ONLY,OU=DISPOSABLE,O=NEVER-RELEASE' >/dev/null 2>&1
          test -s app/weex-ia-signing.jks
          # Emulator-specific x86_64 and AndroidX test-only dependencies.
          # This is a disposable CI checkout; do NOT commit to production.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text(encoding="utf-8")
          abi='abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))'
          assert s.count(abi)==1, "PR287_ART_ABI_BASE_CHANGED"
          s=s.replace(abi,'abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86_64"))',1)
          default='    defaultConfig {'
          assert s.count(default)==1, "PR287_ART_DEFAULTCONFIG_BASE_CHANGED"
          s=s.replace(default,default+'\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"',1)
          dep='    testImplementation("junit:junit:4.13.2")'
          assert s.count(dep)==1, "PR287_ART_JUNIT_BASE_CHANGED"
          s=s.replace(dep,dep+
              '\n    androidTestImplementation("androidx.test:runner:1.6.2")'+
              '\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")',1)
          p.write_text(s,encoding="utf-8")
          print("PR287_DISPOSABLE_EMULATOR_ONLY_ABI_AND_JUNIT_DEPENDENCIES")
          PY
          mkdir -p app/src/androidTest/java/com/wilito/weexautotrader
          cat > app/src/androidTest/java/com/wilito/weexautotrader/Pr287OfflineArtTest.kt <<'KOTLIN'
          package com.wilito.weexautotrader

          import android.content.Context
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class Pr287OfflineArtTest {
              private val context:Context
                  get()=InstrumentationRegistry.getInstrumentation().targetContext

              @Test fun criticalClassesLoadWithoutStartingLiveTrading() {
                  val classes=listOf(
                      "com.wilito.weexautotrader.TraderService",
                      "com.wilito.weexautotrader.RealCombinedContinuousNetProfitCoordinator",
                      "com.wilito.weexautotrader.NeonTransportFailureDiagnostic",
                      "com.wilito.weexautotrader.ConnectionRouteReadOnlyPolicy",
                      "com.wilito.weexautotrader.RealAppliedLearningCertifiedClosePipeline",
                      "com.wilito.weexautotrader.RealAppliedLearningLedgerCoordinator",
                      "com.wilito.weexautotrader.RealVerifiedLearningProgressPolicy",
                      "com.wilito.weexautotrader.RealProfitStopGateChartStatus",
                      "com.wilito.weexautotrader.CausalPricePathForecastStudy",
                      "com.wilito.weexautotrader.RealContinuousImprovementContinuityPolicy",
                      "com.wilito.weexautotrader.RealOriginalDecisionDraftPolicy",
                      "com.wilito.weexautotrader.RealBotAcceptedEntryStudyPolicy",
                      "com.wilito.weexautotrader.RealAppliedExperienceAdvisor",
                      "com.wilito.weexautotrader.RealAppliedExperienceArchivePolicy",
                      "com.wilito.weexautotrader.RealLearningAdviceBackground",
                      "com.wilito.weexautotrader.RealPortfolioOrderScope",
                      "com.wilito.weexautotrader.SimulationExecutionCostModel",
                      "com.wilito.weexautotrader.SequentialCapitalStudyPolicy",
                      "com.wilito.weexautotrader.PaperTradingEngine",
                      "com.wilito.weexautotrader.RealDecisionPlanner",
                      "com.wilito.weexautotrader.RealPositionOriginPolicy",
                      "com.wilito.weexautotrader.RealPositionOriginResolver"
                  )
                  for(name in classes) assertTrue(name,Class.forName(name)!=null)
              }

              @Test fun writeUpgradeSentinel() {
                  assertTrue(context.getSharedPreferences(
                      "pr287_disposable_art",Context.MODE_PRIVATE
                  ).edit().putString("check","PR287_KEEP_DATA").commit())
              }

              @Test fun verifyUpgradeSentinel() {
                  assertEquals("PR287_KEEP_DATA",context.getSharedPreferences(
                      "pr287_disposable_art",Context.MODE_PRIVATE
                  ).getString("check",null))
              }
          }
          KOTLIN
          if ! gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest > /tmp/pr287-art-gradle.log 2>&1; then
            echo "::error::PR287_OFFLINE_DEX_BUILD_FAILED"
            grep -E '^e: |^error: |FAILURE:|Execution failed for' /tmp/pr287-art-gradle.log | tail -70 || true
            tail -25 /tmp/pr287-art-gradle.log || true
            exit 1
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo PR287_DISPOSABLE_DEBUG_DEX_BUILD_PASS_NO_RELEASE_NO_OTA
      - name: Enable KVM for isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build offline emulator test script
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pr287-art-offline-runner.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          fail() {
            local rc="$?" line="$1"
            trap - ERR
            echo "::error::PR287_OFFLINE_ART_FAILED_LINE=$line rc=$rc"
            for file in /tmp/pr287-first-launch.log /tmp/pr287-relaunch.log /tmp/pr287-dex.log /tmp/pr287-data-write.log /tmp/pr287-data-read.log; do
              if [ -f "$file" ]; then echo "ART_DIAG_FILE=$file"; tail -28 "$file" || true; fi
            done
            adb logcat -d -b crash | tail -100 || true
            exit "$rc"
          }
          trap 'fail "$LINENO"' ERR
          cd "$GITHUB_WORKSPACE/source"
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global airplane_mode_on 1
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb install -r "$APP"
          adb install -r "$TEST"
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr287-first-launch.log
          grep -Fq 'Status: ok' /tmp/pr287-first-launch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr287-crashes; then
            echo "::error::PR287_VERIFYERROR_OR_STARTUP_CRASH"; exit 1
          fi
          for spec in criticalClassesLoadWithoutStartingLiveTrading writeUpgradeSentinel; do
            timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class "com.wilito.weexautotrader.Pr287OfflineArtTest#$spec" com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner > "/tmp/pr287-$spec.log"
            grep -Fq 'OK (1 test)' "/tmp/pr287-$spec.log" || { tail -55 "/tmp/pr287-$spec.log"; exit 1; }
          done
          adb install -r "$APP"
          timeout --signal=TERM --kill-after=10s 90s adb shell am instrument -w -e class com.wilito.weexautotrader.Pr287OfflineArtTest#verifyUpgradeSentinel com.wilito.weexautotrader.test/androidx.test.runner.AndroidJUnitRunner >/tmp/pr287-data-read.log
          grep -Fq 'OK (1 test)' /tmp/pr287-data-read.log
          adb logcat -c
          adb shell am start -W -n com.wilito.weexautotrader/.LauncherActivity >/tmp/pr287-relaunch.log
          grep -Fq 'Status: ok' /tmp/pr287-relaunch.log
          sleep 9
          test -n "$(adb shell pidof com.wilito.weexautotrader | tr -d '\r')"
          if adb logcat -d -b crash | grep -E 'FATAL EXCEPTION|VerifyError' >/tmp/pr287-crashes; then
            echo "::error::PR287_POST_REINSTALL_VERIFYERROR"; exit 1
          fi
          echo PR287_ANDROID35_ART_DEX_OFFLINE_REINSTALL_DATA_PASS_NO_ORDERS_NO_OTA
          RUNNER
          bash -n /tmp/pr287-art-offline-runner.sh
          chmod 700 /tmp/pr287-art-offline-runner.sh
      - name: Verify ART startup, class-load and in-place upgrade with data retained
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash /tmp/pr287-art-offline-runner.sh

  report-art-start:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Link isolated ART run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=weex/pr287-offline-art \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Offline disposable Android ART started"
  report-art-finish:
    if: ${{ always() }}
    needs: [art-dex-offline, report-art-start]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record terminal ART result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.art-dex-offline.result }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=weex/pr287-offline-art \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Offline disposable Android ART: $RESULT"
