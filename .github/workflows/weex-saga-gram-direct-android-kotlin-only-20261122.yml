# Build verification only: no signing key, no APK assembly, no WEEX API and no OTA.
name: WEEX SAGA GRAM pinned Android Kotlin and JUnit no APK no OTA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/weex-saga-gram-direct-android-kotlin-only-20261122.yml
permissions:
  contents: read
jobs:
  android-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 7dfa2730c8a3ddac93381d90bfcc736223dc2b17
      WEEX_ALLOW_DIRECT_PUBLISH: "false"
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
    steps:
      - name: Checkout exact private tested source
        uses: actions/checkout@v4
        with:
          repository: wilitohtc24-jpg/weex-auto-trader-android
          ref: 7dfa2730c8a3ddac93381d90bfcc736223dc2b17
          token: ${{ secrets.WEEX_SOURCE_RELEASE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile complete Android source and run SAGA/GRAM tests without assembling APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e app/weex-ia-signing.jks
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" "platforms;android-35" >/dev/null
          fi
          if ! gradle --no-daemon --console=plain :app:compileDebugKotlin :app:testDebugUnitTest --tests 'com.wilito.weexautotrader.RealBotTpSlParentOrderStudyPolicyTest' > /tmp/weex-saga-android-qa.log 2>&1; then
            python3 - <<'PY'
          from pathlib import Path
          log=Path("/tmp/weex-saga-android-qa.log").read_text(errors="replace").splitlines()
          signatures=("e: ","error:","FAILURE:","What went wrong:","Execution failed","Could not resolve","Task :app:")
          lines=[x for x in log if any(s in x for s in signatures)]
          for x in lines[-22:]: print("SAGA_GRAM_QA_LOG: "+x[:350])
          print("SAGA_GRAM_ANDROID_UNIT_REGRESSION_FAILED_NO_OTA")
          PY
            exit 1
          fi
          test -z "$(find app/build/outputs -name '*.apk' -type f -print -quit 2>/dev/null || true)"
          echo SAGA_GRAM_ANDROID_KOTLIN_AND_JUNIT_PASS_NO_APK_NO_OTA
